bout 12 fps, loops forever, using gifenc with\none shared palette.<\/p><\/li>\n<li><p>Embed both encoder libraries inside the HTML file (no CDN links),\nso it works without internet.<\/p><\/li>\n<\/ul>\n<p>OUTPUT One .html file that runs as is in Chrome or Edge.<\/p>", "excerpt": "https://www.adobe.com/in/creativecloud/file-types/image/vector/svg-file.html The SVG file format is a popular tool for displaying two-dimensional graphics, char"}, {"part": 1, "title": "Animate Static SVG", "kind": "Article", "imgs": ["imgs/v19_0.jpg"], "thumb": "imgs/v19_0_t.jpg", "inline": false, "html": "<p><a target=\"_blank\" rel=\"noopener\" href=\"https://undraw.co/illustrations\">https://undraw.co/illustrations<\/a><\/p>\n\n<p><strong>Prompt:<\/strong><\/p>\n<p>I've attached an SVG illustration. Turn it into a single\nself-contained HTML file that animates it.<\/p>\n<p>Rules:<\/p>\n<p>- Keep the illustration exactly as it is: same shapes, colours,\nlayout and proportions. Do not redraw, restyle or simplify anything.<\/p>\n<p>- Only add motion. You may wrap existing elements in groups so they\ncan move, but don't change their path data.<\/p>\n<p>- Use only CSS and SVG animation (plus minimal vanilla JS if needed).\nNo external libraries.<\/p>\n<p>Animate it like this:<\/p>\n<p>- Head: a gentle, steady nod, like someone listening to music. Hair\nand headphones move with the head.<\/p>\n<p>- Upper body: a slow, subtle sway, pivoting at the hips. Legs stay\nstill.<\/p>\n<p>- Music player: the screen gently pulses in time with the nod.<\/p>\n<p>- Music notes: add 3–4 small notes in the illustration's accent\ncolour that float up from the headphones, drift sideways and fade out,\nstaggered so they flow continuously.<\/p>\n<p>- Clouds: drift slowly left and right, each at a different speed.<\/p>\n<p>- Buildings: a few random windows softly light up in a pale tint of\nthe accent colour, then fade back.<\/p>\n<p>Make the motion smooth, loop seamlessly and stay subtle; it should\nfeel calm, not busy.<\/p>\n<p>Layout:<\/p>\n<p>- Centre the illustration on a white page, scaling to fit any screen\nwidth, including mobile.<\/p>\n<p>- Respect prefers-reduced-motion by turning the animation off for\nthose users.<\/p>", "excerpt": "https://undraw.co/illustrations Prompt: I've attached an SVG illustration. Turn it into a single self-contained HTML file that animates it. Rules: - Keep the il"}, {"part": 1, "title": "Kanban", "kind": "Article", "imgs": ["imgs/v20_0.jpg", "imgs/v20_1.jpg", "imgs/v20_2.jpg"], "thumb": "imgs/v20_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single self-contained HTML file: an interactive Kanban board\nfor tracking a company's AI adoption programme. No external libraries,\nfonts or images. All CSS and JS inline.<\/p>\n<p>LAYOUT<\/p>\n<p>- Fixed 1600×900 (16:9) stage, scaled with a CSS transform to fit and\ncentre in any window (recalculate on resize). Page background slightly\ndarker than the stage.<\/p>\n<p>- Add print CSS: @page 1600×900, no margins, no transform when\nprinting, and keep background colours.<\/p>\n<p>- Helvetica/Arial, 14px base. Flat, clean style: 4px corner radius,\nthin borders, minimal shadows.<\/p>\n<p>- Define all colours as CSS variables on :root, with a full dark\ntheme that applies under prefers-color-scheme: dark (unless\ndata-theme=\"light\") and also under :root[data-theme=\"dark\"].<\/p>\n<p>BOARD<\/p>\n<p>- Four equal columns: To do (slate), In progress (blue), Review\n(orange), Done (green). Each column has a 4px top border in its colour,\nits name in that colour, and a pill showing how many cards it holds. The\ncard list scrolls inside the column.<\/p>\n<p>- Each card has:<\/p>\n<p>- a left border in its tag colour<\/p>\n<p>- top row: a tag pill (tinted with the tag colour) and the priority\n(High red, Medium amber, Low grey)<\/p>\n<p>- a bold title<\/p>\n<p>- a thin green progress bar<\/p>\n<p>- bottom row: the owner's initials avatar (a coloured circle), \"N\nsubtasks · done/total\", and \"Due DD Mon\"<\/p>\n<p>- Cards lift slightly on hover.<\/p>\n<p>- Drag and drop moves a card between columns. While dragging, the\ntarget column gets a dashed outline and the dragged card fades. A\ndropped card goes to the bottom of its new column.<\/p>\n<p>- Cards are keyboard-focusable; Enter or Space opens them.<\/p>\n<p>- Footer: a one-line usage hint on the left, \"Sample data\" on the\nright.<\/p>\n<p>DETAIL DRAWER (two levels)<\/p>\n<p>- Clicking a card slides in a 600px drawer from the right over a dim\nscrim. The selected card gets a blue ring.<\/p>\n<p>- Drawer header: a back arrow (shown only at level 2), breadcrumbs\n(Board › Task › Subtask, each clickable), a \"Detail level 1/2\" pill, and\na close button.<\/p>\n<p>- Level 1 (task):<\/p>\n<p>- tag, large title, description<\/p>\n<p>- 2×2 facts grid: a Status dropdown that moves the card between\ncolumns, Owner with avatar, Due date with 2026 appended, Priority<\/p>\n<p>- an overall progress bar with %, calculated from all checklist items\nacross all subtasks<\/p>\n<p>- a list of subtask buttons, each showing avatar, title, \"owner ·\neffort · x/y done\", a status badge (Not started / In progress / Done)\nand a chevron<\/p>\n<p>- Level 2 (subtask):<\/p>\n<p>- tag, title, \"Part of: [task]\"<\/p>\n<p>- facts grid: Owner, Effort, Status badge, Checklist x of y<\/p>\n<p>- Notes<\/p>\n<p>- a checklist with ticked items struck through. Ticking or unticking\nan item updates the board card live and adds \"Completed: …\" or\n\"Reopened: …\" to the activity log.<\/p>\n<p>- an activity log, newest first, drawn as a vertical timeline with\ndots<\/p>\n<p>- The drawer body animates sliding forward or back when changing\nlevel.<\/p>\n<p>- Esc goes back one level and closes the drawer from level 1.\nClicking the scrim closes it.<\/p>\n<p>- Escape all text before inserting it into the HTML.<\/p>\n<p>SAMPLE DATA<\/p>\n<p>Five people, each with a distinct avatar colour: Asha Menon, Rohan\nGupta, Meera Joshi, Dev Kapoor, Kavya Nair.<\/p>\n<p>Tags and colours: Governance (purple), Enablement (blue), Engagement\n(pink), Rollout (teal), Insights (orange), Pilot (yellow), Comms\n(cyan).<\/p>\n<p>Ten tasks, each with a description and 2–3 subtasks. Each subtask has\nan owner, an effort estimate, notes, a 3–4 item checklist (some items\nalready done) and dated activity entries from Aug–Sep.<\/p>\n<p>- To do: Draft AI usage policy, Prompt library for Finance, Plan\ninternal hackathon<\/p>\n<p>- In progress: Licence rollout wave 2, Readiness survey analysis,\nSales email assistant pilot<\/p>\n<p>- Review: Monthly newsletter issue 4, Leadership dashboard<\/p>\n<p>- Done: Kick-off workshop, Tool shortlist<\/p>\n<p>Use realistic details, e.g. 148 users assigned licences, onboarding\nsessions with ~40 attendees, 386 clean survey responses, a pilot logging\n146 drafts at 4.2/5 satisfaction.<\/p>", "excerpt": "Prompt: Build a single self-contained HTML file: an interactive Kanban board for tracking a company's AI adoption programme. No external libraries, fonts or ima"}, {"part": 1, "title": "3D Models", "kind": "Article", "imgs": ["imgs/v21_0.jpg"], "thumb": "imgs/v21_0_t.jpg", "inline": false, "html": "<p><a target=\"_blank\" rel=\"noopener\" href=\"https://get.webgl.org/\">https://get.webgl.org/<\/a><\/p>\n\n<p><strong>Prompt:<\/strong><\/p>\n<p>Create an interactive 3D exploded view of an Amber Enterprises\nthree-axis Cartesian gantry robot, presented at a three-quarter angle in\na near-black industrial photography studio. Give it the precision and\nfinish of a premium engineering showcase, with soft white strip\nreflections, subtle warm and cool rim highlights, a dark polished\nconcrete floor with faint grid lines, and a softly backlit wall that\nseparates the frame silhouette from the background. The gantry should\nrotate slowly on a turntable while its components separate along their\nown axes of motion.<\/p>\n<p>Show the gantry construction in a staged teardown: anodized aluminium\nbase frame with T-slot extrusions and corner gussets, levelling feet\nwith rubber pads, twin X-axis linear guide rails with recirculating ball\ncarriages, toothed timing belt with idler and drive pulleys, Y-axis\nbridge beam, Z-axis vertical ball-screw module with lead screw, support\nbearings and flexible coupling, three servo motors with planetary\ngearboxes and encoder caps, cable drag chain carrying colour-coded\nwiring, inductive proximity sensors and limit switches, pneumatic end\neffector with parallel gripper and four vacuum suction cups,\nquick-change tool plate, and a control cabinet with PLC, servo drives,\nterminal blocks, and a green circuit board with gold contacts. Include a\nwired teach pendant with a red emergency-stop button and detailed screen\nand keypad on both faces. Keep the Y-axis bridge, its carriages, and its\ndrag chain together as one moving assembly. Space the components so they\nremain clear of one another throughout disassembly and reassembly.<\/p>\n<p>Make the materials convincing at close range: clear-anodized brushed\naluminium, black powder-coated steel, ground and polished chrome rails,\nmachined bearing blocks with fine tool marks, satin black motor housings\nwith cooling fins, rubber timing belts with crisp tooth profiles,\ntranslucent blue pneumatic tubing, orange and grey cable insulation,\ncopper conductors at stripped ends, and yellow-black hazard striping on\nthe frame edges. Give each ball screw and rail a distinct specular\nhighlight so thin parts remain readable against the dark background.\nEngraved axis labels (X, Y, Z), the AMBER nameplate on the bridge beam,\nmotor rating plates, travel-limit markings, and a millimetre scale along\nthe X rail should remain crisp. Add direction-of-travel arrows, a\nhome-position marker, and an orange caution label near the gripper.<\/p>\n<p>Provide separate sliders for exploded-view amount, X/Y/Z jog\nposition, and gripper open/close, plus an automatic demonstration that\nsmoothly runs a pick-and-place cycle (lifting a copper heat-exchanger\ncoil from an infeed conveyor and placing it on a fixture), then\ndisassembles and reassembles the machine. Use staggered movement to\nreveal the frame, motion axes, drive train, end effector, and controls\nin sequence. Fade in fine leader-line labels as the gantry opens, and\nreposition them smoothly so they do not overlap. Keep the composition\ncalm and legible, with realistic metal reflections, soft contact\nshadows, and controlled highlights throughout.<\/p>", "excerpt": "https://get.webgl.org/ Prompt: Create an interactive 3D exploded view of an Amber Enterprises three-axis Cartesian gantry robot, presented at a three-quarter an"}, {"part": 1, "title": "Motion Video", "kind": "Article", "imgs": ["imgs/v15_0.jpg", "imgs/v22_1.jpg"], "thumb": "imgs/v22_1_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>You are a sharp business analyst and motion designer. Analyse the\nExcel data I've attached and present the insights as a short motion\nvideo built in a single self-contained HTML file.<\/p>\n<p>STEP 1 — UNDERSTAND THE DATA<\/p>\n<p>- Identify what each column is: dimensions (region, product, person,\ncustomer, date) and measures (quantity, price, value, cost).<\/p>\n<p>- If a total/value column is missing, derive it (e.g., Qty × Unit\nPrice). State the date range, row count and the main unit of\ncurrency.<\/p>\n<p>- Flag anything odd (missing values, outliers, duplicate IDs) in one\nline. Don't stop for it.<\/p>\n<p>STEP 2 — FIND THE STORY (compute, don't estimate)<\/p>\n<p>Run the actual numbers and pick the 6–8 strongest insights, choosing\nfrom:<\/p>\n<p>- Headline KPIs: total value, total volume, average per record,\nlargest single record<\/p>\n<p>- Trend over time: run-rate or cumulative line, if dates exist<\/p>\n<p>- Mix: share of value by the main category dimension<\/p>\n<p>- Volume vs value gaps: items that move many units but earn little,\nand the reverse<\/p>\n<p>- Geography / segment split: who is strong, who is under-covered<\/p>\n<p>- People / owner performance: top contributors and concentration\n(e.g., top 3 = X%)<\/p>\n<p>- Concentration risk: share held by the top few records or\ncustomers<\/p>\n<p>- Price or product ladders, premium vs standard mix, if visible in\nthe data<\/p>\n<p>Every insight must be a specific, quantified claim (e.g., \"North and\nWest bring 58% of value\"). It must not be a description like \"Sales vary\nby region\". Percentages must add up. Double-check all arithmetic.<\/p>\n<p>STEP 3 — BUILD THE MOTION VIDEO (HTML)<\/p>\n<p>- A 16:9 stage (1280×720, scaled to fit the screen), auto-playing\n8–10 scenes of 6–8 seconds each (about 60 seconds total).<\/p>\n<p>- Scene flow: Title (headline number counts up) → KPIs + trend → 4–6\ninsight scenes → Top records → 3 recommended actions → close.<\/p>\n<p>- Each scene: a small eyebrow label, a headline that states the\ninsight with the key number highlighted, and one visual (animated bars,\ncounters, line draw, donut, ranked list, or split comparison).<\/p>\n<p>- Motion: staggered fade-and-rise for text, bars growing from zero,\nnumbers counting up, lines drawing in. Keep it smooth and\npurposeful.<\/p>\n<p>- Controls below the stage: Play/Pause, Restart, clickable scene\nchips, time counter. Space = pause, ← → = step scenes. Respect\nprefers-reduced-motion.<\/p>\n<p>- Design: white background, clean professional look, one accent\ncolour drawn from the subject's world plus 3–4 supporting colours,\ncondensed display font for headlines, clean sans for body, mono for\nnumbers (Google Fonts). Use tabular numbers and Indian number formatting\n(₹ lakh/crore) when the data is in INR.<\/p>\n<p>- Charts must be drawn to scale. Labels must not overlap. Text must\nbe readable on a phone.<\/p>\n<p>- Last scene: 3 concrete, data-backed actions (what to do, where, and\nthe rough ₹ impact), plus a one-line source note.<\/p>\n<p>STEP 4 — DELIVER<\/p>\n<p>- Publish the HTML as a shareable page.<\/p>\n<p>- In chat, list the top 5 insights as one-liners. Skip any\npreamble.<strong><br />\n<\/strong><\/p>", "excerpt": "Prompt: You are a sharp business analyst and motion designer. Analyse the Excel data I've attached and present the insights as a short motion video built in a s"}, {"part": 1, "title": "Editable Report", "kind": "Article", "imgs": ["imgs/v23_0.jpg", "imgs/v23_1.jpg"], "thumb": "imgs/v23_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file HTML \"editable report\" that fits a fixed 1600×900\n(16:9) stage, scaled to fit any browser window and centred. No external\nlibraries; plain HTML, CSS and vanilla JS only.<\/p>\n<p>LAYOUT (top to bottom, inside the stage)<\/p>\n<p>1. Title card: an editable report title (H1) and an editable subtitle\nline (period, audience, date). On the right, a toolbar:<\/p>\n<p>- Formatting group: Bold, Italic, Bulleted list, Clear formatting\n(use execCommand; keep the text selection when clicking)<\/p>\n<p>- Mode toggle: Editing / Preview<\/p>\n<p>- Buttons: Print / PDF, Reset (confirm first, then restore sample\ndata), Save (solid accent)<\/p>\n<p>- A small status label (\"Saved in this browser\", \"Editing…\", \"Sample\nreport\", \"Loaded your last version\")<\/p>\n<p>2. KPI strip: 4 cards in a row, each with an editable label, big\nvalue and a small green \"change\" line, with a coloured left border.<\/p>\n<p>3. Two chart cards side by side. Each has an editable chart title, an\n\"Edit chart data\" button (visible only in Editing mode), the chart, and\nan editable commentary paragraph below.<\/p>\n<p>4. Footnote card: editable text for key points, method note or\nsource.<\/p>\n<p>EDITING<\/p>\n<p>- All text is contenteditable in Editing mode, with dashed hover\noutline and accent outline on focus; placeholders shown via data-ph when\nempty.<\/p>\n<p>- Preview mode turns editing off, hides edit buttons and closes the\ndrawer.<\/p>\n<p>- Paste as plain text only.<\/p>\n<p>- Autosave the whole state (text, KPIs, charts) to localStorage with\na ~700 ms debounce, save immediately on Save and on page unload. Wrap\nall storage calls in try/catch.<\/p>\n<p>CHARTS (hand-drawn SVG, viewBox 660×300)<\/p>\n<p>- Types: Column, Bar (horizontal), Line, Area, Donut.<\/p>\n<p>- Gridlines with 4 steps and a \"nice\" rounded max; value labels on\nbars/points; category labels on the x-axis.<\/p>\n<p>- Donut: centre total, legend on the right with values, slices as\ntints of the chosen colour.<\/p>\n<p>- Clicking a chart (or its button) in Editing mode opens a right-side\ndrawer (430px, slides in, with a scrim; closes on ✕, scrim click or\nEscape) containing:<\/p>\n<p>- Chart type selector (5 buttons)<\/p>\n<p>- Colour swatches (6: blue #2563eb, teal #0d9488, orange #ea580c,\nviolet #7c3aed, pink #db2777, slate #334155)<\/p>\n<p>- Data rows: label + numeric value + delete button, and an \"+ Add\nrow\" button<\/p>\n<p>- Every change redraws the chart live and saves.<\/p>\n<p>STYLE<\/p>\n<p>- Clean corporate look: Helvetica/Arial, 14px, tabular numbers, white\ncards with 1px light borders and 4px radius on a soft blue-grey page,\nblue accent #2563eb.<\/p>\n<p>- Colours as CSS variables on :root, with a full dark theme under\nprefers-color-scheme (guarded by :root:not([data-theme=\"light\"])) and\nagain under :root[data-theme=\"dark\"].<\/p>\n<p>- Print stylesheet: drop the scaling, hide toolbar/drawer/edit\nbuttons, remove edit outlines, white background, keep colours\n(print-color-adjust: exact).<\/p>\n<p>SAMPLE DATA (Indian context, ₹ Crore)<\/p>\n<p>- Title: \"Q3 FY26 performance review\"; subtitle \"Prepared for the\nleadership team · [date]\"<\/p>\n<p>- KPIs: Revenue ₹1,248 Cr (▲12.4% on last year), Gross margin 40.5%\n(▲1.2 pts), Active customers 27,481 (▲5.3%), Operating margin 13.5%\n(▲2.1 pts)<\/p>\n<p>- Chart 1, column, \"Revenue by city\": Mumbai 96, Delhi NCR 88,\nBengaluru 74, Hyderabad 52, Chennai 48, Kolkata 40, with a one-line\ncommentary<\/p>\n<p>- Chart 2, line, \"Monthly revenue trend\": Apr 92, May 98, Jun 95, Jul\n104, Aug 112, Sep 118, Oct 134, Nov 141, Dec 128, with commentary on the\nfestive-season lift<\/p>\n<p>- Footnote explaining that figures are sample data and how to\nedit.<\/p>\n<p>Escape all user-entered labels before injecting into SVG. Deliver as\none self-contained .html file.<\/p>\n<p><strong>Simplified Prompt:<\/strong><\/p>\n<p>Build a single HTML file: an editable one-page business report.<\/p>\n<p>Layout: fixed 1600 x 900 (16:9) canvas that scales to fit the window.\nClean white cards on a light grey-blue background, blue accent,\nHelvetica, supports dark mode.<\/p>\n<p>Sections:<\/p>\n<p>1. Title bar: editable title and subtitle, plus a toolbar with Bold,\nItalic, Bullets, Clear formatting, an Editing / Preview toggle, Print /\nPDF, Reset and Save buttons, and a small save-status label.<\/p>\n<p>2. Four KPI cards (label, big value, green change line), all\neditable. Sample: Revenue ₹1,248 Cr, Gross margin 40.5%, Active\ncustomers 27,481, Operating margin 13.5%.<\/p>\n<p>3. Two charts side by side, each with an editable title and\ncommentary below. Sample: \"Revenue by city\" (6 Indian cities, column\nchart) and \"Monthly revenue trend\" (Apr to Dec, line chart).<\/p>\n<p>4. Editable footnote card.<\/p>\n<p>Editing:<\/p>\n<p>- Click any text to edit it; paste as plain text only.<\/p>\n<p>- An \"Edit chart data\" button opens a side drawer where I can switch\nchart type (Column, Bar, Line, Area, Donut), pick a colour from 6\nswatches, and edit, add or delete label/value rows. The chart redraws\nlive.<\/p>\n<p>- Preview mode hides all editing controls.<\/p>\n<p>- Auto-save to localStorage; Reset restores the sample report.<\/p>\n<p>- Print hides the toolbar and drawer.<\/p>\n<p>Draw charts as inline SVG. No external libraries.<\/p>", "excerpt": "Prompt: Build a single-file HTML \"editable report\" that fits a fixed 1600×900 (16:9) stage, scaled to fit any browser window and centred. No external libraries;"}, {"part": 1, "title": "Before vs After", "kind": "Article", "imgs": ["imgs/v24_0.jpg", "imgs/v24_1.jpg"], "thumb": "imgs/v24_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file HTML page with D3 showing a sales officer’s\nterritory map for a cement company: about 64 outlets (dealers and\nretailers, sized by potential) clustered around 9 towns, with routes\nfrom a central base. Add a Before/After toggle. Before shows messy\ninherited routes that skip some outlets. After groups the outlets into 6\nday-wise sectors (Mon–Sat), each with an optimised route. Beside the\nmap, show stat cards for average km per day, outlets covered and\npotential covered, all updating with the toggle. Add hover tooltips and\na day legend that isolates each day’s route. Style: navy and gold, DM\nSerif Display and DM Sans.<\/p>", "excerpt": "Prompt: Build a single-file HTML page with D3 showing a sales officer’s territory map for a cement company: about 64 outlets (dealers and retailers, sized by po"}, {"part": 1, "title": "Interactive Simulation for Visuals", "kind": "Article", "imgs": ["imgs/v25_0.jpg"], "thumb": "imgs/v25_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file interactive HTML page that shows a cable's\nengineered Bill of Materials (BOM).<\/p>\n<p>Content:<\/p>\n<p>- Section header: eyebrow \"The Solution\", title \"Every layer of the\ncable, priced per kilometre\", one-line instruction underneath.<\/p>\n<p>- Three cable constructions to toggle between: 3C 95 sq mm Aluminium\nXLPE strip armoured, 4C 16 sq mm Copper PVC wire armoured, and 1C 2.5 sq\nmm Copper FR-PVC house wire.<\/p>\n<p>- A second toggle: Manual BOM vs Engineered BOM.<\/p>\n<p>Visuals:<\/p>\n<p>- Left: an SVG cross-section of the cable, with concentric layers\n(conductor, insulation, inner sheath, armour, outer sheath) and\ncolour-coded cores.<\/p>\n<p>- Right: horizontal bars showing ₹/km cost per layer, with a dashed\nghost bar for the other BOM mode so the difference is visible.<\/p>\n<p>- Side cards: Material per km (kg), Material cost per km (₹),\nConductor buffer (%), plus a short \"How the engineered BOM works\"\nlist.<\/p>\n<p>Logic:<\/p>\n<p>- Calculate each layer's mass from geometry × density, using simple\nillustrative material prices.<\/p>\n<p>- Manual BOM: upper-tolerance thickness and flat buffers (3.5% on the\nconductor).<\/p>\n<p>- Engineered BOM: nominal thickness and lower allowances (1% on the\nconductor).<\/p>\n<p>- In Engineered mode, show the savings in green.<\/p>\n<p>- Hover tooltips on layers and bars show kg/km, ₹/km, how the layer\nis calculated, and the allowance.<\/p>\n<p>- Animate transitions with D3.<\/p>\n<p>Style: clean consulting look, DM Serif Display + DM Sans, deep teal\nprimary (#0B4F6C), copper accent (#C26A2E), white cards on a light\ngrey-blue background, responsive down to mobile. Add a footnote that the\nfigures are indicative.<\/p>", "excerpt": "Prompt: Build a single-file interactive HTML page that shows a cable's engineered Bill of Materials (BOM). Content: - Section header: eyebrow \"The Solution\", ti"}, {"part": 1, "title": "Dynamic Dashboard connected to Google Sheets", "kind": "Article", "imgs": ["imgs/v26_0.jpg", "imgs/v26_1.jpg", "imgs/v26_2.jpg", "imgs/v26_3.jpg", "imgs/v26_4.jpg", "imgs/v26_5.jpg", "imgs/v26_6.jpg", "imgs/v26_7.jpg"], "thumb": "imgs/v26_0_t.jpg", "inline": true, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Create code for google sheets<\/p>\n<p>Sheet url is:<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.google.com/spreadsheets/d/1wJMXo8_jN1BHdFBzTqi5bcNhosShjP9FPzsRUndbbWc/edit?gid=846480193\">https://docs.google.com/spreadsheets/d/1wJMXo8_jN1BHdFBzTqi5bcNhosShjP9FPzsRUndbbWc/edit?gid=846480193#gid=846480193<\/a><\/p>\n<p>It should make an html dashboard showing:<\/p>\n<p>Column chart for manager wise average rating, KPIs for Sum of Sales,\nAverage Rating and Average Sales<\/p>\n<p><img src=\"imgs/v26_0.jpg\" alt=\"\"><\/p>\n<p>Extensions &gt; Apps Script<\/p>\n<p><img src=\"imgs/v26_1.jpg\" alt=\"\"><\/p>\n<p>Code.gs<\/p>\n<p><img src=\"imgs/v26_2.jpg\" alt=\"\"><\/p>\n<p>Index.html<\/p>\n<p><img src=\"imgs/v26_3.jpg\" alt=\"\"><\/p>\n<p>Deploy &gt; New deployment &gt; Web app<\/p>\n<p><img src=\"imgs/v26_4.jpg\" alt=\"\"><\/p>\n<p>New deployment<\/p>\n<p><img src=\"imgs/v26_5.jpg\" alt=\"\"><\/p>\n<p><img src=\"imgs/v26_6.jpg\" alt=\"\"><\/p>\n<p>Final Dashboard<\/p>\n<p><img src=\"imgs/v26_7.jpg\" alt=\"\"><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://docs.google.com/spreadsheets/d/1wJMXo8_jN1BHdFBzTqi5bcNhosShjP9FPzsRUndbbWc/edit?gid=846480193#gid=846480193\">https://docs.google.com/spreadsheets/d/1wJMXo8_jN1BHdFBzTqi5bcNhosShjP9FPzsRUndbbWc/edit?gid=846480193#gid=846480193<\/a><\/p>\n<p>https://script.google.com/macros/s/AKfycbyqgNBoF64P5KjikRFYn1vd5Z_KOlTzA246qEdh8Zn6/dev<\/p>", "excerpt": "Prompt: Create code for google sheets Sheet url is: https://docs.google.com/spreadsheets/d/1wJMXo8_jN1BHdFBzTqi5bcNhosShjP9FPzsRUndbbWc/edit?gid=846480193#gid=8"}, {"part": 2, "title": "Interact", "kind": "Article", "imgs": ["imgs/v27_0.jpg"], "thumb": "imgs/v27_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file HTML showcase page titled \"Ten ways a page can be\ninteractive\". Plain HTML, CSS and vanilla JS only: no frameworks, no\nlibraries, nothing loaded from the internet. Every demo must actually\nwork.<\/p>\n<p>PAGE<\/p>\n<p>- Centred container, max-width ~1180px. Header with H1, a muted intro\nline (\"Every demo below works. Nothing is loaded from the internet.\")\nand kbd hints for ? and /.<\/p>\n<p>- A 2-column grid of cards (1 column under 860px). Each card has: a\nmuted number (01–10), an H2, a pill tag on the right (\"JavaScript\" in\naccent colour, or \"No JavaScript\" / \"Mostly CSS\" in muted grey), a\none-line muted note explaining how to use it, and a soft grey demo\nbox.<\/p>\n<p>- Footer noting that 02 and 06 need little or no script and the rest\nare a few lines each.<\/p>\n<p>THE TEN DEMOS<\/p>\n<p>01 Tabs: three tabs (Overview, Numbers, Notes) with role=\"tablist\",\naria-selected, one panel visible at a time, Left/Right arrow keys move\nbetween tabs.<\/p>\n<p>02 Accordion: native &lt;details name=\"acc\"&gt; with three sections,\nonly one open at a time; custom +/− marker; a small JS fallback for\nbrowsers that don't support the name attribute.<\/p>\n<p>03 Split pane: two panes with a draggable divider using pointer\nevents (mouse, trackpad, touch), clamped 15–85%, double-click resets to\n50/50, arrow keys nudge it when focused, live \"Split: 50 / 50\"\nreadout.<\/p>\n<p>04 Keyboard shortcuts: a search box; \"/\" focuses it from anywhere\n(with a toast), \"?\" toggles a shortcut-sheet overlay, Esc closes any\nopen overlay; show the last key pressed (with Ctrl/Cmd/Shift prefixes).\nIgnore shortcuts while typing in inputs.<\/p>\n<p>05 Modal and drawer: \"Open modal\" uses the native &lt;dialog&gt; with\nshowModal (backdrop click closes); \"Open drawer\" slides a 320px panel in\nfrom the right with a scrim. Both close on Esc or a click outside.<\/p>\n<p>06 Tooltip and popover: a CSS-only hover/focus tooltip on \"38.2%\"\nexplaining gross margin; a click-to-open popover button (\"How is this\ncalculated?\") that closes on any outside click.<\/p>\n<p>07 Drag and drop: a 4-item task list (Collect requirements, Draft the\nmodel, Review with finance, Publish the dashboard) reorderable with\nnative drag-and-drop, a blue top edge showing the drop position, and a\nlive \"Order: 1. … · 2. …\" readout.<\/p>\n<p>08 Live filter and sort: a table of Indian cities (City, Region,\nUnits, Revenue): Mumbai/West/18,240/96, Delhi NCR/North/16,980/88,\nBengaluru/South/14,120/74, Hyderabad/South/10,450/52,\nChennai/South/9,380/48, Kolkata/East/7,920/40, Pune/West/7,140/36.\nType-to-filter on city or region, click headers to sort (click again to\nreverse) with ↑/↓ arrows and aria-sort, an empty-state row, and a \"X of\n7 rows, sorted by …\" line. Default sort: revenue descending.<\/p>\n<p>09 Inline edit: label/value pairs (Owner: Asha Menon, Target: 1,600\nCr, Review date: 24 October). Click a value to turn it into an input;\nEnter or blur saves (with a toast), Esc cancels; empty input\nreverts.<\/p>\n<p>10 Form validation: work email and password fields with live messages\n(green/red), a 5-step password strength meter that changes colour, and a\nsubmit button disabled until both are valid (email regex; password ≥8\nchars plus enough variety). On submit, prevent sending and show\n\"Submitted, nothing left this page.\" plus a toast.<\/p>\n<p>SHARED<\/p>\n<p>- A bottom-centre toast that fades in and out.<\/p>\n<p>- Escape all user text before inserting into HTML.<\/p>\n<p>STYLE<\/p>\n<p>- Clean, neutral: Helvetica/Arial 15px, white cards, 1px light\nborders, 4–6px radius, accent blue #1a56db, green for success, red for\nerrors, styled &lt;kbd&gt; keys, tabular numbers in the table.<\/p>\n<p>- Colours as CSS variables on :root, with a full dark theme under\nprefers-color-scheme (guarded by :root:not([data-theme=\"light\"])) and\nagain under :root[data-theme=\"dark\"].<\/p>\n<p>- Visible :focus-visible outlines everywhere; good keyboard support\nthroughout.<\/p>\n<p>Deliver as one self-contained .html file.<\/p>\n<p><strong>Simplified Prompt:<\/strong><\/p>\n<p>1. Tabs (with arrow-key support)<\/p>\n<p>2. Accordion (native &lt;details&gt;, one open at a time)<\/p>\n<p>3. Resizable split pane (drag the divider)<\/p>\n<p>4. Keyboard shortcuts (/ focuses search, ? opens a shortcut list, Esc\ncloses things)<\/p>\n<p>5. Modal and slide-in side drawer<\/p>\n<p>6. Hover tooltip and click popover<\/p>\n<p>7. Drag-and-drop list to reorder tasks<\/p>\n<p>8. Table of Indian cities with live filter and click-to-sort\ncolumns<\/p>\n<p>9. Click-to-edit fields (Enter saves, Esc cancels)<\/p>\n<p>10. Signup form with live validation and a password strength\nmeter<\/p>", "excerpt": "Prompt: Build a single-file HTML showcase page titled \"Ten ways a page can be interactive\". Plain HTML, CSS and vanilla JS only: no frameworks, no libraries, no"}, {"part": 2, "title": "Tooltip", "kind": "Article", "imgs": ["imgs/v28_0.jpg"], "thumb": "imgs/v28_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single HTML file: a column chart where hovering a bar shows a\ntooltip containing a second, smaller chart (a drill-through\ntooltip).<\/p>\n<p>Look and layout<\/p>\n<p>- Fixed 1600 x 900 (16:9) canvas that scales to fit any window,\ncentred.<\/p>\n<p>- Black and white only: black bars, thin black borders, light grey\ngridlines, Helvetica. Supports dark mode (colours invert).<\/p>\n<p>- One full-size card holding the chart, with a small footer: \"Hover a\nbar to open its monthly trend. On touch, tap a bar.\" on the left and\n\"Sample data\" on the right.<\/p>\n<p>Data (sample, ₹ Cr, 2025)<\/p>\n<p>- Six categories: Electronics, Furniture, Apparel, Grocery, Beauty,\nSports.<\/p>\n<p>- Each has 12 monthly values (Jan to Dec) with a festive bump in Oct\nto Dec.<\/p>\n<p>- Each bar's total = sum of its 12 months. Sort bars highest to\nlowest.<\/p>\n<p>Main chart<\/p>\n<p>- Vertical column chart drawn as inline SVG.<\/p>\n<p>- Y axis in steps of 50, labelled \"Revenue, ₹ Cr\".<\/p>\n<p>- Category name under each bar, total in bold above each bar.<\/p>\n<p>- When a bar is active, it stays black and the others fade to light\ngrey.<\/p>\n<p>Tooltip<\/p>\n<p>- Opens next to the cursor and follows it; flips left if it would run\noff the right edge.<\/p>\n<p>- White box, black border, solid black offset shadow.<\/p>\n<p>- Top line: category name on the left, \"₹ [total] Cr\" on the\nright.<\/p>\n<p>- Subtitle: \"Monthly revenue in ₹ Cr, 2025\".<\/p>\n<p>- Small line chart of the 12 months with dots, month initials below,\n3 gridlines.<\/p>\n<p>- Peak month gets a filled dot with its value labelled above.<\/p>\n<p>- Footer: \"Peak: [Month], [value]\" and \"Share of total: [x]%\".<\/p>\n<p>Interaction<\/p>\n<p>- Mouse: hover to show, move away to hide.<\/p>\n<p>- Touch: tap a bar to pin the tooltip, tap elsewhere to close.<\/p>\n<p>- Keyboard: bars are tabbable; focusing one opens its tooltip.<\/p>\n<p>No external libraries.<\/p>\n<p><strong>Simplified Prompt:<\/strong><\/p>\n<p>Build a single HTML file: a column chart of revenue by category\n(Electronics, Furniture, Apparel, Grocery, Beauty, Sports, sample ₹ Cr\ndata). Hovering a bar shows a tooltip with a small line chart of that\ncategory's 12-month trend, the peak month and its share of total. Fixed\n16:9 canvas that scales to fit, black and white style, dark mode, no\nexternal libraries.<\/p>", "excerpt": "Prompt: Build a single HTML file: a column chart where hovering a bar shows a tooltip containing a second, smaller chart (a drill-through tooltip). Look and lay"}, {"part": 2, "title": "MCQs", "kind": "Article", "imgs": ["imgs/v29_0.jpg"], "thumb": "imgs/v29_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single HTML page that works as a multiple-choice quiz engine,\nusing only HTML, CSS and plain JavaScript (no libraries, nothing loaded\nfrom the internet). It has three screens:<\/p>\n<p>1. SETUP<\/p>\n<p>- Choose topics, difficulty (Easy / Medium / Hard), question types\n(single answer, multi-select, true/false, numeric) and number of\nquestions; show how many questions match.<\/p>\n<p>- Rules: instant feedback or exam mode, mark scheme (+1/0, +4/−1,\n+1/−0.5), timer (none, per question, or whole quiz).<\/p>\n<p>- On/off switches: shuffle questions, shuffle options, adaptive\ndifficulty, ask for confidence (Sure / Not sure), partial credit on\nmulti-select, flag and revisit.<\/p>\n<p>- Two presets: \"Quick practice\" and \"Exam simulation\".<\/p>\n<p>- A box to paste extra questions in a simple one-line-per-question\nformat.<\/p>\n<p>2. QUIZ<\/p>\n<p>- Left: numbered question palette showing answered, flagged and\ncurrent.<\/p>\n<p>- Centre: question with difficulty/topic/type tags, options as large\nclickable buttons (keys 1–6 to pick, Enter to submit), an explanation\nafter answering in instant mode, and Previous / Next / Skip / Flag\nbuttons.<\/p>\n<p>- Right: countdown timer with a progress bar, confidence buttons, and\na live score panel.<\/p>\n<p>3. RESULTS<\/p>\n<p>- Score ring and percentage, marks, time taken.<\/p>\n<p>- Accuracy bars by topic, difficulty and question type, plus a\nwarning for answers marked \"Sure\" that were wrong.<\/p>\n<p>- Full review of every question with your answer, correct answer and\nexplanation; filter to wrong only.<\/p>\n<p>- Buttons: Retry the wrong ones, New quiz, Download CSV, Copy\nsummary.<\/p>\n<p>Keep the question bank as a plain editable list at the top of the\nscript. Fill it with about 20 questions on \"GenAI for leaders\"\n(strategy, adoption, risk, prompting technique) and a few easy\ngeneral-knowledge sample questions, including one that reads a small bar\nchart.<\/p>\n<p>Clean, minimal look with a blue accent, green/red for right/wrong,\ndark mode support, works on mobile. Deliver as one .html file.<\/p>", "excerpt": "Prompt: Build a single HTML page that works as a multiple-choice quiz engine, using only HTML, CSS and plain JavaScript (no libraries, nothing loaded from the i"}, {"part": 2, "title": "Maps", "kind": "Article", "imgs": ["imgs/v30_0.jpg"], "thumb": "imgs/v30_0_t.jpg", "inline": false, "html": "<p><a target=\"_blank\" rel=\"noopener\" href=\"https://leafletjs.com/\">https://leafletjs.com/<\/a><\/p>\n<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single HTML page with an interactive map of India using\nLeaflet (load it from cdnjs), fitted to a 16:9 frame that scales to any\nwindow.<\/p>\n<p>- Plot 8 cities as circles sized by revenue (₹ Cr, sample data):\nMumbai 96, Delhi NCR 88, Bengaluru 74, Hyderabad 52, Chennai 48,\nAhmedabad 44, Kolkata 40, Pune 36.<\/p>\n<p>- Hovering a circle shows a tooltip with the city name and \"₹ X\nCr\".<\/p>\n<p>- Add a switch on the map for three map types: Road, Black &amp;\nwhite (default), and Satellite with place labels. Use free Esri tiles,\nno API key.<\/p>\n<p>- Zoom buttons, a metric scale bar, and auto-zoom to fit all\ncities.<\/p>\n<p>- A short footer line: \"Hover a circle to see revenue by city. Circle\nsize shows revenue.\" and \"Sample data\" on the right.<\/p>\n<p>- Show a friendly message if the map fails to load.<\/p>\n<p>Style: stark black-and-white look (black circles, square tooltip with\na hard shadow, black-bordered controls), with dark mode support. Deliver\nas one .html file.<\/p>", "excerpt": "https://leafletjs.com/ Prompt: Build a single HTML page with an interactive map of India using Leaflet (load it from cdnjs), fitted to a 16:9 frame that scales "}, {"part": 2, "title": "Globe", "kind": "Article", "imgs": ["imgs/v31_0.jpg"], "thumb": "imgs/v31_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single HTML page with an animated dotted globe showing where\nHavish M Consulting (HMC) works. Plain HTML, CSS and JavaScript on a\n&lt;canvas&gt;; no 3D libraries. Font: DM Sans from Google Fonts.\nTransparent background so it can be embedded anywhere.<\/p>\n<p>- Draw the Earth as a globe made of small blue dots for land, with a\nsoft white-to-light-blue shading and a faint glow around the edge.<\/p>\n<p>- Mark four locations with pulsing pins and a small label: India (the\nhub), UAE, United Kingdom, United States. Draw curved arcs from India to\nthe other three, with a small dot travelling along each arc.<\/p>\n<p>- The globe slowly spins on its own and tours each country in turn.\nIt can be dragged to rotate, and clicking a pin focuses that\ncountry.<\/p>\n<p>- Below the globe, a row of pill buttons for the four countries; the\nactive one is filled navy.<\/p>\n<p>- Clicking India zooms smoothly into India, shows a more detailed dot\nmap, and reveals a second row of pills for 15 states (Delhi, Haryana,\nPunjab, Rajasthan, Uttar Pradesh, Madhya Pradesh, Gujarat, Maharashtra,\nKarnataka, Kerala, Tamil Nadu, Telangana, Odisha, West Bengal,\nMeghalaya). States pop in one by one, auto-cycle with a highlight, and\ncan be hovered or clicked. A \"Back to world view\" button zooms back\nout.<\/p>\n<p>- Respect reduced-motion settings, keep it sharp on high-resolution\nscreens, and resize to fit its container.<\/p>\n<p>Colours: HMC blues (#1a5fa8 main, #0f3460 deep navy, #d2e3f5\nlight).<\/p>\n<p>Deliver as one .html file.<\/p>", "excerpt": "Prompt: Build a single HTML page with an animated dotted globe showing where Havish M Consulting (HMC) works. Plain HTML, CSS and JavaScript on a <canvas>; no 3"}, {"part": 2, "title": "Motion Video", "kind": "Article", "imgs": ["imgs/v32_0.jpg", "imgs/v32_1.jpg"], "thumb": "imgs/v32_1_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>I will share an Excel/sales data file. Analyse it and turn the key\ninsights<br />\ninto a 15-second motion video.<\/p>\n<p>STEP 1 – Understand the data<\/p>\n<ul>\n<li><p>Identify the columns (dates, regions, products/categories,\npeople,<br />\nquantities, values) and the period the data covers.<\/p><\/li>\n<li><p>Validate totals (e.g. Qty × Price = Value) and flag any errors or\nblanks<br />\nbefore building anything.<\/p><\/li>\n<\/ul>\n<p>STEP 2 – Find the story<\/p>\n<ul>\n<li><p>Headline metric: total value for the period.<\/p><\/li>\n<li><p>2–3 KPIs: e.g. number of transactions, average value, largest\nsingle item.<\/p><\/li>\n<li><p>Breakdowns: by the most meaningful dimensions available\n(region,<br />\ncategory, salesperson, customer, time).<\/p><\/li>\n<li><p>One clear takeaway: the biggest driver and the biggest gap or\nrisk.<\/p><\/li>\n<li><p>Use only what the data supports; do not invent figures.<\/p><\/li>\n<\/ul>\n<p>STEP 3 – Build the video (15 seconds, 16:9)<br />\nSuggested structure (adapt to what the data shows):<br />\n0–2s Title + period, headline total counts up<br />\n2–5s KPI cards pop in<br />\n5–8s Breakdown 1 (animated bar chart)<br />\n8–11s Breakdown 2 (animated donut/pie)<br />\n11–13.5s Top performers (ranked list or podium)<br />\n13.5–15s One-line key takeaway, fade out<\/p>\n<p>STYLE<\/p>\n<ul>\n<li><p>Clean corporate look; pick a colour palette that matches the\nbrand or<br />\nheader colours in the file, otherwise use navy, white and one\naccent.<\/p><\/li>\n<li><p>Bold sans-serif numbers, smooth count-up and grow\nanimations.<\/p><\/li>\n<li><p>Number format to match the data's currency and locale (e.g. ₹ in\nLakhs<br />\nfor Indian data).<\/p><\/li>\n<li><p>On-screen text only, no voiceover. Every number must stay\nreadable for<br />\nat least 1 second. Max 6 scenes.<\/p><\/li>\n<\/ul>\n<p>Before building, show me a one-line summary of the insights you plan\nto<br />\nuse for each scene so I can confirm.<\/p>", "excerpt": "Prompt: I will share an Excel/sales data file. Analyse it and turn the key insights into a 15-second motion video. STEP 1 – Understand the data Identify the col"}, {"part": 2, "title": "Embed HTML", "kind": "Article", "imgs": ["imgs/v33_0.jpg", "imgs/v33_1.jpg"], "thumb": "imgs/v33_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Embed this in an HTML page<\/p>\n<p>&lt;iframe\nsrc=\"https://docs.google.com/forms/d/e/1FAIpQLSdH0WfZzrbAXCh8xuR7JVz-2NaJk9K4OZRaOy63xqrH3XDyKQ/viewform?embedded=true\"\nwidth=\"640\" frameborder=\"0\" marginheight=\"0\"\nmarginwidth=\"0\"&gt;Loading…&lt;/iframe&gt;<\/p>", "excerpt": "Prompt: Embed this in an HTML page <iframe src=\"https://docs.google.com/forms/d/e/1FAIpQLSdH0WfZzrbAXCh8xuR7JVz-2NaJk9K4OZRaOy63xqrH3XDyKQ/viewform?embedded=tru"}, {"part": 2, "title": "Bookmarks", "kind": "Article", "imgs": ["imgs/v34_0.jpg"], "thumb": "imgs/v34_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single HTML sales dashboard for FY 2025–26 (Apr 2025 to Mar\n2026) that shows off Power BI-style bookmarks and a timeline slicer.\nPlain HTML, CSS and JavaScript only; no libraries.<\/p>\n<p>DATA<\/p>\n<p>Generate realistic sample data in the script: 4 regions (North,\nSouth, East, West) × 4 categories (Beverages, Snacks, Dairy, Personal\ncare) × 3 channels (Modern trade, General trade, Ecommerce) × 12 months,\nwith sales in ₹ Cr and units. Add some seasonality, faster growth in\nWest, and a mid-year dip in East.<\/p>\n<p>LAYOUT (top to bottom)<\/p>\n<p>1. Bookmarks card: clickable pill chips for saved views, plus a text\nbox and \"Save current view\" button. Include four built-in bookmarks:\n\"Full year, everything\", \"West · H2\", \"Festive quarter\" (Sep–Dec),\n\"Ecommerce · Q4\". User-saved bookmarks get a small × to delete. Show the\nactive bookmark highlighted and a line describing what it shows; if\nfilters are changed by hand, say so and prompt to save.<\/p>\n<p>2. Filters card: dropdowns for Region, Category and Channel, a \"Clear\nfilters\" button, and a draggable two-handle timeline slider across the\n12 months (snaps to months, arrow keys work, shows the selected range\nand month count).<\/p>\n<p>3. Four KPI cards: Net sales, Units sold, Average realisation per\nunit, Best month.<\/p>\n<p>4. Two charts side by side: monthly sales column chart (for the\nselected months) and a horizontal bar chart by category.<\/p>\n<p>5. Region table: net sales, units, average realisation and share,\nwith a total row.<\/p>\n<p>Everything updates instantly when filters, the timeline or a bookmark\nchange. Show a small toast for actions like \"Saved\" or \"Filters\ncleared\".<\/p>\n<p>Clean card-based look with rounded corners, a blue accent, Indian\nnumber formatting, dark mode support, and a layout that stacks on\nmobile. Deliver as one .html file.<\/p>", "excerpt": "Prompt: Build a single HTML sales dashboard for FY 2025–26 (Apr 2025 to Mar 2026) that shows off Power BI-style bookmarks and a timeline slicer. Plain HTML, CSS"}, {"part": 2, "title": "PDF Reader and Editor", "kind": "Article", "imgs": ["imgs/v35_0.jpg"], "thumb": "imgs/v35_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single HTML page called \"PDF reader and editor\" that works\nentirely in the browser. Nothing is uploaded. Use pdf.js to show pages\nand pdf-lib to edit them, with both libraries embedded in the file so it\nworks offline.<\/p>\n<p>TOP BAR<\/p>\n<p>- An \"Open a PDF\" button, an \"Undo\" button, a \"Save PDF\" button, and\na line that shows the file name and page count.<\/p>\n<p>- Two tabs: Read and Edit pages.<\/p>\n<p>READ TAB<\/p>\n<p>- A strip of page thumbnails on the left. Click one to jump to that\npage.<\/p>\n<p>- The current page shown large in the middle, kept sharp on\nhigh-resolution screens.<\/p>\n<p>- A bottom bar with First, Previous, a page-number box (\"of N\"), Next\nand Last. Then zoom − and +, the zoom %, Fit width and Fit page.<\/p>\n<p>- Left/Right arrow keys and PageUp/PageDown move between pages.<\/p>\n<p>EDIT PAGES TAB<\/p>\n<p>- A grid of page thumbnails. Click a card or its checkbox to select\nit. Add Select all and Select none, plus a \"3 selected\" count.<\/p>\n<p>- Drag a card to reorder pages, or use the ← → buttons on each\ncard.<\/p>\n<p>- Delete selected pages, Extract selected pages (downloads them as a\nnew PDF), and Merge another PDF (adds its pages at the end).<\/p>\n<p>- Undo reverses any edit. Save PDF downloads the edited file.<\/p>\n<p>EXTRAS<\/p>\n<p>- A \"Working…\" overlay during slow steps.<\/p>\n<p>- A small toast for feedback, such as \"Opened report.pdf, 12 pages\"\nor \"Page 3 is now page 5\".<\/p>\n<p>- Friendly messages for password-protected or broken files.<\/p>\n<p>- An empty state that says \"Nothing open yet. The file is read inside\nthis browser and never uploaded.\"<\/p>\n<p>Keep the look clean and minimal, with a blue accent and a red Delete\nbutton. Support dark mode. Deliver as one .html file.<\/p>", "excerpt": "Prompt: Build a single HTML page called \"PDF reader and editor\" that works entirely in the browser. Nothing is uploaded. Use pdf.js to show pages and pdf-lib to"}, {"part": 2, "title": "API", "kind": "Article", "imgs": ["imgs/v36_0.jpg", "imgs/v36_1.jpg"], "thumb": "imgs/v36_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build me a single, self-contained HTML file (HTML, CSS and JavaScript\nall in one file) that I can open by double-clicking it in my browser. I\nam not a coder, so keep everything simple and make the page work without\ninstalling anything.<\/p>\n<p>PURPOSE<br />\nA small \"Ask Your Data\" tool. I paste my OpenAI API key, see my employee\nperformance dataset on screen, type any question about it in plain\nEnglish, and get an answer from OpenAI.<\/p>\n<p>THE DATASET<br />\nI have already provided an employee performance tracking dataset (10\nrows, 10 columns), pasted below / attached. Use it exactly as given. Do\nnot invent, modify or add any data. Embed it inside the HTML file so the\npage works on its own.<\/p>\n<p>PAGE LAYOUT (top to bottom)<\/p>\n<ol type=\"1\">\n<li><p>Header: title \"Employee Performance – Ask Your Data\" and a\none-line subtitle explaining what the page does.<\/p><\/li>\n<li><p>API Key section:<\/p>\n<ul>\n<li><p>A password-style input box labelled \"OpenAI API Key\" (characters\nhidden, with a small Show/Hide toggle).<\/p><\/li>\n<li><p>A \"Save Key\" button. Show a green \"Key saved\" message once\nentered.<\/p><\/li>\n<li><p>Keep the key only in the browser's memory for this session. Never\ndisplay it in full or send it anywhere except OpenAI.<\/p><\/li>\n<li><p>A short note: \"Your key stays in your browser and is only sent to\nOpenAI.\"<\/p><\/li>\n<\/ul><\/li>\n<li><p>Dataset section:<\/p>\n<ul>\n<li><p>Show the full dataset as a clean, readable table with column\nheaders.<\/p><\/li>\n<li><p>Alternate row shading, header row highlighted, table scrolls\nsideways on small screens.<\/p><\/li>\n<\/ul><\/li>\n<li><p>Question section:<\/p>\n<ul>\n<li><p>A large text box: \"Ask anything about this data…\"<\/p><\/li>\n<li><p>An \"Ask\" button (pressing Enter should also work).<\/p><\/li>\n<li><p>3–4 clickable example question chips that fill the box when\nclicked, e.g. \"Who is the top performer?\", \"Which department has the\nhighest average rating?\", \"Summarise the key trends\", \"Who might need a\nperformance improvement plan and why?\"<\/p><\/li>\n<\/ul><\/li>\n<li><p>Answer section:<\/p>\n<ul>\n<li><p>Show a \"Thinking…\" loading indicator while waiting.<\/p><\/li>\n<li><p>Display the answer in a neat box with proper line breaks, bullet\npoints and bold text where relevant.<\/p><\/li>\n<li><p>Keep a running history of previous questions and answers below\n(newest first), with a \"Clear history\" button.<\/p><\/li>\n<\/ul><\/li>\n<\/ol>\n<p>HOW THE ANSWER IS GENERATED<\/p>\n<ul>\n<li><p>Call the OpenAI Chat Completions API directly from the browser\nusing the saved key.<\/p><\/li>\n<li><p>Use the model \"gpt-4o-mini\" (put the model name in one clearly\nmarked place near the top of the script so I can change it\nlater).<\/p><\/li>\n<li><p>Send the full dataset with every question, along with these\ninstructions to the AI:<br />\n\"You are an HR data analyst. Answer only using the dataset provided.\nShow the numbers behind your answer. If the question cannot be answered\nfrom the data, say so clearly. Keep answers concise and\nbusiness-friendly.\"<\/p><\/li>\n<li><p>Do the analysis through the API only; do not hard-code any\nanswers.<\/p><\/li>\n<\/ul>\n<p>ERROR HANDLING (in plain, friendly language)<\/p>\n<ul>\n<li><p>No key entered → \"Please enter your OpenAI API key\nfirst.\"<\/p><\/li>\n<li><p>Empty question → \"Please type a question.\"<\/p><\/li>\n<li><p>Invalid key, no credit or network problem → show a simple\nexplanation of what went wrong and what to check.<\/p><\/li>\n<\/ul>\n<p>DESIGN<\/p>\n<ul>\n<li><p>Clean, modern, professional look suited to a business\naudience.<\/p><\/li>\n<li><p>Calm colour palette (navy and white with one accent colour),\nclear fonts, generous spacing.<\/p><\/li>\n<li><p>Works well on both laptop and mobile screens.<\/p><\/li>\n<\/ul>\n<p>FINAL OUTPUT<\/p>\n<ul>\n<li><p>Give me the complete HTML file in one block, ready to copy into a\nfile named \"ask-your-data.html\".<\/p><\/li>\n<li><p>After the code, add 4–5 short steps telling a non-coder how to\nsave the file, open it, get an OpenAI API key, and use the\npage.<\/p><\/li>\n<li><p>Add a brief note that this is for learning/demo use, and that in\na real company the API key should be handled by a secure backend rather\nthan typed into a web page.<\/p><\/li>\n<\/ul>", "excerpt": "Prompt: Build me a single, self-contained HTML file (HTML, CSS and JavaScript all in one file) that I can open by double-clicking it in my browser. I am not a c"}, {"part": 3, "title": "Mermaid Code", "kind": "Article", "imgs": ["imgs/v37_0.jpg", "imgs/v37_1.jpg", "imgs/v37_2.jpg", "imgs/v37_3.jpg", "imgs/v37_4.jpg"], "thumb": "imgs/v37_0_t.jpg", "inline": false, "html": "<p><a target=\"_blank\" rel=\"noopener\" href=\"https://mermaid.js.org/\">https://mermaid.js.org/<\/a><\/p>\n<p><img\nsrc=\"m/media/image100.png\"\nalt=\"The image depicts a flowchart for a procedural guide, with various checkpoints and conditions leading to different actions, including a storm-season hold rule and a night shift protocol. AI-generated content may be incorrect.\" />\n\n <img\nsrc=\"m/media/image103.png\"\nalt=\"The image depicts a project management flowchart, detailing the steps for an annual shutdown, including tasks such as shutdown, repair, inspection, and restart, with deadlines and parallel crews, leading up to the plant being operational again. AI-generated content may be incorrect.\" />\n\n<\/p>\n<p><strong>Prompt:<\/strong><\/p>\n<p>Create a professional, interactive, standalone HTML application that\ntransforms a Standard Operating Procedure (SOP) into a dynamic visual\nexperience using Mermaid.js.<\/p>\n<p><strong>Input:<\/strong> I will provide an SOP document, PDF, Word\nfile, or written process description.<\/p>\n<p><strong>Objective:<\/strong> Convert the SOP into an interactive,\nvisually engaging, and operationally useful web application.<\/p>\n<p><strong>1. Diagram views<\/strong><\/p>\n<p>Create six switchable Mermaid.js visualizations:<\/p>\n<ul>\n<li><p><strong>Flowchart:<\/strong> Complete process with decision\nbranches, exceptions, and outcomes.<\/p><\/li>\n<li><p><strong>Sequence diagram:<\/strong> Communication and handoffs\nbetween people, teams, and systems.<\/p><\/li>\n<li><p><strong>State diagram:<\/strong> Different process states and\ntransitions.<\/p><\/li>\n<li><p><strong>Gantt chart:<\/strong> Activity schedules, dependencies,\nand critical paths.<\/p><\/li>\n<li><p><strong>Mind map:<\/strong> Hierarchical overview of SOP\nsections.<\/p><\/li>\n<li><p><strong>Timeline:<\/strong> Procedure milestones and revision\nhistory.<\/p><\/li>\n<\/ul>\n<p><strong>2. Interactive capabilities<\/strong><\/p>\n<ul>\n<li><p>Play, pause, reset, previous, and next controls for step-by-step\nanimation.<\/p><\/li>\n<li><p>Highlight the active step and completed steps.<\/p><\/li>\n<li><p>Scenario selector to simulate normal and exception\nconditions.<\/p><\/li>\n<li><p>Interactive decision branches that update the highlighted process\nroute.<\/p><\/li>\n<li><p>Role-based filters to show responsibilities for selected\nstakeholders.<\/p><\/li>\n<li><p>Clickable diagram nodes displaying step details, ownership,\nduration, PPE, requirements, and validation checklists.<\/p><\/li>\n<li><p>Checklist completion tracking.<\/p><\/li>\n<li><p>Zoom in, zoom out, and fit-to-screen.<\/p><\/li>\n<li><p>Animated process connections.<\/p><\/li>\n<\/ul>\n<p><strong>3. Editable Mermaid source<\/strong><\/p>\n<ul>\n<li><p>Display the underlying Mermaid code for each diagram.<\/p><\/li>\n<li><p>Allow users to edit the code and automatically redraw the\nvisualization.<\/p><\/li>\n<li><p>Provide Copy Code and Reset buttons.<\/p><\/li>\n<li><p>Enable SVG downloads.<\/p><\/li>\n<li><p>Show understandable error messages for invalid Mermaid\nsyntax.<\/p><\/li>\n<\/ul>\n<p><strong>4. UI/UX design<\/strong><\/p>\n<p>Use a premium enterprise dashboard style inspired by McKinsey\nconsulting reports.<\/p>\n<p>Layout:<\/p>\n<ul>\n<li><p>Top navigation with six diagram tabs.<\/p><\/li>\n<li><p>Left sidebar for scenarios, roles, conditions, and\nchecklists.<\/p><\/li>\n<li><p>Large central interactive diagram canvas.<\/p><\/li>\n<li><p>Playback controls and progress indicator.<\/p><\/li>\n<li><p>Collapsible Mermaid code editor below the diagram.<\/p><\/li>\n<\/ul>\n<p>Make the application responsive, visually polished, and suitable for\nlive demonstrations to senior management.<\/p>\n<p><strong>5. SOP processing<\/strong><\/p>\n<p>Extract the actual process steps from the supplied document,\nincluding decision points, responsibilities, control checks, exceptions,\nand source references.<\/p>\n<p>Preserve the source procedure's meaning and terminology. Do not\ninvent safety-critical instructions, timings, regulatory references, or\napproval requirements. Clearly flag missing information and distinguish\nassumptions from verified SOP content.<\/p>\n<p><strong>6. Technical requirements<\/strong><\/p>\n<ul>\n<li><p>Deliver one complete, functional HTML file with embedded CSS and\nJavaScript.<\/p><\/li>\n<li><p>Use Mermaid.js for diagram rendering.<\/p><\/li>\n<li><p>Use D3.js only where necessary for additional\ninteractivity.<\/p><\/li>\n<li><p>Do not require a backend, database, or server.<\/p><\/li>\n<li><p>Ensure every button and interactive feature works.<\/p><\/li>\n<li><p>Use responsive layouts suitable for desktops and\ntablets.<\/p><\/li>\n<li><p>Include appropriate error handling.<\/p><\/li>\n<li><p>Make the file suitable for local browser use and GitHub Pages\ndeployment.<\/p><\/li>\n<\/ul>\n<p><strong>Output:<\/strong> Provide a downloadable standalone HTML file\ncontaining the interactive SOP Studio, without unrelated case study\nsections or marketing material.<\/p>\n<p>Use the uploaded SOP as the authoritative content source. Any\ngenerated procedure must be explicitly labeled as a draft requiring\napproval by the responsible subject-matter experts before operational\nuse.<\/p>", "excerpt": "https://mermaid.js.org/ Prompt: Create a professional, interactive, standalone HTML application that transforms a Standard Operating Procedure (SOP) into a dyna"}, {"part": 3, "title": "Reference Lines", "kind": "Article", "imgs": ["imgs/v38_0.jpg"], "thumb": "imgs/v38_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>1. Above and below the line<\/p>\n<p>Build a 12-month column chart with a dashed target line at 100,\ncolouring bars green when they meet or beat it and red when they\nmiss.<\/p>\n<p>Add a small heading that counts how many months were at or above\ntarget.<\/p>\n<p>2. Labelled line<\/p>\n<p>Build a 12-month column chart in a single colour with a dashed target\nline at 100.<\/p>\n<p>Put a small \"Target 100\" badge on the right end of the line so it\nexplains itself without a legend.<\/p>\n<p>3. Tolerance band<\/p>\n<p>Build a 12-month column chart with a shaded band from 92 to 108\naround a target of 100, labelled \"100 ± 8\".<\/p>\n<p>Colour bars grey inside the band, green above it and red below it, so\nonly real exceptions stand out.<\/p>\n<p>4. Target and average<\/p>\n<p>Build a 12-month column chart with two reference lines: a solid\ntarget line at 100 and a dashed line at the actual average, each with\nits own labelled badge.<\/p>\n<p>Shade the gap between the two lines to show how far actual\nperformance landed from the promise.<\/p>\n<p>5. Variance from the line<\/p>\n<p>Build a 12-month chart of each month's gap from a target of 100\n(actual minus target), with the target as the zero axis.<\/p>\n<p>Draw bars up in green for months above target and down in red for\nmonths below, on a ±30 scale.<\/p>\n<p>6. Bullet chart<\/p>\n<p>Build bullet charts for 4 KPIs (Revenue, Margin, Orders, NPS), each\nwith shaded poor/fair/good bands, an actual-value bar and a target\ntick.<\/p>\n<p>Colour each bar green if it meets its target and red if it\ndoesn't.<\/p>\n<p>7. Shaded above and below<\/p>\n<p>Build a 12-month line chart with a dashed target line at 100.<\/p>\n<p>Fill the area between the line and the target green where it is above\nand red where it is below, so surplus and shortfall read as areas.<\/p>\n<p>8. Several benchmarks<\/p>\n<p>Build a 12-month line chart with three dashed reference lines: Budget\n(100), Last year (94) and Industry (112), each in its own colour.<\/p>\n<p>Label each line at its right end instead of using a legend.<\/p>\n<p>9. Pace line<\/p>\n<p>Build a cumulative year-to-date line chart against a dashed\nstraight-line \"Pace to 1,200\" ramp from zero to the annual goal.<\/p>\n<p>Shade the gap between actual and pace, and show a heading with the\nyear-end total and how far it is over or under plan.<\/p>\n<p>10. Draggable threshold<\/p>\n<p>Build a 12-month column chart with a target line the user can drag up\nand down.<\/p>\n<p>Recolour bars green or red live as the line moves, and update a note\nsaying \"At X, N of 12 months clear it\".<\/p>", "excerpt": "Prompt: 1. Above and below the line Build a 12-month column chart with a dashed target line at 100, colouring bars green when they meet or beat it and red when "}, {"part": 3, "title": "Animated KPIs", "kind": "Article", "imgs": ["imgs/v39_0.jpg"], "thumb": "imgs/v39_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>1. Odometer roll<\/p>\n<p>Build a KPI card showing \"Orders this month: 48,362\" where each digit\nrolls up on its own vertical reel, like a car odometer, with each reel\nsettling a little later than the one before.<\/p>\n<p>Add \"▲ 8.1% vs last month\" below it and a Replay button.<\/p>\n<p>2. Flip clock<\/p>\n<p>Build a KPI card showing \"New customers this quarter: 2,847\" as\nsplit-flap cards that flip digit by digit until they land on the final\nnumber, like an airport departures board.<\/p>\n<p>Add \"▲ 5.3% vs last quarter\" below it and a Replay button.<\/p>\n<p>3. Clock-hand dial<\/p>\n<p>Build a \"Customer satisfaction\" dial with 100 tick marks, where a red\nhand sweeps round to 86% while a coloured arc fills behind it, then\nwobbles slightly as it settles.<\/p>\n<p>Show the percentage in the centre of the dial and add a Replay\nbutton.<\/p>\n<p>4. Count-up and fill<\/p>\n<p>Build a \"Sales against target\" card where ₹ 1,248 Cr counts up from\nzero while a progress bar fills to 78% of a ₹ 1,600 Cr target.<\/p>\n<p>Show the % of target and \"▲ 12.4% vs last year\" counting up in step,\nand add a Replay button.<\/p>\n<p>5. Ticker tape scroller<\/p>\n<p>Build a wide card with three rows of KPIs (label, value, green or red\nchange) scrolling continuously like a stock ticker, each row at a\ndifferent speed and the middle row running the other way.<\/p>\n<p>Hovering a row pauses it, and a Pause/Play button controls all three\nrows.<\/p>", "excerpt": "Prompt: 1. Odometer roll Build a KPI card showing \"Orders this month: 48,362\" where each digit rolls up on its own vertical reel, like a car odometer, with each"}, {"part": 3, "title": "Heatmap", "kind": "Article", "imgs": ["imgs/v40_0.jpg"], "thumb": "imgs/v40_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file HTML heatmap of monthly revenue (₹ Cr, 2025) for\n15 Indian cities by 12 months. It sits on a 16:9 page that scales to fit\nany window. Use plain HTML, CSS and JavaScript, no libraries.<\/p>\n<p>LEFT CONTROL PANEL<\/p>\n<p>- Show cities: All / Top N / Bottom N, with a slider for N.<\/p>\n<p>- Rank by: total of the shown months, or any single month.<\/p>\n<p>- Colour: 6 swatches (blue, teal, orange, purple, pink, grey). The\nheatmap uses light-to-dark shades of the chosen colour.<\/p>\n<p>- A two-handle slider to hide values outside a range. Hidden cells\nshow a diagonal hatch pattern.<\/p>\n<p>- A switch to show or hide the numbers in the cells.<\/p>\n<p>- Clickable chips to hide individual cities or months, each set with\na \"Show all\" link.<\/p>\n<p>- A Reset all button.<\/p>\n<p>RIGHT: THE HEATMAP<\/p>\n<p>- Each row has a rank (#1, #2…) and a city name, then one coloured\ncell per month, then a Total column with a small bar.<\/p>\n<p>- The column being ranked by is highlighted.<\/p>\n<p>- A summary line at the top, such as \"Showing top 5 of 15 cities,\nranked by total, across 12 months. 3 cells hidden by value.\"<\/p>\n<p>- A colour legend with min and max values plus a \"Hidden\" swatch. The\ncolour scale refits to the cells on screen.<\/p>\n<p>- Hovering a cell shows a tooltip with the city, month, ₹ value, and\nwhether it is above or below that city's monthly average.<\/p>\n<p>- Show a friendly empty message if every city or every month is\nhidden.<\/p>\n<p>DATA AND STYLE<\/p>\n<p>- Sample data from a fixed seed so it's the same every time, with a\nfestive-season lift in Oct to Dec. Use Mumbai, Delhi NCR, Bengaluru,\nHyderabad, Chennai, Ahmedabad, Kolkata, Pune, Surat, Jaipur, Lucknow,\nVadodara, Indore, Kochi and Chandigarh.<\/p>\n<p>- Clean white cards, Helvetica, an accent colour that follows the\nchosen swatch, dark mode support, and print-ready. Deliver as one .html\nfile.<\/p>\n<p><strong>Simplified Prompt:<\/strong><\/p>\n<p>Build a single-file 16:9 HTML heatmap of monthly revenue for 15\nIndian cities × 12 months, with a total column and hover tooltips.<\/p>\n<p>Add a side panel for Top/Bottom N, rank by month or total, colour\nchoice, a value-range filter, a numbers on/off switch, chips to hide\ncities or months, and Reset all.<\/p>", "excerpt": "Prompt: Build a single-file HTML heatmap of monthly revenue (₹ Cr, 2025) for 15 Indian cities by 12 months. It sits on a 16:9 page that scales to fit any window"}, {"part": 3, "title": "Zoomable Table", "kind": "Article", "imgs": ["imgs/v41_0.jpg", "imgs/v41_1.jpg"], "thumb": "imgs/v41_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a premium, interactive <strong>Zoomable Hierarchical Table\n(D3.js Icicle / Partition Chart)<\/strong> based on the attached\nreference HTML file.<\/p>\n<p><strong>Objective:<\/strong> Transform complex hierarchical\ninformation into a visually engaging, interactive, three-column\nvisualization that allows users to explore categories and subcategories\nthrough animated zooming.<\/p>\n<p><strong>1. Visualization structure<\/strong><\/p>\n<p>Create a three-level hierarchical chart:<\/p>\n<ul>\n<li><p><strong>Column 1 – Root:<\/strong> Main product, process,\norganization, or system.<\/p><\/li>\n<li><p><strong>Column 2 – Categories:<\/strong> Major components,\ndepartments, stages, or groups.<\/p><\/li>\n<li><p><strong>Column 3 – Details:<\/strong> Individual components,\nactivities, or elements, along with their specifications.<\/p><\/li>\n<\/ul>\n<p>Use a D3.js partition layout to automatically position elements based\non the underlying hierarchy.<\/p>\n<p>Each category must have a distinct color, and its child elements\nshould use lighter shades of the same color.<\/p>\n<p><strong>2. Zoom and navigation<\/strong><\/p>\n<p>Replicate the interaction in the reference file:<\/p>\n<ul>\n<li><p>Clicking a category smoothly zooms into that category.<\/p><\/li>\n<li><p>All three columns remain aligned as the visualization\nchanges.<\/p><\/li>\n<li><p>The selected category expands vertically, making its child\nelements easier to read.<\/p><\/li>\n<li><p>Other categories move outside the visible focus.<\/p><\/li>\n<li><p>Clicking the selected category again zooms out to the full\nview.<\/p><\/li>\n<li><p>Clicking the root also resets the visualization.<\/p><\/li>\n<li><p>Use smooth, professional animations lasting approximately 850\nmilliseconds.<\/p><\/li>\n<\/ul>\n<p><strong>Important:<\/strong> This must be a genuinely interactive\nhierarchical visualization, not a static table or a collection of\nexpandable cards.<\/p>\n<p><strong>3. Hover tooltips<\/strong><\/p>\n<p>Display a floating tooltip when hovering over any element.<\/p>\n<p>For categories, show the category name and number of child\nelements.<\/p>\n<p>For individual elements, show their name, parent category, and\ntechnical or descriptive specifications.<\/p>\n<p>Position tooltips near the cursor without letting them overflow the\nbrowser viewport.<\/p>\n<p><strong>4. Information panel<\/strong><\/p>\n<p>Add a separate information card on the right, similar to the\nreference HTML.<\/p>\n<p>The card should contain relevant technical specifications, KPIs,\nproduct details, or business information.<\/p>\n<p>Use a clean, two-column label-and-value layout.<\/p>\n<p><strong>5. Design language<\/strong><\/p>\n<p>Follow a premium McKinsey-style consulting dashboard aesthetic:<\/p>\n<ul>\n<li><p>White cards with subtle shadows.<\/p><\/li>\n<li><p>Light grey background.<\/p><\/li>\n<li><p>Deep purple primary color (#4C1D95).<\/p><\/li>\n<li><p>Dark purple headings (#1E0B44).<\/p><\/li>\n<li><p>Orange accents (#F2A33A).<\/p><\/li>\n<li><p>DM Sans typography.<\/p><\/li>\n<li><p>Rounded corners and generous whitespace.<\/p><\/li>\n<li><p>Precise alignment and readable labels.<\/p><\/li>\n<li><p>Minimal visual clutter.<\/p><\/li>\n<\/ul>\n<p>Make the design suitable for corporate presentations, executive\ndashboards, and client demonstrations.<\/p>\n<p><strong>6. Technology<\/strong><\/p>\n<ul>\n<li><p>Use D3.js v7.<\/p><\/li>\n<li><p>Build using HTML5, CSS3, SVG, and vanilla JavaScript.<\/p><\/li>\n<li><p>Use d3.hierarchy() and d3.partition().<\/p><\/li>\n<li><p>Animate transitions using d3.transition().<\/p><\/li>\n<li><p>Use responsive SVG viewBox dimensions.<\/p><\/li>\n<li><p>Ensure smooth zooming and accurate positioning.<\/p><\/li>\n<li><p>Support desktop and tablet layouts.<\/p><\/li>\n<li><p>Respect reduced-motion accessibility preferences.<\/p><\/li>\n<\/ul>\n<p><strong>7. Dynamic data<\/strong><\/p>\n<p>Store the entire hierarchy in a clearly structured JavaScript\nobject.<\/p>\n<p>Allow the content to be replaced easily with other hierarchical\ndatasets without modifying the visualization engine.<\/p>\n<p>Automatically calculate category counts and the overall number of\nleaf-level elements.<\/p>\n<p>Do not invent factual specifications. Use the data I supply and mark\nmissing information clearly.<\/p>\n<p><strong>8. Final deliverable<\/strong><\/p>\n<p>Produce a <strong>single, standalone HTML file<\/strong> containing\nthe complete interactive visualization.<\/p>\n<p>The HTML should open directly in a browser and work without a\nbackend. External CDN loading for D3.js and fonts is acceptable.<\/p>\n<p><strong>Critical requirements:<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Reproduce the reference file's three-column zoomable partition\nlayout.<\/p><\/li>\n<li><p>Preserve smooth animated drill-down and zoom-out\nbehavior.<\/p><\/li>\n<li><p>Maintain category color consistency.<\/p><\/li>\n<li><p>Keep the right-side specification panel.<\/p><\/li>\n<li><p>Include functional hover tooltips.<\/p><\/li>\n<li><p>Ensure text remains readable when zoomed.<\/p><\/li>\n<li><p>Deliver working HTML, not a screenshot, mockup, or static\ndiagram.<\/p><\/li>\n<\/ol>\n<p>Use the attached <strong>Zoomable Table.html<\/strong> as the primary\nreference for layout, animation behavior, visual styling, and\ninteraction design.<\/p>\n<p>Adapt the underlying hierarchy and specifications to the new content\nI provide.<\/p>", "excerpt": "Prompt: Build a premium, interactive Zoomable Hierarchical Table (D3.js Icicle / Partition Chart) based on the attached reference HTML file. Objective: Transfor"}, {"part": 3, "title": "Interactive Simulation for Charts", "kind": "Article", "imgs": ["imgs/v42_0.jpg", "imgs/v42_1.jpg"], "thumb": "imgs/v42_0_t.jpg", "inline": true, "html": "<p><img src=\"imgs/v42_0.jpg\" alt=\"\"><\/p>\n<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single self-contained HTML page: an interactive \"Dealer\nIncentive Scheme Simulator &amp; Dealer Calculator\" for a home-textiles\nbrand (Welspun Living) that sells through ~580 dealers across India.<\/p>\n<p>DATA (synthetic, deterministic)<\/p>\n<p>- Use a seeded random generator (mulberry32, seed 2610) so numbers\nare identical on every load.<\/p>\n<p>- Create ~580 dealers across Indian states, grouped into 6 regions\n(North, West, South, East, Central, North East). Weight dealer counts by\nstate size (e.g. Maharashtra 60, UP 50, Tamil Nadu 45 … Sikkim 1), each\nwith 2–4 real cities.<\/p>\n<p>- Each dealer has: code (WD0001…), name (\"Shree Furnishings, Pune\"\nstyle), state, region, city, tier (Platinum 14% / Gold 36% / Silver\n50%), annual target in ₹ lakh (Platinum 90–220, Gold 30–85, Silver\n8–30), monthly target split by FY seasonality (Apr–Mar, festive peak\nOct–Nov), monthly actuals = target × dealer performance (~0.55–1.45)\nwith noise, a category mix across Bath linen / Bed linen / Rugs &amp;\ncarpets / Flooring, YoY growth %, and collection % (~72–100%).<\/p>\n<p>SCHEME ENGINE<\/p>\n<p>- Achievement = sales ÷ target for the selected months and\ncategory.<\/p>\n<p>- Slabs: 80% / 95% / 105% / 120% paying 1% / 2% / 3% / 3.5% of sales;\nnothing below entry slab.<\/p>\n<p>- Growth kicker: +0.5% of sales if YoY growth ≥ 15%.<\/p>\n<p>- Focus kicker: +1% on Rugs &amp; carpets sales.<\/p>\n<p>- Collection gate: if collections &lt; 90%, payout halved.<\/p>\n<p>- Tier multiplier: Platinum ×1.1, Gold ×1.0, Silver ×0.9.<\/p>\n<p>- Keep a frozen \"current scheme\" and an editable \"simulated scheme\"\nso every number can be compared.<\/p>\n<p>LAYOUT<\/p>\n<p>1. Filter row: Region, State (filtered by region), Tier, Category,\nFrom/To month, Reset. Show \"N dealers · Apr–Mar\" on the right.<\/p>\n<p>2. Scheme simulator panel (two columns):<\/p>\n<p>- Left: 8 sliders with live value labels — entry slab threshold\n(70–94%), slab rate multiplier (×0.5–1.5), growth kicker (0–2%), focus\nkicker (0–3%), collection gate (80–98%), dealer response near a slab\n(0–100% of gap closed when within 7 pts of next slab), market demand\nscenario (−15% to +15%), incentive budget (70–140% of current). Buttons:\n\"Run 2,000 simulations\", \"Reset to current scheme\".<\/p>\n<p>- Right: 6 output tiles — current payout, simulated payout, change\n(red if up, green if down), incremental sales, margin per extra ₹1 paid\n(assume 30% margin on incremental sales), chance of exceeding\nbudget.<\/p>\n<p>- Below tiles: Monte Carlo histogram (D3) of total payout across\nsimulated years with demand shock and dealer-level noise; bars teal\nbelow budget, red above; dashed markers for P10/P50/P90, solid marker\nfor Budget; labels must not overlap. One-line summary underneath.<\/p>\n<p>- Re-run 1,000 simulations automatically (debounced) when any slider\nmoves.<\/p>\n<p>3. Bottom row (two columns):<\/p>\n<p>- Dealer incentive calculator: dealer dropdown; a horizontal gauge\nshowing achievement against coloured slab bands; a line-by-line\nbreakdown table (sales vs target, achievement + slab, base incentive,\ngrowth kicker, focus kicker, collection gate, tier multiplier, incentive\npayable); a \"What if this dealer sells more?\" slider; a teal callout:\n\"₹X more sales takes [dealer] to the next slab, lifting payout to ₹Y\n(+₹Z)\".<\/p>\n<p>- Top dealers by payout: table of top 9 (name with tier dot, city,\nstate, achievement, payout); clicking a row opens that dealer in the\ncalculator and highlights the row.<\/p>\n<p>FORMATTING<\/p>\n<p>- Values are stored in ₹ lakh. Display adaptively: ≥ ₹100 L as \"₹x.xx\nCr\", ≥ ₹1 L as \"₹x.x L\", below that as full rupees with Indian digit\ngrouping. Never show \"₹0.0 Cr\" for small filtered views.<\/p>\n<p>- Tabular numbers everywhere.<\/p>\n<p>DESIGN<\/p>\n<p>- DM Serif Display for headings, DM Sans for UI (Google Fonts). D3 v7\nfrom cdnjs.<\/p>\n<p>- Palette: primary #9D174D, deep #2B0A1E, accent teal #0EA5A4,\nbackground #FAF6F8, text #22141C, muted #6E5F67, lines #EFE3E9.<\/p>\n<p>- Dark header bar with title, white cards with soft shadow, 10–12px\nradius, custom-styled range sliders filled in primary colour.<\/p>\n<p>- Responsive: two-column panels stack below 1000px; sliders\nsingle-column and tiles 2-up on mobile. Respect\nprefers-reduced-motion.<\/p>\n<p>- Footer note: \"Illustrative sample; names, figures and scheme values\nare synthetic. © Havish M Consulting\".<\/p>\n<p>Everything in one HTML file, no build step.<\/p>\n<p><img src=\"imgs/v42_1.jpg\" alt=\"\"><\/p>\n<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single self-contained HTML page: an interactive \"Eligibility\nagainst policy\" panel for an affordable home-loan credit co-pilot (PNB\nHousing Finance). It shows every loan amount and tenure an applicant\nqualifies for, and checks a proposed loan against credit policy.<\/p>\n<p>APPLICANTS (illustrative, switchable via a segmented control\ntop-right)<\/p>\n<p>- Priya S. · Salaried · IT support executive, Pune · income\n₹56,000/mo · obligations ₹3,200/mo · FOIR cap 55% · property value ₹30 L\n· asked ₹22 L, 20 yrs, 9.50%<\/p>\n<p>- Ramesh K. · Self-employed · Kirana store owner, Indore · income\n₹32,712/mo · obligations ₹2,500/mo · FOIR cap 50% · property ₹25 L ·\nasked ₹18 L, 20 yrs, 10.25%<\/p>\n<p>- Imran A. · Self-employed · Cab driver-owner, Lucknow · income\n₹31,271/mo · obligations ₹14,500/mo (vehicle loan with 5 EMIs left) ·\nFOIR cap 50% · property ₹19 L · asked ₹12 L, 20 yrs, 10.75%<\/p>\n<p>Show a one-line summary of the selected applicant under the header.\nSwitching applicant resets the sliders to their ask.<\/p>\n<p>POLICY MATHS<\/p>\n<p>- EMI = loan × r / (1 − (1+r)^−n), r = annual rate/1200, n = years ×\n12.<\/p>\n<p>- FOIR = (EMI + existing obligations) ÷ income; must be ≤ the\nprofile's cap.<\/p>\n<p>- LTV cap by loan size: 90% up to ₹30 L, 80% up to ₹75 L, 75% above.\nLTV = loan ÷ property value.<\/p>\n<p>- Max loan by FOIR at tenure t = (FOIR cap × income − obligations) ÷\nEMI factor(t). Max eligible = min(FOIR max, LTV max).<\/p>\n<p>- Toggle (only for applicants with a loan closing within 6 EMIs):\n\"Exclude loans closing within 6 EMIs (with closure proof)\" sets\nobligations to 0.<\/p>\n<p>LAYOUT (three columns)<\/p>\n<p>1. Left: sliders for loan amount (₹3–40 L, step 0.5), tenure (5–30\nyrs), interest rate (8–13%, step 0.05), each with a live value; the\nexclusion checkbox; an EMI box showing proposed EMI large, plus\nobligations and income.<\/p>\n<p>2. Centre: D3 eligibility frontier chart. X = tenure (5–30 yrs), Y =\nloan (0–40 L).<\/p>\n<p>- Shaded area = all eligible loan/tenure combinations.<\/p>\n<p>- Solid green curve = FOIR limit, labelled \"FOIR limit 55% of\nincome\".<\/p>\n<p>- Dashed indigo horizontal line = LTV limit, labelled \"LTV limit ₹27\nL (90% of ₹30 L)\".<\/p>\n<p>- Dashed grey ring marking the applicant's original ask, labelled\n\"asked\".<\/p>\n<p>- A draggable dot for the current proposal (green if within policy,\nred if not) with a halo, a label like \"₹17 L · 23y\", and dotted guide\nlines to both axes. Dragging or clicking anywhere on the chart snaps\nloan to ₹0.5 L and tenure to whole years, and updates the sliders.<\/p>\n<p>- An orange diamond at the current tenure showing \"max ₹X L\"; hide it\nwhen the dot is already at the max.<\/p>\n<p>3. Right: two semicircle gauges (FOIR and LTV) showing the value in a\nbig serif number, a light-green arc up to the cap, a tick and \"cap 55%\"\nlabel at the cap, and an animated value arc that turns red above the\ncap. Below them, a verdict card:<\/p>\n<p>- Within policy (green gradient): \"FOIR 33% and LTV 57% are inside\nthe limits. Headroom up to ₹27 L at 23 years.\"<\/p>\n<p>- Outside policy (orange gradient): headline \"Reduce to ₹X L\" (or\n\"Not eligible as filed\"), reasons listed, plus a suggestion such as \"Or\nkeep ₹17 L with a 25-year tenure\", or \"Excluding the closing vehicle\nloan may help\".<\/p>\n<p>FORMATTING<\/p>\n<p>- ₹ amounts in lakh as \"₹17 L\" / \"₹4.25 L\"; EMI and income in full\nrupees with Indian digit grouping.<\/p>\n<p>DESIGN<\/p>\n<p>- DM Serif Display for numbers and headlines, DM Sans for UI (Google\nFonts). D3 v7 from cdnjs.<\/p>\n<p>- Palette: primary #12614F, deep #072B24, accent #F0883E, indigo\n#3B4BA8, background #F4F8F6, text #10231E, muted #5A6E68, lines\n#DCE7E2.<\/p>\n<p>- White card with soft shadow and 12px radius; header \"④ Eligibility\nagainst policy\" with a one-line explanation underneath.<\/p>\n<p>- Responsive: the chart goes full-width above the controls below\n1060px; everything stacks on mobile, and the chart scrolls horizontally\nrather than squashing. Respect prefers-reduced-motion.<\/p>\n<p>- Footnote: \"Applicants and policy limits are illustrative and do not\nrepresent any real customer. © Havish M Consulting\".<\/p>\n<p>Everything in one HTML file, no build step.<\/p>", "excerpt": "Prompt: Build a single self-contained HTML page: an interactive \"Dealer Incentive Scheme Simulator & Dealer Calculator\" for a home-textiles brand (Welspun Livin"}, {"part": 3, "title": "Drill", "kind": "Article", "imgs": ["imgs/v43_0.jpg"], "thumb": "imgs/v43_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Create an interactive HTML + JavaScript column chart that supports\ndrill-down (click a bar to expand into sub-categories) and drill-up\n(Back button). Include expand/collapse controls to show/hide deeper\nlevels, with animated transitions and breadcrumb navigation.<\/p>", "excerpt": "Prompt: Create an interactive HTML + JavaScript column chart that supports drill-down (click a bar to expand into sub-categories) and drill-up (Back button). In"}, {"part": 3, "title": "Filter and Highlight", "kind": "Article", "imgs": ["imgs/v44_0.jpg"], "thumb": "imgs/v44
