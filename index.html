_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file HTML page (16:9, scales to fit any window) that\ndemonstrates Power BI-style cross-filtering and cross-highlighting\nbetween charts. Use plain HTML, CSS and JavaScript, no libraries.<\/p>\n<p>DATA<\/p>\n<p>- Sample sales data from a fixed seed with 4 categories, each with 3\nsubcategories: Electronics (Phones, Laptops, Audio), Furniture (Seating,\nTables, Storage), Apparel (Menswear, Womenswear, Footwear) and Grocery\n(Fresh, Packaged, Beverages).<\/p>\n<p>- Cover 4 markets (North, South, East, West) and 12 months, with a\nfestive-season lift.<\/p>\n<p>RIGHT SIDE: THE REPORT<\/p>\n<p>- 4 KPI cards: Sales (all data), After filters, Highlighted (% of\nwhat's shown), and Subcategories in view.<\/p>\n<p>- 4 charts in a 2×2 grid, labelled A to D:<\/p>\n<p>A. Sales by category as stacked columns, with each segment a lighter\ntint of its category's colour.<\/p>\n<p>B. Sales by subcategory as horizontal bars grouped under their\nparent.<\/p>\n<p>C. Sales by market as a donut with a legend.<\/p>\n<p>D. Monthly trend as a line chart.<\/p>\n<p>- Clicking any bar, segment, slice or point selects it.\nCtrl/Cmd-click adds to the selection, and clicking empty space clears\nit.<\/p>\n<p>- When a chart is the source of a selection, outline it and tag it\n\"source\".<\/p>\n<p>LEFT SIDE: CONTROLS<\/p>\n<p>- A switch to set every interaction at once: No interaction / Filter\n/ Highlight.<\/p>\n<p>- An \"Edit interactions\" grid (source charts down, target charts and\nKPIs across). Click a cell to cycle it through none, filter (F) and\nhighlight (H).<\/p>\n<p>- A \"Current selection\" panel listing what's selected in each chart\nas chips, with a Clear all button.<\/p>\n<p>- A category colour legend and a short note explaining that clicking\na segment selects parent and child, while clicking the category name\nselects the whole parent.<\/p>\n<p>BEHAVIOUR<\/p>\n<p>- Filter removes non-matching data from the target.<\/p>\n<p>- Highlight keeps the full totals faint and draws the matching part\nsolid on top: the lower part of a column, the left part of a bar, the\ninner band of a donut slice, or a second line.<\/p>\n<p>- Hover tooltips show the name, the value, and the highlighted amount\nand %.<\/p>\n<p>Clean white cards, blue accent, dark mode support. Deliver as one\n.html file.<\/p>\n<p><strong>Simplified Prompt:<\/strong><\/p>\n<p>Build a single-file 16:9 HTML report with 4 KPI cards and 4 linked\ncharts (category stacked columns, subcategory bars, market donut,\nmonthly line). Clicking any element filters or highlights the others,\nPower BI style.<\/p>\n<p>Add a side panel with a None/Filter/Highlight switch, an \"Edit\ninteractions\" grid to set each source-target pair, and a\ncurrent-selection list with Clear all.<\/p>", "excerpt": "Prompt: Build a single-file HTML page (16:9, scales to fit any window) that demonstrates Power BI-style cross-filtering and cross-highlighting between charts. U"}, {"part": 3, "title": "Force Directed Graph", "kind": "Article", "imgs": ["imgs/v45_0.jpg"], "thumb": "imgs/v45_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file HTML force-directed network graph of how JK\nCement fits together. Fit it to a 16:9 page that scales to any window.\nWrite the force layout from scratch in plain JavaScript and SVG, with no\nlibraries.<\/p>\n<p>THE NETWORK (about 40 nodes in 6 colour-coded layers)<\/p>\n<p>- Company: JK Cement Ltd at the centre.<\/p>\n<p>- Business lines: Grey cement (32.26 MTPA), White cement (1.12 MTPA),\nPutty and building materials (1.33 MTPA), Paints and wood finishes.<\/p>\n<p>- Integrated plants: Nimbahera, Mangrol, Muddapur, Panna, Buxar,\nAmpavalli, Saifco (Srinagar), Gotan, Katni, Fujairah.<\/p>\n<p>- Grinding units: Jhajjar, Aligarh, Hamirpur, Prayagraj, Ujjain,\nBalasinor, Choudhwar.<\/p>\n<p>- States or countries: link each plant to its state, or to the UAE\nfor Fujairah.<\/p>\n<p>- Brands: JK Super Cement, JK White Cement, WallMaxX, GypsoMaxX,\nJKTYLO, JKPROFIX, JKMaxx Paints.<\/p>\n<p>- Node size follows capacity in MTPA. Nodes without a published\nfigure get a nominal size.<\/p>\n<p>LAYOUT (3 columns)<\/p>\n<p>- Left panel:<\/p>\n<p>- Key company specs.<\/p>\n<p>- A search box that jumps to a matching node.<\/p>\n<p>- Buttons: Shake the layout, Motion on/off, Unpin all, Fit to\nview.<\/p>\n<p>- Sliders for link length and repulsion.<\/p>\n<p>- A layer legend where clicking a layer shows or hides it, with node\ncounts.<\/p>\n<p>- Short how-to-use notes.<\/p>\n<p>- Centre: the graph.<\/p>\n<p>- Hovering a node lights up its connections, dims the rest and shows\na tooltip.<\/p>\n<p>- Dragging a node pins it, and double-clicking releases it.<\/p>\n<p>- Scroll to zoom and drag the background to pan.<\/p>\n<p>- A small status line shows the node and link count and whether the\nlayout is settling or settled.<\/p>\n<p>- Right panel: details for the selected node (layer, capacity,\nconnections, note) and a clickable list of connected nodes for hopping\naround the network.<\/p>\n<p>Clean white cards, a distinct colour per layer, dark mode support,\nand a footer noting the capacities are as published. Deliver as one\n.html file.<\/p>\n<p><strong>Simplified Prompt:<\/strong><\/p>\n<p>Build a single-file 16:9 HTML force-directed graph (no libraries) of\nJK Cement: company, business lines, plants, grinding units, states and\nbrands as colour-coded nodes sized by capacity.<\/p>\n<p>Add drag-to-pin, hover highlighting, zoom and pan, search, layer\ntoggles, link-length and repulsion sliders, and a detail panel listing\neach node's connections.<\/p>", "excerpt": "Prompt: Build a single-file HTML force-directed network graph of how JK Cement fits together. Fit it to a 16:9 page that scales to any window. Write the force l"}, {"part": 3, "title": "Org Chart", "kind": "Article", "imgs": ["imgs/v46_0.jpg"], "thumb": "imgs/v46_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file HTML interactive organisation chart for \"Meridian\nIndustries · Leadership structure · FY 2026\". Fit it to a 16:9 page that\nscales to any window, using HTML, CSS and JavaScript.<\/p>\n<p>THE ORG (sample data, about 35 people, Indian names)<\/p>\n<p>- The CEO sits at the top. Five CXOs report to the CEO (CFO, COO,\nCHRO, CTO, CCO), each with VPs and Heads below them.<\/p>\n<p>- Each person has a name, role, department, location, year joined and\nmanager.<\/p>\n<p>- There are 6 colour-coded departments: Executive, Finance,\nOperations, People, Technology, Commercial.<\/p>\n<p>LAYOUT<\/p>\n<p>- The top two levels run across the page as cards connected by elbow\nlines. Everyone below stacks as an indented list under their manager, so\na wide org stays readable on one screen.<\/p>\n<p>- Each card shows an initials avatar (or a photo), name, role, a\ndepartment colour strip and a count of people below them. Click a card's\ntoggle to expand or collapse its team, with smooth animation.<\/p>\n<p>- The header has the title, a department legend (click a department\nto fade it out), a search box that finds a person or role and flies to\nthem, Expand all, Collapse, zoom − / fit / +, and a light/dark theme\ntoggle.<\/p>\n<p>- Drag to pan and scroll to zoom. Hovering a card highlights its\nreporting line up to the CEO.<\/p>\n<p>- Clicking a card opens a side panel with the person's details (role,\ndepartment, location, since, reports to, team size) and a clickable list\nof their direct reports.<\/p>\n<p>- A small stats box shows headcount, levels and spans, and a hint\nline reads \"Click a card for detail · drag to pan · scroll to zoom\".<\/p>\n<p>EXCEL ROUND-TRIP<\/p>\n<p>- \"↓ Excel\" downloads everyone as an editable spreadsheet with ID,\nName, Role, Department, Reports To, Location, Since and Photo\ncolumns.<\/p>\n<p>- \"↑ Upload\" rebuilds the chart from the user's own Excel or CSV.\nMatch column headers loosely (e.g. \"Manager\" or \"Reports to\"). Check for\nmissing managers, loops or multiple top people, and show a clear dialog\nlisting any problems. Add new departments automatically.<\/p>\n<p>- Use SheetJS (embedded or from cdnjs) to read and write the\nfiles.<\/p>\n<p>Clean white cards, soft shadows, a toast for feedback, and dark mode.\nDeliver as one .html file.<\/p>", "excerpt": "Prompt: Build a single-file HTML interactive organisation chart for \"Meridian Industries · Leadership structure · FY 2026\". Fit it to a 16:9 page that scales to"}, {"part": 4, "title": "Combine and Split", "kind": "Article", "imgs": ["imgs/v47_0.jpg"], "thumb": "imgs/v47_0_t.jpg", "inline": false, "html": "", "excerpt": ""}, {"part": 4, "title": "Adding Images", "kind": "Article", "imgs": ["imgs/v48_0.jpg", "imgs/v48_1.jpg"], "thumb": "imgs/v48_0_t.jpg", "inline": false, "html": "<p><strong>Four Ways to Put an Image in an HTML Page<\/strong><\/p>\n<p>An HTML page can show an image in four main ways. The right choice\ndepends on whether the page must travel as a single file. When you hand\nClaude your logo or a photo and ask for a web page, it picks one of\nthese methods. Knowing them helps you ask for the right one, and\nexplains why a page breaks when you move it.<\/p>\n<p><strong>1. Keep the image in a folder and reference it<\/strong><\/p>\n<p>The image sits as a normal file next to the HTML page, and the page\npoints to it by name.<\/p>\n<p>html<\/p>\n<p>&lt;img src=\"images/logo.png\"&gt;<\/p>\n<p>This is how most websites work. The HTML stays small and the image is\neasy to swap. The catch is that the page and the folder must always\ntravel together. If you email only the HTML file, the image disappears\nand you get a broken-image icon.<\/p>\n<p><strong>2. Embed the image as code inside the HTML<\/strong><\/p>\n<p>The image file is converted into a long string of text, called\nbase64, and placed directly inside the HTML.<\/p>\n<p>html<\/p>\n<p>&lt;img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUg...\"&gt;<\/p>\n<p>The browser turns that text back into the exact same picture, pixel\nfor pixel. The image now lives inside the page, so one file carries\neverything. It works offline and survives email. This is what Claude\nusually does when you attach a logo. The cost is that the file grows by\nabout a third, so this suits logos and a few small images, not a photo\ngallery.<\/p>\n<p><strong>3. Link to an image URL<\/strong><\/p>\n<p>The image is hosted somewhere online, and the page loads it from that\nweb address.<\/p>\n<p>html<\/p>\n<p>&lt;img src=\"https://yourwebsite.com/logo.png\"&gt;<\/p>\n<p>The HTML stays tiny, and the image can be shared across many pages.\nBut the page needs internet, and if the link moves or is deleted, the\nimage breaks. Many share links, such as Google Drive links, open a\nviewer page instead of the raw image, so they often fail here.<\/p>\n<p><strong>4. Inline SVG for logos and icons<\/strong><\/p>\n<p>Some images are not made of pixels but of drawing instructions, like\n“a navy circle here, a line there.” This format is called SVG, and most\nlogos exist in it. Its code can be pasted straight into the HTML.<\/p>\n<p>html<\/p>\n<p>&lt;svg viewBox=\"0 0 100 100\"&gt;&lt;circle cx=\"50\" cy=\"50\" r=\"40\"\nfill=\"#1E2761\"/&gt;&lt;/svg&gt;<\/p>\n<p>An SVG stays sharp at any size, is usually very small, and its\ncolours can be changed with code. If your designer can give you an SVG\nversion of your logo, this is the best option.<\/p>\n<p><strong>Which one to choose<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Method<\/strong><\/th>\n<th><strong>Single file?<\/strong><\/th>\n<th><strong>Works offline?<\/strong><\/th>\n<th><strong>File size<\/strong><\/th>\n<th><strong>Best for<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Folder reference<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<td>Small<\/td>\n<td>Websites and projects with many images<\/td>\n<\/tr><tr>\n<td>Embedded (base64)<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>About 33% larger<\/td>\n<td>Reports and pages you email or share as one file<\/td>\n<\/tr><tr>\n<td>Image URL<\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<td>Small<\/td>\n<td>Images already hosted online<\/td>\n<\/tr><tr>\n<td>Inline SVG<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>Very small<\/td>\n<td>Logos, icons and simple graphics<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p>A simple rule: if the page must travel as one file, embed the image\nor use SVG. If it lives on a website, use a folder or a URL.<\/p>\n<p><strong>When you don’t need an image at all<\/strong><\/p>\n<p>Simple shapes, badges and charts can be drawn with code instead, and\nstandard icons can come from free icon libraries. Never ask AI to redraw\nyour real logo this way, because it can only approximate it. AI looks at\nyour image to understand it, but the exact copy comes from moving the\noriginal file, not from redrawing it. \n<\/p>", "excerpt": "Four Ways to Put an Image in an HTML Page An HTML page can show an image in four main ways. The right choice depends on whether the page must travel as a single"}, {"part": 4, "title": "Hover vs Mouse Wheel Scroll", "kind": "Article", "imgs": ["imgs/v49_0.jpg"], "thumb": "imgs/v49_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single, self-contained HTML page: an interactive gallery of\nscrollable preview cards.<\/p>\n<p>CONTENT<\/p>\n<p>- Topic: [TOPIC, e.g. \"4 ways to put an image in HTML\"]<\/p>\n<p>- Number of cards: [3–6]<\/p>\n<p>- Each card is a tall mini-page about one item: [LIST THE ITEMS]<\/p>\n<p>- Each mini-page has: a coloured hero (label, title, one-line\nsummary, a small CSS/SVG illustration), then 3–4 short sections such as\n[e.g. code snippet / 3 quick facts / pros &amp; cons / \"best for\"].<\/p>\n<p>- Keep content limited and uncluttered: short sentences, plenty of\nwhite space, no filler.<\/p>\n<p>- If I don't give content, write it yourself from the topic.<\/p>\n<p>LAYOUT<\/p>\n<p>- Title and one-line intro at the top.<\/p>\n<p>- A control bar below it.<\/p>\n<p>- Cards in a responsive grid (2 columns on desktop, 1 on mobile).<\/p>\n<p>- Each card looks like a small browser window (three dots + a fake\naddress) with a fixed-height frame (~340px) and a thin progress bar at\nthe bottom showing how far it has scrolled.<\/p>\n<p>INTERACTIONS<\/p>\n<p>1. Hover to scroll: hovering a card scrolls its content downward\nsmoothly; moving the mouse away rewinds it to the top.<\/p>\n<p>2. Each card scrolls independently of the others.<\/p>\n<p>3. Click to peek: clicking a card zooms it up from its position into\na large centred pop-up (FLIP-style animation), with a dimmed backdrop.\nThe pop-up content is larger and scrolls with the mouse wheel. Close\nwith ×, Esc, or a backdrop click (it shrinks back into the card).<\/p>\n<p>4. Speed slider: sets auto-scroll speed in px/second (range 20–240,\ndefault 80), with the live value shown.<\/p>\n<p>5. Mode toggle: \"Auto on hover\" vs \"Mouse wheel\". In wheel mode,\ncards scroll manually and the slider is disabled. Show a small hint that\nchanges with the mode.<\/p>\n<p>STYLE<\/p>\n<p>- [BRAND / COLOURS / FONTS, or \"choose a clean, professional\nlook\"]<\/p>\n<p>- Distinct hero colour per card, consistent everything else.<\/p>\n<p>- Works in light and dark mode, keyboard accessible (Enter opens a\ncard, visible focus), respects reduced motion.<\/p>\n<p>- No external libraries; plain HTML, CSS and JavaScript in one\nfile.<\/p>", "excerpt": "Prompt: Build a single, self-contained HTML page: an interactive gallery of scrollable preview cards. CONTENT - Topic: [TOPIC, e.g. \"4 ways to put an image in H"}, {"part": 4, "title": "Export Options", "kind": "Article", "imgs": ["imgs/v50_0.jpg"], "thumb": "imgs/v50_0_t.jpg", "inline": false, "html": "<p>Most people who build something with AI stop one step too early. They\nget a working page — a dashboard, a tracker, a calculator — and then\nsend a screenshot of it to their colleague. The page is good. The\nscreenshot is not. It cannot be sorted, filtered, filed or forwarded,\nand the moment the underlying numbers change it becomes a lie.<\/p>\n<p>The gap is not a technical one. A single HTML file, with nothing\nbehind it, can hand the user an Excel workbook, a Word document, a PDF,\na PowerPoint deck or a zip of all four. Very few people building with AI\nask for this, because they do not know it is possible. It is worth\nknowing, because the export button is usually what turns a demo into a\ntool people actually use.<\/p>\n<p><strong>Why exports decide whether your tool survives<\/strong><\/p>\n<p>Every business tool sits inside a workflow that already exists. The\nfinance analyst still has to paste the numbers into the month-end pack.\nThe consultant still has to attach something to the email. The team lead\nstill has to file the report.<\/p>\n<p>If your page cannot produce the artefact that workflow expects, one\nof two things happens. Either the user retypes the output by hand, which\nthey will resent and eventually stop doing, or they abandon the tool and\ngo back to the spreadsheet. Neither failure looks like a technical\nfailure. It looks like \"we tried that AI thing and it did not\nstick\".<\/p>\n<p>An export button is therefore not a nice finishing touch. It is the\njoin between your tool and the organisation around it.<\/p>\n<p><strong>The two tiers of export<\/strong><\/p>\n<p>Everything a browser can produce falls into one of two tiers, and the\ndifference matters when you are specifying what you want.<\/p>\n<p><strong>Tier one needs nothing at all.<\/strong> Plain browser code\ncan write a file and hand it to the user. This covers CSV, TSV, JSON,\nMarkdown, HTML, images in PNG, JPEG or SVG, and a rich clipboard copy\nthat pastes into Word or Excel with its formatting intact. It also\ncovers PDF, through the browser's own print dialog and its Save as PDF\noption, which produces the sharpest text of any method available.<\/p>\n<p><strong>Exhibit: Formats a browser can produce on its\nown<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Format<\/strong><\/th>\n<th><strong>What it gives you<\/strong><\/th>\n<th><strong>Worth knowing<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>CSV<\/td>\n<td>The data, ready for any other system<\/td>\n<td>Add a byte order mark or Excel mangles ₹ and accented names<\/td>\n<\/tr><tr>\n<td>TSV<\/td>\n<td>Tab-separated data<\/td>\n<td>Pastes into a spreadsheet cleanly<\/td>\n<\/tr><tr>\n<td>JSON<\/td>\n<td>Structured data for another tool or script<\/td>\n<td>For handing to a developer, not to a colleague<\/td>\n<\/tr><tr>\n<td>Markdown<\/td>\n<td>A table for notes, wikis and documentation<\/td>\n<td>Plain text, survives anywhere<\/td>\n<\/tr><tr>\n<td>HTML<\/td>\n<td>A standalone page anyone can open<\/td>\n<td>No software needed at the other end<\/td>\n<\/tr><tr>\n<td>Excel (.xls)<\/td>\n<td>A formatted sheet, via an HTML table saved with an Excel file\ntype<\/td>\n<td>Excel shows a one-time format warning. Fine internally, not for\nclients<\/td>\n<\/tr><tr>\n<td>Word (.doc)<\/td>\n<td>Headings and tables, via the same trick<\/td>\n<td>Same warning, same rule<\/td>\n<\/tr><tr>\n<td>Selectable-text PDF<\/td>\n<td>The browser's print dialog, Save as PDF<\/td>\n<td>Sharpest text of any method, and free<\/td>\n<\/tr><tr>\n<td>SVG<\/td>\n<td>A chart as true vector<\/td>\n<td>Opens in Illustrator, Figma and PowerPoint, stays sharp at any\nsize<\/td>\n<\/tr><tr>\n<td>PNG / JPEG<\/td>\n<td>A chart as an image<\/td>\n<td>Render at 2x so it holds up on a high-resolution screen<\/td>\n<\/tr><tr>\n<td>Clipboard, rich text<\/td>\n<td>A table that pastes into Word or Excel with formatting intact<\/td>\n<td>The most-used export in practice, and the most overlooked<\/td>\n<\/tr><tr>\n<td>Clipboard, image<\/td>\n<td>A chart that pastes straight into a slide<\/td>\n<td>Saves the save-then-insert round trip<\/td>\n<\/tr><tr>\n<td>.ics / .vcf<\/td>\n<td>Calendar invite, contact card<\/td>\n<td>Same technique, different text format<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p>There are two useful tricks in this tier. A table written as HTML but\nsaved with an Excel file type opens in Excel as a formatted sheet, and\nthe same trick with a Word file type opens in Word with headings and\ntables intact. Both show a one-time warning that the file format does\nnot match the extension. For a quick internal deliverable that warning\nis a fair trade. For anything going to a client, it is not.<\/p>\n<p><strong>Tier two needs a library.<\/strong> A genuine .xlsx with\nmultiple sheets and no warning, a genuine .docx, a PDF you lay out\nyourself, an editable PowerPoint deck, a zip bundle of several files at\nonce. These need a code library, typically half a megabyte to a megabyte\neach.<\/p>\n<p><strong>Exhibit: Formats that need a library embedded in the\nfile<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Format<\/strong><\/th>\n<th><strong>Library<\/strong><\/th>\n<th><strong>Approximate size<\/strong><\/th>\n<th><strong>What it adds over the free version<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Excel (.xlsx)<\/td>\n<td>SheetJS<\/td>\n<td>900 KB<\/td>\n<td>A genuine workbook, multiple sheets, no warning dialog<\/td>\n<\/tr><tr>\n<td>Excel with full styling<\/td>\n<td>ExcelJS<\/td>\n<td>1 MB<\/td>\n<td>Colours, borders, column widths, frozen panes<\/td>\n<\/tr><tr>\n<td>Word (.docx)<\/td>\n<td>docx.js<\/td>\n<td>700 KB<\/td>\n<td>A genuine Word document with proper headings, tables and page\nbreaks<\/td>\n<\/tr><tr>\n<td>PDF, vector<\/td>\n<td>jsPDF with AutoTable<\/td>\n<td>400 KB<\/td>\n<td>You control the layout, text stays selectable, long tables split\nacross pages<\/td>\n<\/tr><tr>\n<td>PDF, screenshot<\/td>\n<td>html2canvas with jsPDF<\/td>\n<td>600 KB<\/td>\n<td>Pixel-identical to the screen, but the text becomes an image<\/td>\n<\/tr><tr>\n<td>PowerPoint (.pptx)<\/td>\n<td>PptxGenJS<\/td>\n<td>500 KB<\/td>\n<td>Editable slides with real tables, not pictures of tables<\/td>\n<\/tr><tr>\n<td>Zip bundle<\/td>\n<td>JSZip<\/td>\n<td>100 KB<\/td>\n<td>One download instead of five<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p>The important point is that the library can be embedded inside the\nHTML file itself. Ask for that explicitly, because the default behaviour\nis to load libraries from the internet, and the day someone opens your\nfile on a locked-down corporate laptop or on a plane, the page breaks. A\nself-contained file is larger and completely reliable. In a business\nsetting, take the trade.<\/p>\n<p><strong>Which format for which job<\/strong><\/p>\n<p>The instinct is to offer every format. Resist it. Each format carries\nan implicit instruction about what the recipient should do next, and\noffering all of them signals that you did not think about it.<\/p>\n<p><strong>Exhibit: Matching the format to the situation<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>The situation<\/strong><\/th>\n<th><strong>The format<\/strong><\/th>\n<th><strong>Because<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>The data is going into another system or model<\/td>\n<td>CSV<\/td>\n<td>The most useful format on the list, and the most commonly\nforgotten<\/td>\n<\/tr><tr>\n<td>The recipient will re-sort, extend or recut the numbers<\/td>\n<td>Excel<\/td>\n<td>Put the summary on its own sheet<\/td>\n<\/tr><tr>\n<td>The deliverable is an argument, and someone will edit the\nwording<\/td>\n<td>Word<\/td>\n<td>Structure matters more than the data<\/td>\n<\/tr><tr>\n<td>The content is final and should not change<\/td>\n<td>Selectable-text PDF<\/td>\n<td>The default for anything leaving the organisation<\/td>\n<\/tr><tr>\n<td>The material will be presented<\/td>\n<td>PowerPoint<\/td>\n<td>An editable table beats a picture of a table<\/td>\n<\/tr><tr>\n<td>One chart needs to travel into someone else's deck<\/td>\n<td>SVG, or PNG at 2x<\/td>\n<td>The vector version stays sharp when resized<\/td>\n<\/tr><tr>\n<td>The recipient needs several of the above<\/td>\n<td>Zip<\/td>\n<td>One click instead of five<\/td>\n<\/tr><tr>\n<td>The output is going into an email<\/td>\n<td>Rich-text clipboard copy<\/td>\n<td>The most common action of all, and the biggest time saver<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Two limits worth being clear about<\/strong><\/p>\n<p>The first is deliberate: everything described here happens on the\nuser's own machine. No data is uploaded, nothing passes through a\nserver. When the content is client data or salary figures or anything\nunder an NDA, that is not a limitation, it is the main argument in\nfavour of the approach.<\/p>\n<p>The second is real: a browser file cannot save to a shared drive,\npost to a team channel or send an email on its own. Those require\ncredentials, a connection and a system to connect to. The honest\nworkaround is to export the file and let the person put it where it\nbelongs. If a tool genuinely needs to write into a live system, it has\noutgrown a single HTML file, and that is a different conversation.<\/p>\n<p><strong>How to ask for it<\/strong><\/p>\n<p>The pattern is short, and it works whichever AI tool you use:<\/p>\n<blockquote>\n<p>Add an export bar to this page. Excel with the data on one sheet and\nthe summary on another, a PDF with the chart and the table, and a CSV.\nEmbed the libraries in the file so it works with no internet. Show the\nfilename after each download.<\/p>\n<\/blockquote>\n<p>Three things in that instruction do the work. Naming the formats,\nrather than asking for exports in general. Saying what goes into each\none, so the Excel file is not just the screen dumped into a grid. And\nrequiring that it works offline, which is the single request most people\nleave out and most often regret.<\/p>\n<p><strong>The takeaway<\/strong><\/p>\n<p>The value of a tool is not the analysis it performs. It is the\nartefact somebody else can act on. A page that produces a clean Excel\nfile and a clean PDF will be used long after a more sophisticated page\nthat only produces a view on screen.<\/p>\n<p>Build the export before you polish the interface. It is the part that\ndetermines whether the work leaves your laptop.<\/p>", "excerpt": "Most people who build something with AI stop one step too early. They get a working page — a dashboard, a tracker, a calculator — and then send a screenshot of "}, {"part": 4, "title": "Record Video", "kind": "Article", "imgs": ["imgs/v51_0.jpg"], "thumb": "imgs/v51_0_t.jpg", "inline": false, "html": "", "excerpt": ""}, {"part": 4, "title": "Facial Avatar", "kind": "Article", "imgs": ["imgs/v52_0.jpg", "imgs/v52_1.jpg"], "thumb": "imgs/v52_0_t.jpg", "inline": false, "html": "", "excerpt": ""}, {"part": 4, "title": "Browser Cache", "kind": "Article", "imgs": ["imgs/v53_0.jpg"], "thumb": "imgs/v53_0_t.jpg", "inline": false, "html": "<p><strong>What the Browser Keeps: Cache and Storage in a Single HTML\nFile<\/strong><\/p>\n<p>There is a moment that happens to almost everyone who starts building\nwith AI. You change something in your file, save it, refresh the\nbrowser, and nothing changes. The old version is still on screen. You\nchange it again. Still nothing. After ten minutes of this you conclude\nthe AI broke something.<\/p>\n<p>It did not. The browser is showing you a copy it kept from earlier.\nUnderstanding what the browser keeps, and why, is one of those small\npieces of knowledge that saves hours of confusion and quietly makes your\ntools better.<\/p>\n<p>There are two separate things at work, and they get confused\nconstantly. The first is the cache, which is how the browser stores the\nfile itself. The second is storage, which is how your page remembers\nwhat the user did. Different mechanisms, different rules, different\nproblems.<\/p>\n<p><strong>Part one: the cache, or why your changes do not\nappear<\/strong><\/p>\n<p>When a browser loads anything — a page, an image, a code library — it\nkeeps a copy on disk. The next time that same thing is needed it uses\nthe copy rather than fetching it again. This is why the second visit to\na website feels instant.<\/p>\n<p>The rule is that the browser decides how long to trust its copy,\nbased on instructions from the server. For a file you are editing on\nyour own machine, that logic still applies, and it is usually the reason\nyour edits seem to vanish.<\/p>\n<p>The fix takes two seconds once you know it: a hard refresh.\n<strong>Ctrl+Shift+R<\/strong> on Windows, <strong>Cmd+Shift+R<\/strong>\non a Mac. That tells the browser to discard what it has and fetch\neverything again. If you are going to be iterating on a file for an\nhour, open the developer tools with F12 and tick \"Disable cache\" in the\nNetwork tab, which keeps the browser honest for as long as the tools are\nopen.<\/p>\n<p>Worth knowing: this is also why a page that loads a library from the\ninternet works fine all week and then breaks on a plane. The library was\nnever in your file. It was in the browser's cache, and the cache\nexpired.<\/p>\n<p><strong>Part two: storage, or how your page remembers\nthings<\/strong><\/p>\n<p>The cache is about the file. Storage is about the contents — the\nnumbers someone typed, the tab they had open, the draft they had not\nfinished. A single HTML file has four places to keep them, and choosing\nthe wrong one is the most common mistake in this area.<\/p>\n\n<p><strong>Exhibit: The four places a page can keep data<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Where<\/strong><\/th>\n<th><strong>Survives a reload<\/strong><\/th>\n<th><strong>Survives closing the tab<\/strong><\/th>\n<th><strong>Shared between tabs<\/strong><\/th>\n<th><strong>Rough limit<\/strong><\/th>\n<th><strong>Use it for<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>A variable in the code<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<td>Whatever memory allows<\/td>\n<td>Anything you are happy to lose<\/td>\n<\/tr><tr>\n<td>sessionStorage<\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<td>About 5 MB<\/td>\n<td>One sitting's work: the open tab, a filter, a step in a form<\/td>\n<\/tr><tr>\n<td>localStorage<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>About 5 MB<\/td>\n<td>Preferences, drafts, the last version of a report<\/td>\n<\/tr><tr>\n<td>IndexedDB<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>Hundreds of MB<\/td>\n<td>Large datasets, files, images, anything past a few MB<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p>Two of these deserve a comment.<\/p>\n<p><strong>localStorage<\/strong> is the default choice and the one you\nwill use ninety per cent of the time. It holds text, it is simple, and\nit survives a browser restart. Its limit is around five megabytes, which\nis far more than it sounds — a few thousand rows of a table fit\ncomfortably.<\/p>\n<p><strong>IndexedDB<\/strong> is what you move to when you outgrow that:\na year of daily records, uploaded images, a cached dataset. It is more\nwork to use, which is why it is worth naming explicitly when you ask for\nit, rather than hoping it appears.<\/p>\n<p><strong>The boundary nobody explains<\/strong><\/p>\n<p>Storage is tied to the origin, which means roughly the website\naddress the page came from. Data saved by a page on one address cannot\nbe read by a page on another. This has three consequences that surprise\npeople:<\/p>\n<ul>\n<li><p>Data does not travel with the file. If you email your report tool\nto a colleague, they receive the tool, not your saved work. Their\nbrowser starts empty.<\/p><\/li>\n<li><p>The same file in two places is two different stores. Open it from\nyour Downloads folder, then open it from a shared drive, and the second\ncopy will not see what the first one saved.<\/p><\/li>\n<li><p>Clearing browsing data clears it. If the user tidies up their\nbrowser, or opens the page in a private window, everything the page\nremembered is gone.<\/p><\/li>\n<\/ul>\n<p>None of this makes storage a bad idea. It makes it the wrong place\nfor anything that matters. The rule is simple: <strong>storage is a\nconvenience, not a record.<\/strong> Anything the user would be upset to\nlose must be exportable to a file. This is why the save button and the\nexport button are two different things and you need both.<\/p>\n<p><strong>What this means in practice<\/strong><\/p>\n<p><strong>Exhibit: Matching the mechanism to the need<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>What you want<\/strong><\/th>\n<th><strong>Use<\/strong><\/th>\n<th><strong>Why<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Remember the user's preferences and filters<\/td>\n<td>localStorage<\/td>\n<td>Small, simple, survives a restart<\/td>\n<\/tr><tr>\n<td>Keep a draft while they work<\/td>\n<td>localStorage, saved as they type<\/td>\n<td>Costs almost nothing, prevents the worst outcome<\/td>\n<\/tr><tr>\n<td>Remember which tab or step they were on<\/td>\n<td>sessionStorage<\/td>\n<td>Should not follow them into tomorrow<\/td>\n<\/tr><tr>\n<td>Hold a large dataset the page loaded<\/td>\n<td>IndexedDB<\/td>\n<td>Past five megabytes, localStorage fails<\/td>\n<\/tr><tr>\n<td>Hold anything the user cannot afford to lose<\/td>\n<td>An exported file<\/td>\n<td>Storage is not a record and never was<\/td>\n<\/tr><tr>\n<td>Make your page work offline for good<\/td>\n<td>Embed the libraries in the file<\/td>\n<td>The cache is not a guarantee, only a convenience<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>How to ask for it<\/strong><\/p>\n<p>The instruction is short:<\/p>\n<blockquote>\n<p>Save the user's edits to localStorage as they type, and reload them\nwhen the page opens. Add a Reset button. Tell the user plainly that the\ndata is saved in this browser only and add an export to file.<\/p>\n<\/blockquote>\n<p>The last clause is the one people leave out, and it is the one that\nprevents the complaint that always follows: <em>I lost\neverything.<\/em><\/p>\n<p><strong>The takeaway<\/strong><\/p>\n<p>The cache is the browser being efficient with the file. Storage is\nyour page being useful with the data. Both are working exactly as\ndesigned, and both look like bugs the first time they surprise you.<\/p>\n<p>Two habits cover almost every case. Hard refresh while you build, so\nyou are always looking at what you actually wrote. And treat anything\nthe browser remembers as a courtesy to the user, never as the place\ntheir work lives.<\/p>", "excerpt": "What the Browser Keeps: Cache and Storage in a Single HTML File There is a moment that happens to almost everyone who starts building with AI. You change someth"}, {"part": 5, "title": "Brand Colors", "kind": "Article", "imgs": ["imgs/v54_0.jpg"], "thumb": "imgs/v54_0_t.jpg", "inline": false, "html": "<p><a target=\"_blank\" rel=\"noopener\" href=\"https://coolors.co/\">https://coolors.co/<\/a><\/p>", "excerpt": "https://coolors.co/"}, {"part": 5, "title": "Color Picker", "kind": "Article", "imgs": ["imgs/v55_0.jpg"], "thumb": "imgs/v55_0_t.jpg", "inline": false, "html": "", "excerpt": ""}, {"part": 6, "title": "Vibe Coding Platforms", "kind": "Article", "imgs": [], "thumb": null, "inline": false, "html": "<p><a target=\"_blank\" rel=\"noopener\" href=\"https://replit.com\">https://replit.com<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://lovable.dev\">https://lovable.dev<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://bolt.new\">https://bolt.new<\/a><\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://app.emergent.sh\">https://app.emergent.sh<\/a><\/p>", "excerpt": "https://replit.com https://lovable.dev https://bolt.new https://app.emergent.sh"}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const A=D.articles;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=(t,i)=>'a'+i+'-'+t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
A.forEach((a,i)=>a.id=slug(a.title,i));
const nImg=A.filter(a=>a.imgs.length).length;
document.getElementById('sub').textContent=`${A.length} articles across ${D.parts.length} parts · ${nImg} with images`;
let filter='all';
const lib=document.getElementById('lib');
const partName=pi=>['Part '+(pi+1),D.parts[pi]];
function meta(a){const n=a.imgs.length;if(!n)return'Article';const im=n+(n>1?' images':' image');return a.html?im+' + article':im}
function render(){
  lib.innerHTML=D.parts.map((p,pi)=>{
    const items=A.map((a,i)=>[a,i]).filter(([a])=>a.part===pi&&(filter==='all'||(filter==='img'?a.imgs.length:!a.imgs.length)));
    if(!items.length)return'';
    const [pn,pt]=partName(pi);
    return `<section><div class="ph"><span class="pn">${pn}</span><h2>${esc(pt)}</h2></div><div class="grid">${items.map(([a,i])=>{
      const th=a.thumb?`<img src="${a.thumb}" alt="" loading="lazy">${a.imgs.length>1?`<span class="badge">${a.imgs.length} images</span>`:''}`
        :`<div class="txt"><div class="q">${esc(a.title)}</div><div class="ex">${esc(a.excerpt)}…</div></div>`;
      return `<button class="card" data-i="${i}" id="c-${a.id}"><div class="thumb">${th}</div><div class="ct">${esc(a.title)}</div><div class="cm">${meta(a)}</div></button>`}).join('')}</div></section>`;
  }).join('');
}
render();
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
lib.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)open(+c.dataset.i)});

const ov=document.getElementById('ov'),mb=document.getElementById('mb');
let cur=-1,lastFocus=null;
function open(i,fromHash){
  if(cur<0)lastFocus=document.activeElement;
  cur=(i+A.length)%A.length;const a=A[cur];
  document.getElementById('mp').textContent=partName(a.part).join(' · ');
  document.getElementById('mt').textContent=a.title;
  const pics=`<div class="pics">${a.imgs.map(s=>`<a href="${s}" target="_blank" rel="noopener" title="Open full size"><img src="${s}" alt="${esc(a.title)}"></a>`).join('')}</div>`;
  const art=`<div class="art"><div>${a.html}</div></div>`;
  if(a.inline||!a.imgs.length){mb.className='mb solo';mb.innerHTML=art}
  else if(!a.html){mb.className='mb solo';mb.innerHTML=pics}
  else{mb.className='mb';mb.innerHTML=pics+art}
  mb.scrollTop=0;mb.querySelectorAll('.pics,.art').forEach(el=>el.scrollTop=0);
  ov.hidden=false;document.body.classList.add('lock');
  if(!fromHash&&location.hash!=='#'+a.id)history.replaceState(null,'','#'+a.id);
  document.getElementById('close').focus();
}
function close(){ov.hidden=true;document.body.classList.remove('lock');cur=-1;
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  if(lastFocus)lastFocus.focus()}
document.getElementById('close').onclick=close;
document.getElementById('prev').onclick=()=>open(cur-1);
document.getElementById('next').onclick=()=>open(cur+1);
ov.addEventListener('click',e=>{if(e.target===ov)close()});
document.addEventListener('keydown',e=>{if(ov.hidden)return;
  if(e.key==='Escape')close();else if(e.key==='ArrowRight')open(cur+1);else if(e.key==='ArrowLeft')open(cur-1)});
function fromHash(){const h=location.hash.slice(1);const i=A.findIndex(a=>a.id===h);if(i>=0)open(i,true);else if(!ov.hidden)close()}
window.addEventListener('hashchange',fromHash);fromHash();
</script>
