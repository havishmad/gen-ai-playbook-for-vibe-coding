<!doctype html>

<head>

<title>Vibe Coding Playbook Library</title>
<style>
/* Layout: plain white library shelf — parts as sections, 4:5 cards, popup reader split infographic | article */
:root{
  --bg:#ffffff; --ink:#14203f; --muted:#5d6782; --line:#e3e7ef; --soft:#f4f6fa; --navy:#1e2761; --accent:#2f5bd3;
  --display:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:48px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;letter-spacing:-.015em;font-size:clamp(26px,3.4vw,36px);line-height:1.08;margin:8px 0 6px;color:var(--navy);text-wrap:balance}
.sub{color:var(--muted);margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:500 13px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.filters button:focus-visible,.card:focus-visible,.mbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{margin-top:44px}
.ph{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.ph .pn{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent);white-space:nowrap}
.ph h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 22px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft);transition:transform .18s ease,box-shadow .18s ease}
.card:hover .thumb{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(20,32,63,.35)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.txt{height:100%;padding:20px 18px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.txt .q{font-family:var(--display);font-weight:700;letter-spacing:-.01em;font-size:22px;line-height:1.15;color:var(--navy)}
.txt .ex{font-size:12.5px;color:var(--muted);line-height:1.5;flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent)}
.badge{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;background:rgba(255,255,255,.94);color:var(--navy);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.ct{font-weight:600;font-size:14.5px;line-height:1.3;color:var(--ink)}
.cm{font-size:12px;color:var(--muted);margin-top:-6px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(14,22,48,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--bg);width:min(1240px,100%);height:min(94vh,100%);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.mh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh .t{flex:1;min-width:0}
.mh .t small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.mh .t strong{display:block;font-family:var(--display);font-weight:700;font-size:22px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn{font:500 13px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);height:36px;min-width:36px;padding:0 10px;border-radius:6px;cursor:pointer}
.mbtn:hover{background:var(--soft)}
.mb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mb.solo{grid-template-columns:minmax(0,1fr)}
.pics{overflow:auto;background:var(--soft);padding:20px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line)}
.pics a{display:block}
.pics img{width:100%;display:block;border-radius:4px;box-shadow:0 2px 10px -4px rgba(20,32,63,.25);background:#fff}
.art{overflow:auto;padding:26px 34px 48px}
.art>div{max-width:68ch;margin:0 auto}
.mb.solo .art>div{max-width:780px}
.art p{margin:0 0 .9em}
.art h3,.art h4{font-family:var(--display);font-weight:700;color:var(--navy)}
.art strong{color:var(--navy)}
.art ul,.art ol{padding-left:1.2em;margin:0 0 1em}
.art li{margin-bottom:.45em}
.art a{color:var(--accent);word-break:break-all}
.tw{overflow-x:auto;margin:0 0 1.2em;border:1px solid var(--line);border-radius:6px}
.art table{border-collapse:collapse;width:100%;font-size:13px}
.art th,.art td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.art thead th,.art tr:first-child th{background:var(--soft)}
.art td p,.art th p{margin:0}
@media (max-width:820px){
  .mb{grid-template-columns:minmax(0,1fr);overflow:auto;display:block}
  .pics{overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .art{overflow:visible;padding:20px 18px 40px}
  .mh .t strong{font-size:18px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){.thumb{transition:none}.card:hover .thumb{transform:none}}
body.lock{overflow:hidden}
.mb.solo .pics{border-right:0;align-items:center}
.mb.solo .pics a{width:100%;max-width:1100px}
.art>div>img,.art p>img{display:block;max-width:100%;margin:1.2em auto;border:1px solid var(--line);border-radius:4px}
.art pre,.art code{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:13px}
.art pre{background:var(--soft);padding:12px 14px;border-radius:6px;overflow-x:auto}
.art p{overflow-wrap:anywhere}
.txt .q{font-size:20px}
</style>
</head>

<script id="data" type="application/json">{"parts": ["Basics", "Dashboard and Reports", "Content and Interaction", "Charts & Data Visualization", "Media and Export", "Branding and Visual Style", "Links"], "articles": [{"part": 0, "title": "Vibe Coding", "kind": "Article", "imgs": ["imgs/v00_0.jpg", "imgs/v00_1.jpg"], "thumb": "imgs/v00_0_t.jpg", "inline": false, "html": "", "excerpt": ""}, {"part": 0, "title": "What is HTML", "kind": "Article", "imgs": ["imgs/v01_0.jpg"], "thumb": "imgs/v01_0_t.jpg", "inline": true, "html": "<p><strong>Why HTML Matters for Non-Coders<\/strong><\/p>\n<p>When you ask AI to build a dashboard, calculator or tool, it usually\ngives you an HTML file. If you use vibe coding, you will work with HTML\noften. You do not need to write it. You need to understand it well\nenough to check it, fix small things and ask for the right changes.<\/p>\n<p><strong>Why AI gives you HTML<\/strong><\/p>\n<p>HTML is the simplest way to share a working tool.<\/p>\n<ul>\n<li><p>It opens in any browser. No software to install.<\/p><\/li>\n<li><p>It works on laptops and phones.<\/p><\/li>\n<li><p>It can be emailed, saved to a shared drive or shared as a\nlink.<\/p><\/li>\n<li><p>One file can hold text, tables, charts, buttons and\ncalculations.<\/p><\/li>\n<\/ul>\n<p><strong>The three parts of an HTML file<\/strong><\/p>\n<p>Most HTML files have three parts:<\/p>\n<ul>\n<li><p>HTML: what is on the page. Headings, text, tables,\nbuttons.<\/p><\/li>\n<li><p>CSS: how the page looks. Colours, fonts, spacing.<\/p><\/li>\n<li><p>JavaScript: what the page does. Calculations, filters,\nclicks.<\/p><\/li>\n<\/ul>\n<p>Knowing this helps you give clear instructions. If the colours are\nwrong, that is CSS. If the totals do not update, that is JavaScript.<\/p>\n<p><img src=\"imgs/v01_0.jpg\" alt=\"\"><\/p>\n\n<p><strong>Why this matters if AI writes the code<\/strong><\/p>\n<p>Understanding HTML helps you in three ways.<\/p>\n<ul>\n<li><p>You can check the output. Text, labels and numbers are written in\nplain language inside the file. You can find and verify them.<\/p><\/li>\n<li><p>You can ask for better changes. Clear feedback means fewer rounds\nwith AI.<\/p><\/li>\n<li><p>You can make small edits yourself. Changing a title, colour or\nnumber does not need AI.<\/p><\/li>\n<\/ul>\n<p><strong>When to use HTML<\/strong><\/p>\n<ul>\n<li><p>Use Excel for data entry and analysis.<\/p><\/li>\n<li><p>Use PowerPoint for presentations.<\/p><\/li>\n<li><p>Use HTML when people need to use something more than once, click\non it or open it on any device.<\/p><\/li>\n<\/ul>\n<p>Simple rule: if people will read it once, use a document or slides.\nIf they will use it again and again, use HTML.<\/p>\n<p><strong>Risks to know<\/strong><\/p>\n<ul>\n<li><p>Anyone who opens the file can see everything inside it. Do not\nput salaries, customer data or pricing in a shared file.<\/p><\/li>\n<li><p>There is no login or access control.<\/p><\/li>\n<li><p>Many copies can spread by email. Keep one file in one shared\nlocation with one owner.<\/p><\/li>\n<li><p>A file that looks right can still be wrong. Test calculations\nagainst known numbers before using them.<\/p><\/li>\n<\/ul>\n<p><strong>How to get started<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Ask AI to explain the file section by section in simple\nwords.<\/p><\/li>\n<li><p>Open the file in a text editor like Notepad. Find text and\nnumbers you recognise.<\/p><\/li>\n<li><p>Make one small change yourself. Save it and reopen it in the\nbrowser.<\/p><\/li>\n<li><p>When asking for changes, say whether the problem is content, look\nor function.<\/p><\/li>\n<\/ol>\n<p><strong>Summary<\/strong><\/p>\n<p>AI can write HTML for you. Your job is to know what it is, check that\nit works, keep data safe and ask for clear changes. That is enough to\nturn AI output into tools your team can use. <img\nsrc=\"m/media/image31.png\"\nalt=\"HMC One, AI-generated content may be incorrect.\" /><img\nsrc=\"m/media/image32.png\"\nalt=\"The image illustrates a diagram explaining the benefits of using HTML for web development, emphasizing its reusability, scalability, and simplicity in comparison to other tools like Excel or PowerPoint. AI-generated content may be incorrect.\" /><img\nsrc=\"m/media/image33.png\"\nalt=\"A visual diagram outlines important considerations and steps for working with HTML, including risks like unauthorized access and potential errors, and guidance on testing and sharing files securely. AI-generated content may be incorrect.\" /><\/p>", "excerpt": "Why HTML Matters for Non-Coders When you ask AI to build a dashboard, calculator or tool, it usually gives you an HTML file. If you use vibe coding, you will wo"}, {"part": 0, "title": "Safety of HTML", "kind": "Article", "imgs": ["imgs/v02_0.jpg"], "thumb": "imgs/v02_0_t.jpg", "inline": false, "html": "<p><strong>The business case<\/strong><\/p>\n<p>When you're building dashboards, reports, calculators, or internal\nutilities through AI-assisted (\"vibe\") coding, HTML is often the most\npractical output format — not because it's technically superior in every\ndimension, but because of what it means for deployment and adoption\ninside a business.<\/p>\n<p><strong>1. Zero-friction distribution.<\/strong> An HTML file opens in\nany browser — no installation, no license, no IT approval cycle. You can\nemail it, put it on a shared drive, or drop it into a Teams channel, and\nthe person on the other end just double-clicks and it works. Compare\nthis to a Python script (needs an interpreter and dependencies) or a\ncompiled app (needs OS compatibility, permissions, sometimes admin\nrights). For a consulting practice or an internal team rolling out a\ntool to dozens of non-technical stakeholders, this removes almost all\ndeployment friction.<\/p>\n<p><strong>2. Self-contained and portable.<\/strong> A single HTML file\ncan carry its own CSS, JavaScript, and even embedded data or charting\nlibraries. There's nothing to \"install\" and nothing that breaks because\na server went down or a subscription lapsed. This makes it ideal for\ncalculators, one-off dashboards, or utilities that need to outlive a\nsingle project engagement — the client can keep using it long after your\ncontract ends.<\/p>\n<p><strong>3. Fast iteration cycles.<\/strong> Because HTML/JS is quick\nto generate, test, and modify with AI assistance, you can go from\n\"here's what I want\" to a working prototype in the same meeting. This is\na major advantage when you're co-designing a tool live with a business\nstakeholder — changes to layout, logic, or branding can be shown\nimmediately.<\/p>\n<p><strong>4. No recurring cost or vendor lock-in.<\/strong> Unlike SaaS\ndashboard tools, an HTML deliverable has no subscription, no seat\nlicensing, and no dependency on a third-party platform staying in\nbusiness. For clients who want a tool they fully own, this matters\ncommercially.<\/p>\n<p><strong>5. Branding and professionalism.<\/strong> HTML gives full\ncontrol over look and feel — logos, color palettes, typography — so\ndeliverables can be styled to match a client's or firm's brand identity,\nwhich matters when the output is client-facing.<\/p>\n<p><strong>On data safety: does uploading an Excel file into an HTML\ntool \"go online\"?<\/strong><\/p>\n<p>This depends entirely on <em>how<\/em> the HTML tool is built, and\nit's worth being precise here rather than making a blanket claim:<\/p>\n<ul>\n<li><p><strong>If the HTML file processes the upload entirely in the\nbrowser<\/strong> (i.e., the JavaScript reads the Excel file locally\nusing something like the SheetJS/xlsx library and does all calculations\nclient-side), then the data never leaves the user's machine. Nothing is\ntransmitted to a server, and there is no network call involved in\nreading or processing the file. In this case, it's accurate to say the\ndata stays local and private.<\/p><\/li>\n<\/ul>\n<p><strong>If the HTML tool includes any server call<\/strong> — for\nexample, it sends data to an API, calls a backend for AI processing, or\nlogs data to an external service — then the file's contents (or parts of\nthem) <em>are<\/em> going online, and this needs to be disclosed clearly\nto users.<br />\n<\/p>", "excerpt": "The business case When you're building dashboards, reports, calculators, or internal utilities through AI-assisted (\"vibe\") coding, HTML is often the most pract"}, {"part": 0, "title": "Understanding JSON", "kind": "Article", "imgs": [], "thumb": null, "inline": false, "html": "<p><strong>Why You Need to Understand JSON When Vibe Coding\nHTML<\/strong><\/p>\n<p>Vibe coding makes it possible to build surprisingly powerful HTML\ndashboards, tools, and mini-apps without writing every line of code\nyourself. You can describe what you want to ChatGPT, Claude, Copilot, or\nanother AI coding assistant, and get a working interface within\nminutes.<\/p>\n<p>But once your HTML page starts working with real data, one concept\nbecomes extremely important: <strong>JSON<\/strong>.<\/p>\n<p><strong>JSON — JavaScript Object Notation — is essentially a\nstructured way of storing and exchanging data.<\/strong><\/p>\n<p>Think of HTML as the <strong>interface<\/strong>, JavaScript as the\n<strong>logic<\/strong>, and JSON as the <strong>data structure\nconnecting everything together<\/strong>.<\/p>\n<p>For example, instead of hardcoding employee information inside an\nHTML page, you might store it like this:<\/p>\n<p>[<\/p>\n<p>{<\/p>\n<blockquote>\n<p>\"name\": \"Rahul\",<\/p>\n<p>\"department\": \"Sales\",<\/p>\n<p>\"sales\": 1250000<\/p>\n<\/blockquote>\n<p>},<\/p>\n<p>{<\/p>\n<blockquote>\n<p>\"name\": \"Priya\",<\/p>\n<p>\"department\": \"Finance\",<\/p>\n<p>\"sales\": 850000<\/p>\n<\/blockquote>\n<p>}<\/p>\n<p>]<\/p>\n<p>Your HTML dashboard can then read this JSON and automatically create\ntables, charts, filters, KPI cards, or summaries.<\/p>\n<p><strong>Why JSON matters in vibe coding<\/strong><\/p>\n<p>The biggest reason is that <strong>most modern applications exchange\ndata in JSON format<\/strong>.<\/p>\n<p>When your vibe-coded HTML application connects to an API, AI model,\ndatabase, workflow tool, or another application, the information will\nvery often arrive as JSON.<\/p>\n<p>For example:<\/p>\n<p><strong>Excel / CSV → JSON → HTML Dashboard<\/strong><\/p>\n<p><strong>API → JSON → JavaScript → HTML<\/strong><\/p>\n<p><strong>ChatGPT / Claude API → JSON → Your Application<\/strong><\/p>\n<p><strong>n8n / Power Automate → JSON → HTML Interface<\/strong><\/p>\n<p>Even if AI writes the code for you, understanding the JSON structure\nallows you to understand <strong>what the application is actually doing\nwith your data<\/strong>.<\/p>\n<p>You do not need to become a JavaScript developer. But you should be\ncomfortable recognizing concepts such as:<\/p>\n<ul>\n<li><p>Objects: { }<\/p><\/li>\n<li><p>Arrays: [ ]<\/p><\/li>\n<li><p>Key-value pairs: \"department\": \"Finance\"<\/p><\/li>\n<li><p>Nested data<\/p><\/li>\n<li><p>Numbers, text, dates and Boolean values<\/p><\/li>\n<\/ul>\n<p>This becomes especially useful when something goes wrong.<\/p>\n<p>Imagine asking an AI assistant:<\/p>\n<p>\"Show sales by department.\"<\/p>\n<p>The code might fail because your JSON uses \"Dept\" while the\nJavaScript is looking for \"Department\".<\/p>\n<p>Without understanding JSON, this feels like a coding problem.<\/p>\n<p>With basic JSON knowledge, you can immediately see that it is simply\na <strong>data structure mismatch<\/strong>.<\/p>\n<p>JSON also makes vibe-coded applications far more scalable.<\/p>\n<p>Instead of writing:<\/p>\n<p>Rahul - Sales - 12.5L<\/p>\n<p>Priya - Finance - 8.5L<\/p>\n<p>you store the data separately and let the application dynamically\ngenerate the interface.<\/p>\n<p>Tomorrow, whether there are <strong>10 records or 10,000\nrecords<\/strong>, the same HTML code can continue working.<\/p>\n<p>This is the shift from building a static webpage to building a\n<strong>data-driven application<\/strong>.<\/p>\n<p><strong>The important mindset<\/strong><\/p>\n<p>Vibe coding does not mean that you need to understand every line of\ncode generated by AI.<\/p>\n<p>But you should understand the <strong>building blocks<\/strong>.<\/p>\n<p>For most business users building HTML tools, dashboards, calculators,\nor internal applications, three concepts provide enormous leverage:<\/p>\n<p><strong>HTML tells the browser what to display.<\/strong><\/p>\n<p><strong>JavaScript tells the application what to do.<\/strong><\/p>\n<p><strong>JSON tells the application what data it is working\nwith.<\/strong><\/p>\n<p>AI can write all three for you.<\/p>\n<p>But once you understand JSON, you can give AI much better\ninstructions, troubleshoot problems faster, connect more data sources,\nand build significantly more powerful applications.<\/p>\n<p>That is why, for anyone learning vibe coding, <strong>JSON is one of\nthe highest-value technical concepts to understand.<\/strong><\/p>", "excerpt": "Why You Need to Understand JSON When Vibe Coding HTML Vibe coding makes it possible to build surprisingly powerful HTML dashboards, tools, and mini-apps without"}, {"part": 0, "title": "Excel Upload Limit", "kind": "Article", "imgs": [], "thumb": null, "inline": false, "html": "<p>If you have built a dashboard as a local HTML file, there is no\nstandard Excel upload limit. A 200 MB workbook might load in one\ndashboard and fail in another. The answer depends on how the dashboard\nwas coded, what the workbook contains, and how much memory the browser\ncan use.<\/p>\n<p>When you select a file in a local dashboard, the browser reads it\nfrom your computer. The page may have its own rule that rejects files\nabove a certain size. If it does not, the next challenge is processing\nthe workbook. Excel files can expand substantially in memory when the\ndashboard reads sheets, converts cells into data, and builds tables and\ncharts. SheetJS notes that its standard reading functions load entire\nfiles into memory, where browser memory limits can become a constraint.\n(<a target=\"_blank\" rel=\"noopener\" href=\"https://docs.sheetjs.com/docs/demos/bigdata/stream/\">SheetJS\nLarge Datasets<\/a>)<\/p>\n<p>This is different from <strong>Excel’s worksheet limit<\/strong> of\n1,048,576 rows and 16,384 columns. That limit describes how much a\nworksheet can hold; it does not set the maximum file size a local HTML\ndashboard can accept. (<a target=\"_blank\" rel=\"noopener\" href=\"https://support.microsoft.com/en-us/excel/excel-specifications-and-limits\">Microsoft\nExcel specifications<\/a>)<\/p>\n<p>If a 200 MB upload fails, first check whether the HTML code contains\na file-size rule. If the page accepts the file but freezes or crashes,\nthe likely issue is the work required to process and display it. Loading\nfewer sheets and columns, calculating summaries before drawing charts,\nand showing only a small preview of the rows can help. For consistently\nlarge files, preparing smaller or summarized data before opening the\ndashboard is often more reliable.<\/p>\n<p><strong>The practical answer:<\/strong> there is no universal “Excel\nupload limit” for a local HTML dashboard. Its working limit has to be\ntested with your actual file, browser, computer, and dashboard code.\nConverting the workbook to JSON alone does not guarantee that a large\nfile will load.<\/p>", "excerpt": "If you have built a dashboard as a local HTML file, there is no standard Excel upload limit. A 200 MB workbook might load in one dashboard and fail in another. "}, {"part": 0, "title": "Working with Unclean Excel Files", "kind": "Article", "imgs": ["imgs/v05_0.jpg"], "thumb": "imgs/v05_0_t.jpg", "inline": false, "html": "<p>Once you can generate a working HTML dashboard from a prompt, the\nbottleneck stops being the code. It becomes the file someone drags into\nit.<\/p>\n<p>Almost every failure we see in these builds traces back to a\nspreadsheet that was designed to be read by a human and is now being\nread by a parser. Humans skip the title row, ignore the blank line,\nunderstand that the bold row at the bottom is a total. Code does none of\nthis.<\/p>\n<p>Twenty things to get right, on both sides — the file and the parsing\nlogic.<\/p>\n<p><strong>Layout<\/strong><\/p>\n<p><strong>1. Data starts at A1.<\/strong> No company name in row 1, no\nlogo, no \"Report as of March 2025\", no blank spacer row. The parser\ntakes the first row it finds as the header. Give it the header.<\/p>\n<p><strong>2. No merged cells anywhere.<\/strong> A merged cell resolves\nto one value and a series of empty cells. Merged headers are the worst\nversion of this, because the columns underneath end up unnamed and\neverything downstream is silently misaligned.<\/p>\n<p><strong>3. One table per sheet.<\/strong> Two tables side by side, or\nstacked with a gap, will be read as one rectangle with a lot of holes.\nIf a sheet has a summary block above the detail, split them.<\/p>\n<p><strong>4. Name the sheet you want.<\/strong> Parsers default to the\nfirst sheet, which in most corporate workbooks is a cover page or an\ninstructions tab. Read sheets by name in the code, and fail loudly with\na list of available sheets when the name is missing.<\/p>\n<p><strong>5. Hidden and filtered rows still come through.<\/strong>\nFilters and hidden columns are a display state, not a data state. If\nsomeone filtered to Q4 before sending the file, the code still sees all\nfour quarters. Delete, don't hide.<\/p>\n<p><strong>Headers<\/strong><\/p>\n<p><strong>6. No two columns with the same heading.<\/strong> Most\nparsers map rows to objects keyed by header. Two columns called \"Amount\"\nmeans one of them silently overwrites the other, and the dashboard will\nlook completely plausible while being wrong.<\/p>\n<p><strong>7. No blank headings.<\/strong> An unnamed column becomes\n__EMPTY, __EMPTY_1, and so on. Either name it or drop it before\nupload.<\/p>\n<p><strong>8. One header row, not two.<\/strong> Stacked headers — a\nmerged category row above a detail row — are a human convention. Flatten\nthem into single names like Q1_Revenue, Q1_Units before the file goes\nanywhere near the parser.<\/p>\n<p><strong>9. Trim and normalise in the code.<\/strong> \"Region \" and\n\"Region\" are different keys, and the trailing space is invisible to\nwhoever created the file. Strip whitespace, standardise case, and build\na mapping layer rather than trusting the header string exactly as\ntyped.<\/p>\n<p><strong>Data types<\/strong><\/p>\n<p><strong>10. Numbers stored as text.<\/strong> The most common single\ncause of a chart that renders with everything at zero, or a total that\nconcatenates instead of adding. Coerce explicitly and check what fails\nrather than assuming the type.<\/p>\n<p><strong>11. Currency symbols and separators live inside the\ncell.<\/strong> ₹1,20,000 is a string. So is $4.5M. Format currency in\nthe display layer, keep the underlying cell as a raw number.<\/p>\n<p><strong>12. Percentages are ambiguous.<\/strong> A cell showing 45%\nmay hold 0.45 or 45 depending on how it was formatted. Decide the\nconvention, state it, and validate against a known total.<\/p>\n<p><strong>13. Dates are the biggest trap.<\/strong> Excel stores them as\nserial numbers, so 45231 is a date that will parse as a number.\nConverting through a JavaScript date without controlling for timezone\nroutinely shifts everything by one day. And 03/04/2025 is March or April\ndepending on who made the file. Force an unambiguous format like\nYYYY-MM-DD at source.<\/p>\n<p><strong>14. Leading zeros disappear.<\/strong> Employee IDs, PIN\ncodes, cost centre codes, account numbers. 007 becomes 7, and your join\nagainst another table quietly returns nothing. These are identifiers,\nnot numbers — keep them as text.<\/p>\n<p><strong>Rows and content<\/strong><\/p>\n<p><strong>15. No total or subtotal rows inside the data.<\/strong> A\ngrand total row will be charted as a data point roughly twice the size\nof everything else. Totals are something the dashboard calculates, not\nsomething it inherits.<\/p>\n<p><strong>16. No blank rows in the middle, no footnotes at the\nbottom.<\/strong> * Figures exclude the Nagpur plant is not a data row,\nbut it will become one. Strip trailing rows that don't match the column\nstructure.<\/p>\n<p><strong>17. Blank is not zero.<\/strong> An empty cell and a 0 mean\ndifferent things — one is \"no sales\", the other is \"we don't know\".\nAverages change materially depending on how you treat them. Decide\ndeliberately, and say which you chose on the dashboard itself.<\/p>\n<p><strong>18. Category values must be consistent.<\/strong> North,\nnorth, North and NORTH will produce four bars in a chart that should\nhave one. Normalise on read, and surface the distinct values so someone\ncan spot the duplicates.<\/p>\n<p><strong>19. Never use a pivot table or a formula-heavy sheet as the\nsource.<\/strong> Pivots are output, not data. Formula errors — #REF!,\n#N/A, #DIV/0! — flow straight through as strings and break every numeric\noperation after them. Paste as values into a clean sheet.<\/p>\n<p><strong>Practical<\/strong><\/p>\n<p><strong>20. Reference columns by name, never by position.<\/strong>\nrow[3] works until someone inserts a column, at which point the\ndashboard is wrong rather than broken — which is far more dangerous. Map\nby header name and throw an explicit error when an expected column is\nmissing.<\/p>\n<p>Two more worth building in as habit rather than rules. Browser-side\nparsing struggles well before you reach enterprise data volumes, so set\na row limit and tell the user what it is instead of letting the tab\nfreeze. And be deliberate about what goes into the file at all — a\nbrowser tool is exactly the wrong place to discover that a sheet has\nsalary data or customer names in columns nobody was looking at.<\/p>\n<p><strong>The habit that prevents most of this<\/strong><\/p>\n<p>One sheet. One table. Starting at A1. One row of unique headers. No\nmerges, no totals, no footnotes, no formatting doing the work of\ndata.<\/p>\n<p>Almost every rule above is a specific instance of that. Most teams\nget there faster by building a clean extract sheet next to the working\nfile than by trying to reform the working file itself — the operational\nspreadsheet has a human audience and should keep it.<\/p>\n<p>The parser gets its own copy. <img\nsrc=\"m/media/image36.png\"\nalt=\"An instructional guide on how to handle and organize data in Excel, emphasizing the importance of maintaining a clean, consistent structure, and avoiding common errors such as unclean data, incorrect totals, and improper formatting. AI-generated content may be incorrect.\" /><\/p>", "excerpt": "Once you can generate a working HTML dashboard from a prompt, the bottleneck stops being the code. It becomes the file someone drags into it. Almost every failu"}, {"part": 0, "title": "View HTML", "kind": "Article", "imgs": ["imgs/v06_0.jpg"], "thumb": "imgs/v06_0_t.jpg", "inline": false, "html": "<p><a target=\"_blank\" rel=\"noopener\" href=\"https://html.onlineviewer.net/\">https://html.onlineviewer.net/<\/a><\/p>", "excerpt": "https://html.onlineviewer.net/"}, {"part": 0, "title": "Vibe Coding Tips", "kind": "Article", "imgs": ["imgs/v07_0.jpg", "imgs/v07_1.jpg", "imgs/v07_2.jpg", "imgs/v07_3.jpg", "imgs/v07_4.jpg"], "thumb": "imgs/v07_0_t.jpg", "inline": false, "html": "<p><strong>Smart Tips for Editing HTML Applications Built with Vibe\nCoding<\/strong><\/p>\n<p><strong>How to make precise changes, fix errors, and improve\nAI-generated HTML applications without breaking what already\nworks.<\/strong><\/p>\n<p>One of the biggest advantages of vibe coding is that you can build\nsophisticated HTML applications, dashboards, simulators, and interactive\ntools without writing every line of code yourself.<\/p>\n<p>But building the first version is often easier than modifying it.<\/p>\n<p>You ask AI to change a button, and suddenly the entire layout\nchanges. You fix one chart, and another stops working. You request a\nminor adjustment, and AI rewrites hundreds of lines of perfectly\nfunctioning code.<\/p>\n<p>The solution is not necessarily better coding knowledge. It is\n<strong>learning how to communicate changes more\nintelligently.<\/strong><\/p>\n<p>Here are 12 practical techniques that can dramatically improve your\nworkflow.<\/p>\n<p><strong>1. Share a Screenshot of the Exact Area That Needs\nFixing<\/strong><\/p>\n<p><strong>A screenshot is often more effective than a paragraph of\nexplanation.<\/strong><\/p>\n<p>Instead of saying:<\/p>\n<p>\"There's something wrong with the dashboard. Please fix the\nlayout.\"<\/p>\n<p>Take a screenshot, crop it to the problematic section, and highlight\nthe issue with an arrow or rectangle.<\/p>\n<p><strong>Better prompt:<\/strong><\/p>\n<p>\"Look at the attached screenshot. The labels on the second chart\noverlap with the legend. Fix only this visual issue. Do not change the\nchart data, colours, or any other dashboard components.\"<\/p>\n<p><strong>Pro tip:<\/strong> Share two screenshots when necessary: one\nshowing the complete page for context and another zoomed into the\nproblematic section.<\/p>\n<p><strong>2. Tell AI What Must NOT Change<\/strong><\/p>\n<p>One of the most common problems with AI-assisted editing is\nunintended modifications.<\/p>\n<p>A simple instruction can prevent considerable rework.<\/p>\n<p><strong>Example:<\/strong><\/p>\n<p>\"Modify only the navigation menu. Preserve all existing JavaScript\nfunctionality, CSS styling, animations, charts, and other working\ncomponents. Do not redesign the application.\"<\/p>\n<p>This is particularly important for complex HTML applications\ncontaining interconnected components.<\/p>\n<p><strong>Think of every change as a surgical operation, not a complete\nreconstruction.<\/strong><\/p>\n<p><strong>3. Describe the Expected Behaviour, Not Just the\nProblem<\/strong><\/p>\n<p>Saying \"The filter isn't working\" doesn't give AI enough\ninformation.<\/p>\n<p>Instead, explain three things:<\/p>\n<ul>\n<li><p>What you are doing.<\/p><\/li>\n<li><p>What is currently happening.<\/p><\/li>\n<li><p>What should happen.<\/p><\/li>\n<\/ul>\n<p><strong>Better prompt:<\/strong><\/p>\n<p>\"When I select 'North Region' from the dropdown, the revenue chart\ncontinues showing data for all regions. It should display only North\nRegion sales. The other charts should continue responding to their\nexisting filters.\"<\/p>\n<p>This helps AI identify the actual functional problem rather than\nguessing.<\/p>\n<p><strong>4. Ask for a Diagnosis Before Requesting the Fix<\/strong><\/p>\n<p>AI sometimes jumps into changing code before understanding why\nsomething is broken.<\/p>\n<p>A smarter approach is to separate diagnosis from implementation.<\/p>\n<p><strong>Example:<\/strong><\/p>\n<p>\"Before modifying the HTML, identify the three most likely reasons\nwhy the table is not refreshing after importing a new Excel file.\nExplain which part of the JavaScript you would investigate. Do not make\nchanges yet.\"<\/p>\n<p>Once the issue is identified, ask AI to implement the smallest\npossible fix.<\/p>\n<p>This technique is especially valuable when working with large\napplications.<\/p>\n<p><strong>5. Share Browser Console Errors<\/strong><\/p>\n<p>Screenshots are excellent for visual problems, but they cannot reveal\nevery programming error.<\/p>\n<p>When an HTML application fails, press <strong>F12<\/strong> in Chrome\nor Edge, open Developer Tools, and navigate to the Console tab.<\/p>\n<p>Copy the relevant error message or share a screenshot of it.<\/p>\n<p><strong>Example:<\/strong><\/p>\n<p>\"The Calculate button does nothing. The browser Console displays\n'Uncaught TypeError: Cannot read properties of undefined'. Identify the\nsource of the error and fix it without modifying the existing\ncalculation methodology.\"<\/p>\n<p>You can also check the Network tab when external files or APIs fail\nto load.<\/p>\n<p><strong>A console error often gives AI more actionable information\nthan saying 'the page is broken'.<\/strong><\/p>\n<p><strong>6. Make One Logical Change at a Time<\/strong><\/p>\n<p>Suppose you want to:<\/p>\n<ul>\n<li><p>Change dashboard colours.<\/p><\/li>\n<li><p>Add an Excel upload.<\/p><\/li>\n<li><p>Introduce a new calculation.<\/p><\/li>\n<li><p>Make the application mobile-friendly.<\/p><\/li>\n<\/ul>\n<p>Avoid combining all four requests into one large instruction.<\/p>\n<p>Instead, implement and test them separately.<\/p>\n<p>This makes it easier to isolate errors, understand what changed, and\nreverse problematic modifications.<\/p>\n<p><strong>Pro tip:<\/strong> Group closely related changes together, but\nseparate major functional, visual, and structural modifications.<\/p>\n<p><strong>7. Use Before-and-After Screenshots for Design\nChanges<\/strong><\/p>\n<p>Want your AI-generated dashboard to look like a professional\nenterprise application?<\/p>\n<p>Show AI the current screenshot and a reference image of the desired\nappearance.<\/p>\n<p><strong>Example:<\/strong><\/p>\n<p>\"Image 1 shows my existing HTML dashboard. Image 2 shows the visual\nstyle I want. Apply the typography, spacing, card styling, and colour\nhierarchy from Image 2 while preserving all calculations, filters, and\ninteractive behaviour from Image 1.\"<\/p>\n<p>This is much more precise than asking AI to \"make it modern\" or \"make\nit McKinsey-style.\"<\/p>\n<p><strong>8. Ask AI to Identify the Relevant Code Section\nFirst<\/strong><\/p>\n<p>In applications with thousands of lines of HTML, CSS, and JavaScript,\nit may be unnecessary to modify the entire file.<\/p>\n<p><strong>Example:<\/strong><\/p>\n<p>\"Identify the HTML element, CSS classes, and JavaScript functions\nresponsible for the inventory reduction chart. Explain their\ndependencies before making any changes.\"<\/p>\n<p>This technique helps distinguish three different types of\nmodifications:<\/p>\n<ul>\n<li><p>HTML changes affect structure and content.<\/p><\/li>\n<li><p>CSS changes affect appearance and layout.<\/p><\/li>\n<li><p>JavaScript changes affect behaviour and calculations.<\/p><\/li>\n<\/ul>\n<p>Understanding which layer needs modification can prevent unnecessary\nrewrites.<\/p>\n<p><strong>9. Preserve the Application's Data and Calculation\nLogic<\/strong><\/p>\n<p>This is particularly important for financial models, ROI simulators,\noperational dashboards, and business applications.<\/p>\n<p>Suppose your HTML simulator calculates inventory savings using\nworking capital and an 11% WACC.<\/p>\n<p>You want to improve the visual presentation, but not modify the\nunderlying financial assumptions.<\/p>\n<p><strong>Better prompt:<\/strong><\/p>\n<p>\"Improve the visual layout of the benefits table and add tooltips\nexplaining each metric. Do not change any formulas, financial\nassumptions, data dependencies, or calculation outputs. Verify that the\nsame inputs produce the same results before and after the change.\"<\/p>\n<p>A visually attractive application with incorrect calculations is\nworse than a basic application that works.<\/p>\n<p><strong>10. Save a Working Version Before Every Major\nModification<\/strong><\/p>\n<p>AI-generated code can occasionally introduce regressions: fixing one\nelement while breaking another.<\/p>\n<p>Before making significant changes, save a working version.<\/p>\n<p>For example:<\/p>\n<ul>\n<li><p>dashboard_v1_working.html<\/p><\/li>\n<li><p>dashboard_v2_new_filters.html<\/p><\/li>\n<li><p>dashboard_v3_mobile_layout.html<\/p><\/li>\n<\/ul>\n<p>For more advanced projects, Git provides a more reliable way to track\nchanges and restore earlier versions.<\/p>\n<p><strong>Pro tip:<\/strong> Whenever you reach a stable, fully\nfunctional version, treat it as a checkpoint.<\/p>\n<p><strong>11. Ask AI to Test Edge Cases, Not Just the Happy\nPath<\/strong><\/p>\n<p>An HTML application may work perfectly with sample data but fail when\nreal users interact with it.<\/p>\n<p>After making changes, ask AI to check scenarios such as:<\/p>\n<ul>\n<li><p>What happens when an Excel file contains blank cells?<\/p><\/li>\n<li><p>What if a user uploads an incorrect file format?<\/p><\/li>\n<li><p>What happens when a calculation involves division by\nzero?<\/p><\/li>\n<li><p>Does the dashboard remain usable on a smaller screen?<\/p><\/li>\n<li><p>Can dropdowns and buttons be operated using a keyboard?<\/p><\/li>\n<li><p>Do charts behave correctly when filters return no data?<\/p><\/li>\n<\/ul>\n<p><strong>Example:<\/strong><\/p>\n<p>\"Review the updated application for edge cases involving missing\ndata, invalid inputs, repeated button clicks, and empty datasets. Add\nappropriate validation without changing existing business logic.\"<\/p>\n<p>Remember that AI's code review is not a substitute for actually\ntesting the application in a browser.<\/p>\n<p><strong>12. Ask for a Change Summary and Regression\nChecklist<\/strong><\/p>\n<p>After every significant modification, request a concise summary.<\/p>\n<p><strong>Example:<\/strong><\/p>\n<p>\"Summarise exactly which HTML elements, CSS rules, and JavaScript\nfunctions were modified. List any existing functionality that could be\naffected. Provide five browser tests I should perform to confirm that\nnothing else has broken.\"<\/p>\n<p>This encourages controlled modifications and makes troubleshooting\neasier if problems appear later.<\/p>\n<p><strong>The Ultimate Prompt for Editing AI-Generated\nHTML<\/strong><\/p>\n<p>Here is a reusable prompt you can adapt for nearly any vibe-coded\napplication.<\/p>\n<p><strong>Copy-Paste Prompt<\/strong><\/p>\n<p>\"I have an existing HTML application that is functioning correctly\nexcept for the specific issue or enhancement described below.<\/p>\n<p><strong>Requested change:<\/strong> [Describe the change]<\/p>\n<p><strong>Current behaviour:<\/strong> [Describe what happens]<\/p>\n<p><strong>Expected behaviour:<\/strong> [Describe what should\nhappen]<\/p>\n<p><strong>Visual reference:<\/strong> [Attach screenshot if\napplicable]<\/p>\n<p>Please follow these instructions:<\/p>\n<ol type=\"1\">\n<li><p>Inspect the relevant HTML, CSS, and JavaScript before making\nchanges.<\/p><\/li>\n<li><p>Identify the specific elements or functions responsible.<\/p><\/li>\n<li><p>Make the smallest necessary modification.<\/p><\/li>\n<li><p>Preserve all existing working functionality, business logic,\nformulas, data structures, animations, and styling unless explicitly\ninstructed otherwise.<\/p><\/li>\n<li><p>Avoid rewriting unrelated parts of the application.<\/p><\/li>\n<li><p>Check potential dependencies and edge cases.<\/p><\/li>\n<li><p>Summarise what changed and provide a brief regression-testing\nchecklist.<\/p><\/li>\n<\/ol>\n<p>If information is insufficient to diagnose the issue reliably,\nexplain what additional screenshot, console error, or code section is\nneeded rather than guessing.\"<\/p>\n<p><strong>Final Thought: Vibe Coding Is Easy. Controlled Iteration Is\nthe Real Skill.<\/strong><\/p>\n<p>The first version of an HTML application is only the beginning.<\/p>\n<p>The real challenge is making the tenth, twentieth, or fiftieth\nmodification without compromising functionality.<\/p>\n<p>The most effective vibe coders do not simply keep asking AI to \"fix\nthis\" or \"make it better.\"<\/p>\n<p>They provide precise visual references, describe expected behaviour,\nprotect working components, manage versions, and validate each\nmodification.<\/p>\n<p><strong>The quality of an AI-built application depends not just on\nhow well you prompt it to build, but on how intelligently you prompt it\nto change.<\/strong><\/p>\n<p>That is what separates a quick AI-generated prototype from a\nreliable, reusable business application.<\/p>", "excerpt": "Smart Tips for Editing HTML Applications Built with Vibe Coding How to make precise changes, fix errors, and improve AI-generated HTML applications without brea"}, {"part": 0, "title": "Reverse Engineer Prompt from HTML", "kind": "Article", "imgs": ["imgs/v08_0.jpg", "imgs/v08_1.jpg"], "thumb": "imgs/v08_0_t.jpg", "inline": true, "html": "<p><strong>You don't need to read code to own it<\/strong><\/p>\n<p>Every HTML file is a complete, self-describing app. The layout, the\nstyling, the logic and the libraries it borrows all sit in one text\nfile. That makes it the perfect thing to hand to an AI and ask: what is\nthis, how does it work, and how do I make it mine?<\/p>\n<p>This is the reverse direction of vibe coding. Instead of prompting\nfrom a blank page, you start from something that already works — a\ndashboard a colleague built, a calculator from a tutorial, a page you\ngenerated last month and forgot — and let the AI walk you through it\nbefore you change a single line.<\/p>\n<p><strong>Why use it<\/strong><\/p>\n<p>Most people stall on vibe coding not at creation but at the second\nstep: changing something they didn't write. Uploading the file first\ngives you a map before you edit.<\/p>\n<ul>\n<li><p><strong>Reuse instead of rebuild.<\/strong> A working page is 80%\nof the job. Adapting it is faster and safer than prompting from\nscratch.<\/p><\/li>\n<li><p><strong>Know what you're running.<\/strong> The AI flags every\nexternal script, font and data call, so you know what loads from the\ninternet and what stays on your machine.<\/p><\/li>\n<li><p><strong>Edit with precision.<\/strong> Once you know the page has\na \"categories array\" or a \"chart config\", your change prompts stop being\nvague (\"make it better\") and become surgical (\"add a Travel category in\npurple\").<\/p><\/li>\n<li><p><strong>Learn by dissection.<\/strong> For non-developers, a\nplain-English walkthrough of a real file teaches more than a\ntutorial.<\/p><\/li>\n<li><p><strong>Hand-offs get easier.<\/strong> Inherited a tool from a\nteam member who left? Ten minutes with the AI replaces a\nknowledge-transfer meeting.<\/p><\/li>\n<\/ul>\n<p><strong>How it works<\/strong><\/p>\n<p>An HTML file has three layers, and the AI reads all three at\nonce.<\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Layer<\/strong><\/th>\n<th><strong>Where it lives<\/strong><\/th>\n<th><strong>What the AI extracts<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Structure (HTML)<\/td>\n<td>&lt;body&gt; tags: headings, forms, buttons, tables<\/td>\n<td>What the user sees and can click<\/td>\n<\/tr><tr>\n<td>Style (CSS)<\/td>\n<td>&lt;style&gt; block or linked stylesheets<\/td>\n<td>Colours, fonts, layout, mobile behaviour<\/td>\n<\/tr><tr>\n<td>Logic (JavaScript)<\/td>\n<td>&lt;script&gt; blocks<\/td>\n<td>What happens on click, how numbers are calculated, where data is\nstored<\/td>\n<\/tr><tr>\n<td>Dependencies<\/td>\n<td>&lt;script src&gt; and &lt;link href&gt; pointing to URLs<\/td>\n<td>Libraries (Chart.js, Tailwind), fonts, APIs the page calls<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p>The workflow is three steps:<\/p>\n<ol type=\"1\">\n<li><p><strong>Upload<\/strong> the .html file to Claude (drag it into\nthe chat, or paste the code).<\/p><\/li>\n<li><p><strong>Extract<\/strong> using the default prompt below. You get\na structured brief of the page.<\/p><\/li>\n<li><p><strong>Modify<\/strong> with targeted follow-up prompts that\nreference what the brief told you.<\/p><\/li>\n<\/ol>\n<p><strong>The default extraction prompt<\/strong><\/p>\n<p>Copy this, attach your HTML file, and send. It works for any page,\nfrom a 30-line calculator to a 2,000-line dashboard.<\/p>\n<p><strong>Prompt:<\/strong><\/p>\n<p>I've attached an HTML file. Act as a senior front-end developer\nexplaining it to a non-technical business user. Do not change any code\nyet.<\/p>\n<p>Give me:<\/p>\n<p>1. WHAT IT DOES — In 2–3 sentences, what is this page for and who\nwould use it?<\/p>\n<p>2. WHAT THE USER SEES — List each visible section, input, button and\noutput, top to bottom.<\/p>\n<p>3. HOW IT WORKS — Walk through what happens when the user interacts\nwith it (clicks, types, submits). Name the JavaScript functions involved\nin plain English.<\/p>\n<p>4. WHAT IT USES — List every external dependency: libraries, CDNs,\nfonts, APIs, and any browser storage (localStorage, cookies). For each,\nsay what it's used for and whether the page breaks offline.<\/p>\n<p>5. DATA — Where does the data come from (hard-coded, user input,\nfile, API) and where does it go? Is anything saved?<\/p>\n<p>6. CUSTOMISATION POINTS — The 5–8 easiest places to change it:\nlabels, colours, default values, lists/arrays, formulas, chart settings.\nFor each, quote the exact line(s) to edit.<\/p>\n<p>7. RISKS &amp; LIMITS — Anything fragile, insecure, or that won't\nscale (e.g., data lost on refresh, hard-coded keys, no validation).<\/p>\n<p>End with 3 suggested modifications a business user might want,\nphrased as prompts I can send you next.<\/p>\n<p>Section 6 is the one that matters most. It turns an unfamiliar file\ninto a short list of dials you can turn.<\/p>\n<p><img src=\"imgs/v08_0.jpg\" alt=\"\"><\/p>\n<p><strong>What the AI returns (abridged)<\/strong><\/p>\n<p><strong>What it does.<\/strong> A personal or team expense log. Users\nrecord spends, see a running total in rupees, and view the split by\ncategory as a doughnut chart.<\/p>\n<p><strong>What the user sees.<\/strong> A title; a form with\ndescription, amount, category dropdown and an \"Add expense\" button; a\nlist of expenses with amounts; a total; a doughnut chart.<\/p>\n<p><strong>How it works.<\/strong> On submit, the form handler stops the\npage reload, adds the new row to the expenses array and calls render().\nrender() rebuilds the list, recomputes the total, groups amounts by\ncategory and redraws the chart.<\/p>\n<p><strong>What it uses.<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Dependency<\/strong><\/th>\n<th><strong>Purpose<\/strong><\/th>\n<th><strong>Offline?<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Chart.js 4.4.1 (cdnjs)<\/td>\n<td>Draws the doughnut chart<\/td>\n<td>Chart breaks offline<\/td>\n<\/tr><tr>\n<td>Google Fonts: Sora, Manrope<\/td>\n<td>Heading and body type<\/td>\n<td>Falls back to system font<\/td>\n<\/tr><tr>\n<td>localStorage<\/td>\n<td>Saves expenses in this browser<\/td>\n<td>Works offline; not shared across devices<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Data.<\/strong> Starts from four hard-coded sample rows. New\nrows come from the form and are saved to the browser's localStorage.\nNothing leaves the device.<\/p>\n<p><strong>Customisation points.<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Change<\/strong><\/th>\n<th><strong>Where to edit<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Categories<\/td>\n<td>The &lt;option&gt; tags in &lt;select&gt; and the\nmatching keys in COLORS<\/td>\n<\/tr><tr>\n<td>Category colours<\/td>\n<td>const COLORS = { Travel: \"#0f6e7a\", … }<\/td>\n<\/tr><tr>\n<td>Currency<\/td>\n<td>const rupee = n =&gt; \"₹\" + n.toLocaleString(\"en-IN\")<\/td>\n<\/tr><tr>\n<td>Sample data<\/td>\n<td>The let expenses = [ … ] array<\/td>\n<\/tr><tr>\n<td>Brand colour<\/td>\n<td>--accent in :root<\/td>\n<\/tr><tr>\n<td>Chart type<\/td>\n<td>type: \"doughnut\" (try \"bar\" or \"pie\")<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><strong>Risks and limits.<\/strong> Data lives in one browser only and\nis lost if site data is cleared. No date field, so no monthly view.\nDescriptions are inserted as raw HTML, so pasted tags would render. No\ndelete or edit button.<\/p>\n<p><strong>Modifying it to fit your needs<\/strong><\/p>\n<p>The extraction gives you the vocabulary. Now each change prompt can\nname the exact part to touch. Good modification prompts follow one\npattern: <strong>what to change + where it lives + what must stay the\nsame.<\/strong><\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Goal<\/strong><\/th>\n<th><strong>Prompt to send<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Rebrand<\/td>\n<td>\"Change --accent to our navy #1E2761 and the heading font to DM\nSerif Display. Keep everything else.\"<\/td>\n<\/tr><tr>\n<td>Fit your categories<\/td>\n<td>\"Replace the four categories with Client Travel, Training, Licences,\nMisc. Update the dropdown and COLORS together.\"<\/td>\n<\/tr><tr>\n<td>Add a field<\/td>\n<td>\"Add a date input to the form, show the date in each list row, and\nsort the list newest first.\"<\/td>\n<\/tr><tr>\n<td>Add a control<\/td>\n<td>\"Add a delete button on each row that removes it and re-renders the\ntotal and chart.\"<\/td>\n<\/tr><tr>\n<td>Fix a risk<\/td>\n<td>\"Escape the description text before inserting it into the list, so\npasted HTML shows as plain text.\"<\/td>\n<\/tr><tr>\n<td>Get data out<\/td>\n<td>\"Add an 'Export CSV' button that downloads all expenses.\"<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p><img src=\"imgs/v08_1.jpg\" alt=\"\"><\/p>\n<p>Three habits keep edits safe:<\/p>\n<ul>\n<li><p><strong>One change per prompt.<\/strong> Test the page after each.\nIf something breaks, you know which prompt caused it.<\/p><\/li>\n<li><p><strong>Ask for the full file back.<\/strong> \"Return the complete\nupdated file\" avoids pasting fragments into the wrong place.<\/p><\/li>\n<li><p><strong>Re-run the extraction after big changes.<\/strong> A fresh\nbrief catches new dependencies or risks the edits introduced.<\/p><\/li>\n<\/ul>\n<p><strong>The takeaway<\/strong><\/p>\n<p>You don't need to understand code to adapt it. You need a reliable\nway to get a map of it. Upload, extract, then modify: three steps that\nturn any working HTML file into a starting point you own.<\/p>", "excerpt": "You don't need to read code to own it Every HTML file is a complete, self-describing app. The layout, the styling, the logic and the libraries it borrows all si"}, {"part": 0, "title": "Publish on GitHub", "kind": "Article", "imgs": ["imgs/v09_0.jpg", "imgs/v09_1.jpg"], "thumb": "imgs/v09_1_t.jpg", "inline": false, "html": "<p><strong>Publishing your HTML on GitHub<\/strong><\/p>\n<p>You have built something. A dashboard, a calculator, a one-page\nexplainer. It sits in your Downloads folder as a single .html file, and\nit works perfectly when you double-click it.<\/p>\n<p>Then someone asks you to send it, and the problem starts. Email\nstrips it or flags it. WhatsApp won't take it. You put it on Drive and\nthe recipient gets a download prompt and a file their browser refuses to\nopen properly. The thing you made is trapped on your own machine.<\/p>\n<p>What you need is a link. GitHub Pages gives you one, free, in about\nfive minutes.<\/p>\n<p><strong>What GitHub Pages actually is<\/strong><\/p>\n<p>GitHub is where the world's code lives. Pages is a feature buried in\nits settings that says: take the files in this folder and serve them as\na website. No server to rent, no hosting bill, no deployment pipeline.\nYou put an HTML file in a folder, flip a switch, and it has a public\naddress.<\/p>\n<p>This works because the files you have been vibe coding are\n<em>static<\/em> — everything happens inside the visitor's browser. There\nis no database, nothing running on a server. That is precisely the kind\nof thing Pages was built to host.<\/p>\n<p><strong>The five-minute version<\/strong><\/p>\n<p><strong>1. Make an account<\/strong> at github.com. Free is\nenough.<\/p>\n<p><strong>2. Create a repository.<\/strong> Top-right <strong>+<\/strong>\n→ <strong>New repository<\/strong>. A repository — \"repo\" — is just a\nfolder. Name it something short and lowercase, like sales-dashboard. Set\nit to <strong>Public<\/strong>. Tick <strong>Add a README file<\/strong>.\nCreate.<\/p>\n<p>On a free account, Pages only works on public repositories. Anyone\nwho finds the URL can see your page, and anyone on GitHub can read the\nfile. Paid tiers (Pro, Team) allow private repos with Pages.<\/p>\n<p><strong>3. Upload your file.<\/strong> On the repo page, <strong>Add\nfile<\/strong> → <strong>Upload files<\/strong>. Drag your HTML file in.\nScroll down, click <strong>Commit changes<\/strong>. No command line\ninvolved.<\/p>\n<p><strong>4. Turn Pages on.<\/strong> Go to the\n<strong>Settings<\/strong> tab → <strong>Pages<\/strong> in the left\nsidebar (under \"Code and automation\"). Under <strong>Build and\ndeployment<\/strong>, set Source to <strong>Deploy from a\nbranch<\/strong>, pick branch <strong>main<\/strong> and folder <strong>/\n(root)<\/strong>, and Save.<\/p>\n<p><strong>5. Wait a minute, then refresh.<\/strong> A green banner\nappears with your URL. It will look like:<\/p>\n<p>https://yourname.github.io/sales-dashboard/<\/p>\n<p>GitHub says publishing can take up to ten minutes. It is usually\nunder one. Send the link.<\/p>\n<p><strong>The one rule that trips everyone up<\/strong><\/p>\n<p><strong>Name your file index.html.<\/strong><\/p>\n<p>index.html is what a web server looks for when someone visits a\nfolder. If your file is called dashboard_final_v3.html, the bare URL\nshows an error or an ugly file listing, and the actual page only loads\nat .../dashboard_final_v3.html. Rename it before you upload and this\nproblem disappears.<\/p>\n<p>Two related gotchas: web servers are <strong>case-sensitive<\/strong>\nin a way Windows is not, so Index.html is a different file from\nindex.html. And <strong>avoid spaces<\/strong> in file names — they turn\ninto %20 in the URL.<\/p>\n<p><strong>Updating it<\/strong><\/p>\n<p>Upload the new version of index.html over the old one. Same URL, new\ncontent, live in about a minute.<\/p>\n<p>If you don't see your change, your browser has cached the old page.\nHard refresh with <strong>Ctrl+Shift+R<\/strong> (Cmd+Shift+R on Mac)\nbefore you assume something broke.<\/p>\n<p><strong>Before you click publish<\/strong><\/p>\n<p>A public repo is genuinely public, and \"anyone with the link\"\nincludes search engines.<\/p>\n<p>Open your HTML file and look at the data you hardcoded into it. If\nyour demo dashboard contains a client's actual sales numbers, real\ncustomer names, or internal margins, that is now on the open internet\nwith your name attached. Replace it with dummy data first. Same for API\nkeys — a key pasted into client-side HTML is visible to anyone who views\nthe source, and will be scraped within hours.<\/p>\n<p><strong>What this gives you, and what it doesn't<\/strong><\/p>\n<p>You get a real, permanent, shareable URL that works on any device and\nopens instantly — good enough for a client demo, a handbook example, a\ntool your team uses daily. You can point your own domain at it later if\nyou want.<\/p>\n<p>You don't get anything that needs a server: no login, no saving data\nbetween visits, no hiding anything behind a password. Those need a\ndifferent class of tool.<\/p>\n<p>For 90% of what you will build in this handbook, Pages is the whole\nanswer.<\/p>", "excerpt": "Publishing your HTML on GitHub You have built something. A dashboard, a calculator, a one-page explainer. It sits in your Downloads folder as a single .html fil"}, {"part": 1, "title": "Create Prototypes", "kind": "Article", "imgs": ["imgs/v10_0.jpg"], "thumb": "imgs/v10_0_t.jpg", "inline": false, "html": "<p>Google Stitch<\/p>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://stitch.withgoogle.com/\">https://stitch.withgoogle.com/<\/a><\/p>", "excerpt": "Google Stitch https://stitch.withgoogle.com/"}, {"part": 1, "title": "Editable Table from Excel", "kind": "Article", "imgs": ["imgs/v11_0.jpg", "imgs/v11_1.jpg"], "thumb": "imgs/v11_1_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Turn the attached table (Excel file, CSV or screenshot) into a single\nself-contained HTML page with an interactive table.<\/p>\n<p>DATA<\/p>\n<ul>\n<li><p>Read every row and column exactly as given. Keep the original\ncolumn names and order. If it's a screenshot, transcribe it carefully\nand tell me any cell you couldn't read.<\/p><\/li>\n<li><p>Detect each column's type: number, date, category (6 or fewer\nrepeating values) or text. Store dates as YYYY-MM-DD. Strip ₹, commas\nand % when storing numbers, but show them again on screen.<\/p><\/li>\n<li><p>Put the data in a JS array at the top of the script so I can swap\nit later.<\/p><\/li>\n<\/ul>\n<p>FEATURES<\/p>\n<ol type=\"1\">\n<li><p>Date picker: date columns use a calendar input when editing, and\na from–to date filter.<\/p><\/li>\n<li><p>Conditional colours: red-to-green tint on number columns (higher\n= better unless I say otherwise). Coloured pills for category columns\n(Paid/Done = green, Pending = amber, Overdue/Failed = red).<\/p><\/li>\n<li><p>Sort: click a header to cycle ascending → descending → off.\nBlanks always sort last.<\/p><\/li>\n<li><p>Filter:<\/p>\n<ul>\n<li><p>a global search box<\/p><\/li>\n<li><p>a filter under each header: dropdown for categories, \"contains\"\nfor text, &gt;, &lt;, or a–b range for numbers, from–to for\ndates<\/p><\/li>\n<li><p>\"Showing X of Y rows\" and a Clear filters link<\/p><\/li>\n<\/ul><\/li>\n<li><p>Column profile: one card per column showing type and filled/blank\ncounts. For numbers: sum, mean, min, max and a mini histogram. For\ndates: earliest and latest. For text: distinct count and top 3 values.\nRecalculate on the filtered rows.<\/p><\/li>\n<li><p>Add, edit, delete:<\/p>\n<ul>\n<li><p>\"+ Add row\" button<\/p><\/li>\n<li><p>✎ edits a row inline with inputs that match the column type\n(Enter saves, Esc cancels)<\/p><\/li>\n<li><p>✕ deletes a row, with an Undo toast<\/p><\/li>\n<\/ul><\/li>\n<li><p>Export: \"Export CSV\" and \"Export Excel\" (.xlsx via SheetJS) of\nthe currently filtered and sorted rows, with real numbers and dates in\nExcel.<\/p><\/li>\n<li><p>Load file: a \"Load Excel / CSV\" button that replaces the data\nfrom any single-sheet file and re-detects column types.<\/p><\/li>\n<\/ol>\n<p>DESIGN<\/p>\n<ul>\n<li><p>Clean, professional look: [brand colour, e.g. navy #1E2761],\n[heading font] for the title, [body font] for the rest. Light and dark\nmode.<\/p><\/li>\n<li><p>Sticky header. Numbers right-aligned in tabular figures. Dates\nshown as 04 Jul 2026. Indian number format (₹1,84,500).<\/p><\/li>\n<li><p>Works on a phone: the table scrolls sideways inside its card,\nwith no page-level horizontal scroll.<\/p><\/li>\n<\/ul>\n<p>TECHNICAL<\/p>\n<ul>\n<li><p>One HTML file. The only external script is SheetJS from\ncdnjs.<\/p><\/li>\n<li><p>Escape all cell text before inserting it into the page.<\/p><\/li>\n<li><p>Save edits in localStorage, wrapped in try/catch, with a \"Reset\"\noption.<\/p><\/li>\n<\/ul>", "excerpt": "Prompt: Turn the attached table (Excel file, CSV or screenshot) into a single self-contained HTML page with an interactive table. DATA Read every row and column"}, {"part": 1, "title": "Editable HTML from Image", "kind": "Article", "imgs": ["imgs/v12_0.jpg", "imgs/v12_1.jpg"], "thumb": "imgs/v12_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Recreate this perfectly using html. Page must be editable.<\/p>", "excerpt": "Prompt: Recreate this perfectly using html. Page must be editable."}, {"part": 1, "title": "Create Dashboard from own Excel", "kind": "Article", "imgs": ["imgs/v13_0.jpg", "imgs/v13_1.jpg", "imgs/v13_2.jpg", "imgs/v13_3.jpg"], "thumb": "imgs/v13_0_t.jpg", "inline": false, "html": "<p>Build me a single, self-contained HTML file that works as an Excel\ndashboard. When I open it in a browser, I upload my Excel file, and the\ndashboard builds itself from the data. Nothing should be sent to a\nserver; all processing happens in the browser.<\/p>\n<p>TECH:<\/p>\n<ul>\n<li><p>One .html file with HTML, CSS and JavaScript inline<\/p><\/li>\n<li><p>Use SheetJS (xlsx) from cdnjs to read the Excel file<\/p><\/li>\n<li><p>Use Chart.js from cdnjs for charts<\/p><\/li>\n<li><p>No frameworks, no build step<\/p><\/li>\n<\/ul>\n<p>EXCEL FILE STRUCTURE (what the uploaded file will contain):<\/p>\n<p>Sheet \"Raw_Data\": headers in row 1, data from row 2<\/p>\n<div class=\"tw\"><table><thead><tr>\n<th><strong>Header<\/strong><\/th>\n<th><strong>Type<\/strong><\/th>\n<th><strong>Notes<\/strong><\/th>\n<\/tr><\/thead><tbody><tr>\n<td>Order_ID<\/td>\n<td>Text<\/td>\n<td>Unique<\/td>\n<\/tr><tr>\n<td>Order_Date<\/td>\n<td>Date<\/td>\n<td>May arrive as an Excel serial number; convert it<\/td>\n<\/tr><tr>\n<td>Region<\/td>\n<td>Text<\/td>\n<td>North / South / East / West<\/td>\n<\/tr><tr>\n<td>Product_Cat<\/td>\n<td>Text<\/td>\n<td>6 categories<\/td>\n<\/tr><tr>\n<td>Sales_Rep<\/td>\n<td>Text<\/td>\n<td>~25 reps<\/td>\n<\/tr><tr>\n<td>Units<\/td>\n<td>Number<\/td>\n<td><\/td>\n<\/tr><tr>\n<td>Revenue<\/td>\n<td>Number (INR)<\/td>\n<td><\/td>\n<\/tr><tr>\n<td>Cost<\/td>\n<td>Number (INR)<\/td>\n<td><\/td>\n<\/tr><tr>\n<td>Status<\/td>\n<td>Text<\/td>\n<td>Delivered / Pending / Returned<\/td>\n<\/tr><\/tbody><\/table><\/div>\n<p>Sheet \"Targets\": headers in row 3, starting at column B<br />\n| Region | Month (1st of month) | Target_Revenue |<\/p>\n<p>BUSINESS RULES:<\/p>\n<ul>\n<li><p>Financial year is April to March<\/p><\/li>\n<li><p>Margin % = (Revenue - Cost) / Revenue<\/p><\/li>\n<li><p>Exclude \"Returned\" orders from revenue, cost and margin<\/p><\/li>\n<li><p>Show money in Indian format (₹12,34,567) and KPIs in\nlakhs<\/p><\/li>\n<\/ul>\n<p>UPLOAD SCREEN:<\/p>\n<ul>\n<li><p>A centred card with a drag-and-drop zone and a \"Browse\"\nbutton<\/p><\/li>\n<li><p>Accept .xlsx and .xls only<\/p><\/li>\n<li><p>After upload, check that both sheets and all required columns\nexist.<br />\nIf anything is missing, show a clear message naming exactly what's<br />\nmissing. Don't fail silently.<\/p><\/li>\n<li><p>Show the file name and row count once the file loads, plus\na<br />\n\"Load another file\" button<\/p><\/li>\n<\/ul>\n<p>DASHBOARD LAYOUT (shown after a successful upload):<\/p>\n<ul>\n<li><p>Header bar: \"Sales Performance Dashboard – FY26\", navy\nbackground<\/p><\/li>\n<li><p>Filter bar under the header: dropdowns for Region, Product_Cat\nand<br />\nStatus (each with \"All\"), a date range picker, and a \"Reset\"\nbutton<\/p><\/li>\n<li><p>Row 1: four KPI cards<\/p>\n<ol type=\"1\">\n<li><p>Total Revenue (₹ lakhs)<\/p><\/li>\n<li><p>Total Units<\/p><\/li>\n<li><p>Margin %<\/p><\/li>\n<li><p>Revenue vs Target (% achieved, green if ≥100%, red if\nbelow)<\/p><\/li>\n<\/ol><\/li>\n<li><p>Row 2: Monthly revenue trend (line, with target as a dashed line)\n|<br />\nRevenue by region (column, data labels on)<\/p><\/li>\n<li><p>Row 3: Category mix (doughnut) |<br />\nTop 10 sales reps (horizontal bar, sorted descending)<\/p><\/li>\n<li><p>Row 4: Detail table of filtered orders, sortable by clicking\nheaders,<br />\nwith a search box, 25 rows per page, and \"Export to CSV\"<\/p><\/li>\n<\/ul>\n<p>INTERACTIVITY:<\/p>\n<ul>\n<li><p>Every KPI, chart and the table updates instantly when any filter\nchanges<\/p><\/li>\n<li><p>Clicking a bar in \"Revenue by region\" sets the Region\nfilter<\/p><\/li>\n<li><p>Charts show tooltips with formatted values<\/p><\/li>\n<\/ul>\n<p>DESIGN:<\/p>\n<ul>\n<li><p>Primary #1E2761 (navy), accent #F28C28 (orange), background\n#F5F6FA<\/p><\/li>\n<li><p>Cards: white, 8px radius, soft shadow<\/p><\/li>\n<li><p>Doughnut colours: navy, orange, then navy tints<\/p><\/li>\n<li><p>Font: Inter from Google Fonts, falling back to system\nsans-serif<\/p><\/li>\n<li><p>Responsive: 2-column grid on desktop, single column on\nmobile<\/p><\/li>\n<li><p>No 3D effects, no clutter<\/p><\/li>\n<\/ul>\n<p>CODE QUALITY:<\/p>\n<ul>\n<li><p>Keep data loading, filtering, KPI calculation and chart rendering\nin<br />\nseparate, clearly commented functions<\/p><\/li>\n<li><p>Destroy and redraw charts on filter change (no memory\nleaks)<\/p><\/li>\n<\/ul>\n<p>Before writing the code, restate the data structure and business\nrules in 5 lines and list any assumptions. Then give me the complete\nfile. After the code, tell me how to test it, and generate a small\nsample Excel structure I can create to try it out.<\/p>\n<p> <img\nsrc=\"m/media/image53.png\"\nstyle=\"width:6.02832in;height:10.3865in\" /><\/p>", "excerpt": "Build me a single, self-contained HTML file that works as an Excel dashboard. When I open it in a browser, I upload my Excel file, and the dashboard builds itse"}, {"part": 1, "title": "Slicers", "kind": "Article", "imgs": ["imgs/v14_0.jpg"], "thumb": "imgs/v14_0_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file HTML page that shows 10 types of dashboard\nslicers as a reference gallery.<\/p>\n<p>Layout:<\/p>\n<p>- A 5 × 2 grid of equal-height cards with a thin black border.<\/p>\n<p>- Each card has a bold numbered title, a small grey subtitle\ndescribing the behaviour, the slicer itself, and a footer line\n\"Selected: …\" that updates live as you interact.<\/p>\n<p>The 10 slicers:<\/p>\n<p>1. Tile (button) slicer: multi-select tiles North, South, East,\nWest.<\/p>\n<p>2. Dropdown slicer: single select, default \"All\".<\/p>\n<p>3. List slicer: single-select list (Electronics, Furniture, Apparel,\nGrocery); clicking the selected item again clears it.<\/p>\n<p>4. Checkbox slicer: Select all, then Retail, Wholesale, Online,\nExport.<\/p>\n<p>5. Chip slicer: multi-select pill chips (New, Bestseller, Sale,\nPremium, Eco, Limited).<\/p>\n<p>6. Toggle (switch) slicer: In stock only, Discounted, Include\nreturns; the footer shows which are on.<\/p>\n<p>7. Segmented slicer: Monthly / Quarterly / Yearly, single select.<\/p>\n<p>8. Range (between) slicer: dual-handle slider from 0 to 100, default\n20–70.<\/p>\n<p>9. Date range slicer: From and To date inputs; the footer shows the\nperiod as \"1 Jan 2026 to 21 Sept 2026\".<\/p>\n<p>10. Search slicer: a text box that filters a scrollable list of\ncustomer names.<\/p>\n<p>Behaviour:<\/p>\n<p>- When nothing is selected, the footer shows \"All\" (or \"None\" for the\ntoggles).<\/p>\n<p>- Selected states are inverted to a black fill with white text.<\/p>\n<p>Style:<\/p>\n<p>- Minimal black-and-white wireframe look, sans-serif font, light grey\npage background.<\/p>\n<p>- No colour accents.<\/p>\n<p>- Responsive, so cards wrap to fewer columns on smaller screens.<\/p>\n<p>- Plain HTML, CSS and JS with no libraries.<\/p>\n<p><strong>Simplified Prompt:<\/strong><\/p>\n<p>Slicers and sample data:<\/p>\n<p>1. Tile buttons (multi-select): North, South, East, West<\/p>\n<p>2. Dropdown (single): All, Electronics, Furniture, Apparel,\nGrocery<\/p>\n<p>3. List (single, click again to clear): Electronics, Furniture,\nApparel, Grocery<\/p>\n<p>4. Checkboxes with Select all: Retail, Wholesale, Online, Export<\/p>\n<p>5. Chips (multi-select): New, Bestseller, Sale, Premium, Eco,\nLimited<\/p>\n<p>6. Toggle switches: In stock only, Discounted, Include returns<\/p>\n<p>7. Segmented control (single): Monthly, Quarterly, Yearly<\/p>\n<p>8. Dual-handle range slider: price 0 to 100<\/p>\n<p>9. Date range: From and To date pickers<\/p>\n<p>10. Search box that filters a list of 10 Indian customer names<\/p>\n<p>Selected items should invert (black fill, white text). No external\nlibraries.<\/p>", "excerpt": "Prompt: Build a single-file HTML page that shows 10 types of dashboard slicers as a reference gallery. Layout: - A 5 × 2 grid of equal-height cards with a thin "}, {"part": 1, "title": "Infographic", "kind": "Article", "imgs": ["imgs/v15_0.jpg", "imgs/v15_1.jpg", "imgs/v15_2.jpg", "imgs/v15_3.jpg"], "thumb": "imgs/v15_1_t.jpg", "inline": false, "html": "<p><strong>Prompt:<\/strong><\/p>\n<p>Show insights in the format as the McKinsey one given.<\/p>\n<p>Use my logo and colors.<\/p>\n<p>Create an infographic.<\/p>", "excerpt": "Prompt: Show insights in the format as the McKinsey one given. Use my logo and colors. Create an infographic."}, {"part": 1, "title": "D3js Charts", "kind": "Article", "imgs": ["imgs/v16_0.jpg", "imgs/v16_1.jpg"], "thumb": "imgs/v16_0_t.jpg", "inline": false, "html": "<p><a target=\"_blank\" rel=\"noopener\" href=\"https://d3js.org/\">https://d3js.org/<\/a><\/p>\n\n\n<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file HTML bar chart race using D3.js that shows annual\nrevenue by Indian city from 2015 to 2026.<\/p>\n<p>Data:<\/p>\n<p>- Sample revenue in ₹ Crore for 15 cities: Mumbai, Delhi NCR,\nBengaluru, Hyderabad, Chennai, Pune, Kolkata, Ahmedabad and others.<\/p>\n<p>- Values should grow and change rank over the years so the race is\ninteresting.<\/p>\n<p>Controls bar at the top:<\/p>\n<p>- A Play / Pause button.<\/p>\n<p>- A year slider from 2015 to 2026, draggable to any point in time,\nwith the current year shown beside it.<\/p>\n<p>- Speed toggle: 0.5x / 1x / 2x.<\/p>\n<p>- Show toggle: Top 5 / Top 10 / All 15.<\/p>\n<p>Chart:<\/p>\n<p>- Horizontal bars sorted largest to smallest; bars smoothly reorder,\ngrow and shrink between years.<\/p>\n<p>- Each city keeps the same distinct colour throughout.<\/p>\n<p>- City name on the left of each bar and the value at the bar's end\n(e.g. \"₹ 616 Cr\").<\/p>\n<p>- A ₹ axis along the top with light vertical gridlines.<\/p>\n<p>- A large faded year watermark in the bottom-right, with \"Total, all\n15 cities: ₹ X Cr\" beneath it.<\/p>\n<p>- Hovering a bar shows a tooltip with the city, year, revenue and\nrank.<\/p>\n<p>Footer: a small caption explaining the chart on the left, and \"Sample\ndata · Built with D3.js\" on the right.<\/p>\n<p>Style: clean white card on a light grey background, a blue accent for\nthe active buttons, sans-serif font, responsive width.<\/p>", "excerpt": "https://d3js.org/ Prompt: Build a single-file HTML bar chart race using D3.js that shows annual revenue by Indian city from 2015 to 2026. Data: - Sample revenue"}, {"part": 1, "title": "Plotly Charts", "kind": "Article", "imgs": ["imgs/v17_0.jpg", "imgs/v17_1.jpg"], "thumb": "imgs/v17_0_t.jpg", "inline": false, "html": "<p><a target=\"_blank\" rel=\"noopener\" href=\"https://plotly.com/\">https://plotly.com/<\/a><\/p>\n\n\n<p><strong>Prompt:<\/strong><\/p>\n<p>Build a single-file HTML animated waterfall chart using Plotly.js\nthat bridges revenue to operating profit for FY 2025, in ₹ Crore.<\/p>\n<p>Data (sample):<\/p>\n<p>- Revenue: 1,248<\/p>\n<p>- Cost of goods: −742<\/p>\n<p>- Gross profit: 506 (subtotal)<\/p>\n<p>- Sales &amp; marketing: −186<\/p>\n<p>- R&amp;D: −92<\/p>\n<p>- General &amp; admin: −78<\/p>\n<p>- Other income: +18<\/p>\n<p>- Operating profit: 168 (total)<\/p>\n<p>KPI strip at the top:<\/p>\n<p>- Revenue, Gross profit, Operating profit and Operating margin\n(13.5%).<\/p>\n<p>- Show the profit figures in green.<\/p>\n<p>Controls on the top right:<\/p>\n<p>- A Replay button.<\/p>\n<p>- Speed toggle: 0.5x / 1x / 2x.<\/p>\n<p>- Notes toggle: On / Off.<\/p>\n<p>Chart:<\/p>\n<p>- Plotly waterfall with dotted connector lines between bars.<\/p>\n<p>- Colours: blue for revenue, subtotals and totals; red for costs;\ngreen for income.<\/p>\n<p>- Value labels inside or on each bar.<\/p>\n<p>- The y-axis is labelled ₹ Cr, with light gridlines.<\/p>\n<p>- Bars build one at a time in sequence when the page loads and when\nReplay is clicked.<\/p>\n<p>- Hovering a bar shows its name, value and running total.<\/p>\n<p>Annotations (shown when Notes is On):<\/p>\n<p>- Callout boxes with leader lines:<\/p>\n<p>- Revenue up 12.4% on FY 2024.<\/p>\n<p>- Cost of goods at 59.5% of revenue, 1.2 pts better than FY 2024.<\/p>\n<p>- Gross margin 40.5%.<\/p>\n<p>- Sales &amp; marketing includes a ₹ 48 Cr festive campaign.<\/p>\n<p>- Operating margin 13.5%, up 2.1 pts on FY 2024.<\/p>\n<p>Footer: a caption on the left explaining the chart, and \"Sample data\n· Built with Plotly.js\" on the right.<\/p>\n<p>Style: clean white card on a light grey background with a thin blue\ntop border, a blue accent for the active buttons, sans-serif font,\nresponsive width.<\/p>", "excerpt": "https://plotly.com/ Prompt: Build a single-file HTML animated waterfall chart using Plotly.js that bridges revenue to operating profit for FY 2025, in ₹ Crore. "}, {"part": 1, "title": "SVG", "kind": "Article", "imgs": ["imgs/v18_0.jpg"], "thumb": "imgs/v18_0_t.jpg", "inline": true, "html": "<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.adobe.com/in/creativecloud/file-types/image/vector/svg-file.html\">https://www.adobe.com/in/creativecloud/file-types/image/vector/svg-file.html<\/a><\/p>\n<p>The SVG file format is a popular tool for displaying two-dimensional\ngraphics, charts and illustrations on websites. Plus, as a vector file,\nit can be scaled up or down without losing any of its resolution.<\/p>\n<p><img src=\"imgs/v18_0.jpg\" alt=\"\"><\/p>\n<p><strong>Prompt:<\/strong><\/p>\n<p>Create a detailed, animated isometric diagram of truck inward and\noutward movement at a Tata Motors plant, as a single self-contained HTML\nfile with the scene drawn in SVG.<\/p>\n<p>STYLE<\/p>\n<ul>\n<li><p>Isometric view, simple flat colours (blue, orange, grey, green on\na light background).<\/p><\/li>\n<li><p>No company logo. Add a small note: \"Illustrative layout, not to\nscale. Weights, times and document numbers are sample values.\"<\/p><\/li>\n<\/ul>\n<p>SCENE<\/p>\n<ul>\n<li><p>Plant boundary wall, an inward road and an outward road, each\nwith a security gate, cabin and animated boom barrier.<\/p><\/li>\n<li><p>Two weighbridges (WB-01 on the inward lane, WB-02 on the outward\nlane), each with a cabin.<\/p><\/li>\n<li><p>A Stores / GRN building with an unloading dock, an Assembly Shop,\ntrees and greenery.<\/p><\/li>\n<li><p>Keep every stop visible: no building may hide the truck or a step\nmarker.<\/p><\/li>\n<li><p>Moving dashed route lines: blue for inward, green for outward,\nwith direction arrows.<\/p><\/li>\n<\/ul>\n<p>ANIMATION (5 steps, about a 40-second loop) A loaded truck drives in,\nstops at each step, then exits:<\/p>\n<ol type=\"1\">\n<li><p>Gate-In &amp; Security: invoice, e-way bill, ASN and driver ID\nchecked; barrier lifts.<\/p><\/li>\n<li><p>Weighbridge (gross): WB-01 counts up to 24.60 T, logged against\nthe PO.<\/p><\/li>\n<li><p>Unloading &amp; GRN: truck docks at Stores, cargo empties, crates\nappear on the dock, QC done, GRN posted.<\/p><\/li>\n<li><p>Weighbridge (tare): WB-02 reads 9.80 T, net 14.80 T reconciled,\ngate pass issued.<\/p><\/li>\n<li><p>Gate-Out &amp; Exit: gate pass verified, barrier lifts, truck\nexits, turnaround time logged.<\/p><\/li>\n<\/ol>\n<p>ON-SCREEN INFORMATION<\/p>\n<ul>\n<li><p>Numbered markers in the scene: they pulse when active and turn\ninto a green tick when done.<\/p><\/li>\n<li><p>A callout beside the active step showing live status (e.g.\n\"Unloading… 60%\", \"Gross weight 24.60 T\").<\/p><\/li>\n<li><p>A side panel with 5 step cards (title, two-line description,\nprogress bar) that highlight as the truck moves.<\/p><\/li>\n<li><p>A dark \"Vehicle Log\" panel with a plant clock that fills in\nmaterial, gate-in time, gross weight, GRN number, tare weight, net\nweight, and gate-out time with TAT.<\/p><\/li>\n<li><p>A legend for the inward route, outward route and process\nstep.<\/p><\/li>\n<\/ul>\n<p>CONTROLS<\/p>\n<ul>\n<li><p>Pause / Play button.<\/p><\/li>\n<li><p>Previous / Next step buttons.<\/p><\/li>\n<li><p>Clicking a step card or scene marker replays the truck into that\nstep, then holds there.<\/p><\/li>\n<li><p>Keyboard: ← → change step, 1–5 jump to a step, Space pauses or\nplays.<\/p><\/li>\n<\/ul>\n<p>DOWNLOADS (inside the page, must work offline)<\/p>\n<ul>\n<li><p>\"Download MP4 (1080p)\" and \"Download GIF\" buttons under the\nscene, with a progress bar.<\/p><\/li>\n<li><p>Each renders the full loop in the browser and saves the file,\nleaving the control buttons out of the output.<\/p><\/li>\n<li><p>MP4: 1920 px wide, 30 fps, H.264 via the browser's WebCodecs\nencoder plus mp4-muxer. Fall back to a real-time MediaRecorder recording\n(WebM) where MP4 isn't supported, and say so.<\/p><\/li>\n<li><p>GIF: 1000 px wide, a
